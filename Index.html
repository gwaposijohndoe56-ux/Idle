<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>IDLE — free period arcade</title>
<style>
/* ============================================================
   DESIGN SYSTEM — "passed note on ruled paper"
   Palette anchored to the physical classroom: cream ruled paper
   (#F7F1E2), margin rule red, navy ink, highlighter yellow.
   Each game card is a coloured sticky note taped above the fold.
   Only gameplay surfaces (the "index card") are white for legibility.
   Signature: the ruled-paper full-bleed background with margin line.
   ============================================================ */
:root{
  --paper:#F7F1E2; --paper-deep:#ECE3CB; --paper-dark:#DFD5B8;
  --rule:rgba(80,108,190,.28); --margin:#D6555F;
  --ink:#1F2454; --ink-dim:#4D5280; --ink-faint:#8B8FB0;
  --card:#FFFDF7; --card-edge:#EDE7CC; --card-shadow:rgba(31,36,84,.14);
  --hl:#FFD23F; --hl-dark:#E8B800;
  --ok:#27A060; --ok-deep:#19734A;
  --warn:#E08A2B; --bad:#D6555F; --bad-deep:#A23842;
  /* game accent tokens */
  --c-mafia:#C23B4B; --c-mafia2:#7A1B2B;
  --c-spy:#1F9E89;   --c-spy2:#0B5C50;
  --c-ttt:#6957D6;   --c-ttt2:#3F2E96;
  --c-dice:#C46A1A;  --c-dice2:#6B3408;
  --c-wc:#27A060;    --c-wc2:#0E5232;
  --c-tq:#4A6FA5;    --c-tq2:#243558;
  --radius:18px; --radius-sm:12px; --maxw:480px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --fdisplay:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;
  --fmono:"SF Mono","Cascadia Code",Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font);color:var(--ink);background-color:var(--paper);
  background-image:
    repeating-linear-gradient(to bottom,transparent 0 27px,var(--rule) 27px 28px),
    linear-gradient(to right,transparent 0 30px,var(--margin) 30px 31.5px,transparent 31.5px 100%);
  min-height:100vh;overflow-x:hidden;
}
button,input,textarea,select{font-family:inherit;}
input,textarea,select{
  background:var(--card);border:1.5px solid var(--card-edge);border-radius:10px;
  padding:10px 12px;color:var(--ink);font-size:15px;width:100%;
}
textarea{resize:vertical;min-height:80px;}
input:focus,textarea:focus,select:focus{outline:2px solid var(--c-ttt);outline-offset:1px;}
::selection{background:var(--hl);}

/* ── layout ── */
#app{max-width:var(--maxw);margin:0 auto;padding:clamp(14px,4vw,22px) clamp(12px,4vw,20px) max(100px,calc(72px + env(safe-area-inset-bottom,0px)));min-height:100vh;}
.screen{animation:fadeUp .26s ease-out both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:none;}}
@keyframes popIn{from{opacity:0;transform:scale(.93);}to{opacity:1;transform:scale(1);}}
@keyframes pulseBig{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;}}

/* ── header row ── */
.hrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.hrow .htitle{font-weight:800;font-size:1.12rem;flex:1;line-height:1.2;}
.hrow .hsub{font-size:.78rem;color:var(--ink-dim);font-weight:600;margin-top:1px;}
.iconbtn{
  width:38px;height:38px;border-radius:50%;border:none;background:var(--card);
  box-shadow:0 2px 6px var(--card-shadow);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  transition:transform .1s;
}
.iconbtn:active{transform:scale(.9);}

/* ── buttons ── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:none;border-radius:var(--radius-sm);padding:13px 18px;font-weight:800;
  font-size:15px;cursor:pointer;transition:transform .1s,box-shadow .1s;
  box-shadow:0 3px 0 rgba(0,0,0,.13);
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.13);}
.btn-block{display:flex;width:100%;}
.btn-ink{background:var(--ink);color:var(--paper);}
.btn-accent{background:var(--c-ttt);color:#fff;}
.btn-ok{background:var(--ok);color:#fff;}
.btn-bad{background:var(--bad);color:#fff;}
.btn-ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);}
.btn-ghost:active{transform:translateY(2px);}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:10px;}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none;}
.brow{display:flex;gap:10px;flex-wrap:wrap;}
.brow .btn{flex:1;}

/* ── cards ── */
.card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 7px 20px var(--card-shadow);margin-bottom:14px;}
.card-tight{padding:10px;}
.deskcard{background:var(--card);border-radius:var(--radius);padding:24px 20px;box-shadow:0 10px 26px var(--card-shadow);text-align:center;}

/* ── typography helpers ── */
.slabel{font-size:.71rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 8px 1px;}
.helptext{font-size:.84rem;color:var(--ink-dim);line-height:1.48;}
.divider{height:1px;background:var(--paper-dark);margin:14px 0;border:none;}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:.74rem;font-weight:700;background:var(--paper-deep);color:var(--ink);}

/* ── stepper ── */
.stepper{display:flex;align-items:center;gap:14px;justify-content:center;}
.stepper button{width:40px;height:40px;border-radius:50%;border:none;background:var(--ink);color:var(--paper);font-size:20px;font-weight:800;cursor:pointer;}
.stepper button:active{transform:scale(.91);}
.stepper .val{font-family:var(--fmono);font-size:1.55rem;font-weight:800;min-width:44px;text-align:center;}

/* ── switch ── */
.switchrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;}
.switchrow .slbl{font-weight:700;font-size:.92rem;}
.switchrow .ssub{font-size:.77rem;color:var(--ink-dim);}
.switch{position:relative;width:46px;height:27px;border-radius:999px;background:var(--paper-dark);border:none;cursor:pointer;flex:0 0 auto;}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .14s;box-shadow:0 1px 3px rgba(0,0,0,.28);}
.switch.on{background:var(--ok);}
.switch.on::after{left:22px;}

/* ── list rows ── */
.llist{display:flex;flex-direction:column;gap:8px;}
.lrow{
  display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;
  background:var(--paper-deep);cursor:pointer;border:2px solid transparent;
  transition:transform .08s,border-color .1s;
}
.lrow:active{transform:scale(.98);}
.lrow.sel{border-color:var(--ink);background:var(--card);}
.lrow.dead{opacity:.42;text-decoration:line-through;cursor:default;}
.avatar{
  width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--paper);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.84rem;flex:0 0 auto;
}
.rname{font-weight:700;flex:1;font-size:.94rem;}

/* ── modal ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(31,36,84,.52);display:flex;align-items:center;
  justify-content:center;padding:20px;z-index:100;animation:popIn .14s ease-out both;
}
.modal-box{background:var(--card);border-radius:var(--radius);padding:22px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 16px 40px rgba(0,0,0,.28);}
.modal-box h3{margin:0 0 10px;font-size:1.05rem;}
.modal-box p,.modal-box li{font-size:.88rem;line-height:1.55;color:var(--ink-dim);}

/* ── timer ── */
.timer-disp{font-family:var(--fmono);font-size:2.8rem;font-weight:800;text-align:center;letter-spacing:.02em;}
.timer-disp.urgent{color:var(--bad);animation:pulseBig .6s infinite;}

/* ── hub ── */
.wordmark{font-family:var(--fdisplay);font-size:3rem;color:var(--ink);transform:rotate(-2.2deg);display:inline-block;line-height:1;}
.wm-badge{font-family:var(--fmono);font-size:.68rem;background:var(--hl);padding:2px 8px;border-radius:6px;transform:rotate(2.5deg);display:inline-block;}
.tagline{font-weight:700;color:var(--ink-dim);margin:3px 0 14px;font-size:.9rem;}
.ws-field{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.83rem;color:var(--ink-dim);margin-bottom:6px;}
.ws-field input{flex:1;border:none;border-bottom:2px dotted var(--paper-dark);background:transparent;padding:2px 4px;font-weight:700;color:var(--ink);}
.ws-field input:focus{outline:none;border-bottom-color:var(--c-ttt);}
.ws-blank{border-bottom:2px dotted var(--paper-dark);padding:2px 6px;font-weight:700;}
.gamecard-grid{display:flex;flex-direction:column;gap:18px;margin-top:6px;}
.gamecard{
  position:relative;border-radius:14px;padding:18px 16px 16px;cursor:pointer;color:#fff;
  box-shadow:0 10px 22px rgba(0,0,0,.18);transform:rotate(var(--r,0deg));
  transition:transform .15s,box-shadow .15s;
}
.gamecard:active{transform:rotate(var(--r,0deg)) scale(.97);}
.gamecard::before{
  content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-3deg);
  width:60px;height:18px;background:rgba(255,255,255,.52);border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.14);
}
.gc-top{display:flex;align-items:center;gap:9px;margin-bottom:5px;}
.gc-icon{font-size:1.75rem;}
.gc-title{font-weight:800;font-size:1.1rem;line-height:1.2;}
.gc-tag{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;background:rgba(255,255,255,.22);padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:7px;}
.gc-desc{font-size:.83rem;opacity:.93;line-height:1.4;}
.gc-mafia{background:linear-gradient(148deg,var(--c-mafia),var(--c-mafia2));}
.gc-spy{background:linear-gradient(148deg,var(--c-spy),var(--c-spy2));}
.gc-ttt{background:linear-gradient(148deg,var(--c-ttt),var(--c-ttt2));}
.gc-dice{background:linear-gradient(148deg,#C46A1A,#6B3408);}
.gc-wc{background:linear-gradient(148deg,#27A060,#0E5232);}
.gc-tq{background:linear-gradient(148deg,#4A6FA5,#243558);}
/* ── Liar's Dice ── */
.dice-grid{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:14px 0;}
@keyframes dieRoll{0%{opacity:0;transform:rotate(-20deg) scale(.75);}100%{opacity:1;transform:none;}}
.die{
  width:54px;height:54px;border-radius:13px;background:var(--card);
  box-shadow:0 4px 10px var(--card-shadow),inset 0 0 0 1.5px rgba(0,0,0,.07);
  display:flex;align-items:center;justify-content:center;font-size:2.1rem;
  animation:dieRoll .32s ease-out both;flex:0 0 auto;
}
.die:nth-child(1){animation-delay:0s}.die:nth-child(2){animation-delay:.06s}
.die:nth-child(3){animation-delay:.12s}.die:nth-child(4){animation-delay:.18s}
.die:nth-child(5){animation-delay:.24s}
.bid-faces{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:8px 0 14px;}
.face-btn{padding:10px 4px;border-radius:10px;border:2px solid transparent;background:var(--paper-deep);font-size:1.55rem;cursor:pointer;transition:border-color .1s,background .1s;}
.face-btn.sel{border-color:var(--ink);background:var(--card);}
/* ── Word Chain ── */
.wc-letter{font-size:5.5rem;font-weight:900;text-align:center;line-height:1;font-family:var(--fmono);color:var(--c-ttt);letter-spacing:-.02em;}
.wc-chain{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start;}
.wc-chip{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--paper-deep);color:var(--ink);}
.wc-chip.fresh{background:var(--hl);color:var(--ink);}
/* ── 20 Questions ── */
.tq-counter{font-family:var(--fmono);font-size:4.5rem;font-weight:900;text-align:center;line-height:1;transition:color .3s;}
.tq-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;}
.tq-log{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow-y:auto;}
.tq-log-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--paper-dark);font-size:.83rem;}
.gc-soon{border-radius:14px;padding:14px 16px;text-align:center;border:2px dashed var(--paper-dark);color:var(--ink-faint);font-weight:700;font-size:.83rem;transform:rotate(var(--r,0deg));}
.footer-note{text-align:center;margin-top:24px;font-size:.72rem;color:var(--ink-faint);font-weight:600;}

/* ── mute fab ── */
.mute-fab{position:fixed;top:max(14px,env(safe-area-inset-top,14px));right:max(14px,env(safe-area-inset-right,14px));z-index:40;}

/* ── confetti ── */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90;}

/* ── leave link ── */
.leave-link{text-align:center;margin-top:10px;}
.leave-link a{color:var(--ink-faint);font-size:.76rem;font-weight:700;text-decoration:none;}

/* ── pass-screen ── */
.pass-screen{background:var(--card);border-radius:var(--radius);padding:34px 22px;box-shadow:0 10px 28px var(--card-shadow);text-align:center;}
.pass-name{font-size:1.65rem;font-weight:800;margin:6px 0 10px;}
.reveal-card{background:var(--card);border-radius:var(--radius);padding:28px 20px;box-shadow:0 10px 28px var(--card-shadow);text-align:center;animation:popIn .22s ease-out both;}

/* ── UTTT board ── */
.uttt-wrap{user-select:none;}
.uttt-status{padding:10px 14px;border-radius:10px;background:var(--paper-deep);font-weight:800;font-size:.9rem;text-align:center;margin-bottom:12px;}
.meta-wrap{background:var(--ink);border-radius:18px;padding:8px;margin:4px 0;}
.meta-board{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.meta-cell{
  border-radius:10px;padding:5px;background:var(--paper-deep);
  border:3px solid transparent;transition:border-color .15s,background .15s;cursor:pointer;
}
@keyframes activeGlow{0%,100%{box-shadow:0 0 0 0 rgba(105,87,214,.35);}50%{box-shadow:0 0 0 5px rgba(105,87,214,.0);}}
.meta-cell.active-zone{border-color:var(--c-ttt);background:rgba(105,87,214,.07);animation:activeGlow 1.8s ease-in-out infinite;}
.meta-cell.won-X{background:rgba(217,54,75,.13);border-color:var(--c-mafia);}
.meta-cell.won-O{background:rgba(31,158,137,.13);border-color:var(--c-spy);}
.meta-cell.drawn-meta{background:var(--paper-dark);}
.mini-board{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:rgba(0,0,0,.3);border-radius:7px;overflow:hidden;padding:3px;}
.mini-cell{
  aspect-ratio:1;border-radius:3px;display:flex;align-items:center;justify-content:center;
  font-size:1.05rem;font-weight:900;cursor:pointer;background:rgba(255,255,255,.88);
  transition:background .09s,transform .08s;border:2px solid transparent;
}
.mini-cell:not(.blocked):hover{background:#fff;border-color:rgba(0,0,0,.1);}
.mini-cell:active{transform:scale(.88);}
.mini-cell.cx{color:var(--c-mafia);}
.mini-cell.co{color:var(--c-spy);}
.mini-cell.blocked{cursor:default;background:rgba(255,255,255,.55);border-color:transparent;}
.mini-cell.last{outline:2px solid currentColor;outline-offset:-2px;}
.meta-cell-won-mark{
  display:flex;align-items:center;justify-content:center;
  font-size:2.4rem;font-weight:900;height:100%;min-height:68px;
}
.meta-cell-won-mark.cx{color:var(--c-mafia);}
.meta-cell-won-mark.co{color:var(--c-spy);}
.meta-cell-won-mark.cd{color:var(--ink-faint);font-size:1.5rem;}
.ttt-legend{display:flex;gap:10px;justify-content:center;margin-bottom:12px;}
.ttt-chip{display:flex;align-items:center;gap:5px;font-weight:800;font-size:.85rem;padding:5px 12px;border-radius:999px;}
.ttt-chip.cx{background:rgba(194,59,75,.15);color:var(--c-mafia);}
.ttt-chip.co{background:rgba(31,158,137,.15);color:var(--c-spy2);}
.gc-hot{background:linear-gradient(148deg,#E2572B,#7A1F0B);}
.gc-nhie{background:linear-gradient(148deg,#C2458F,#6A1A4D);}
.gc-emo{background:linear-gradient(148deg,#D9A21B,#7A5300);}
.pcard{background:var(--paper-deep);border-radius:14px;padding:22px 16px;margin:12px 0;font-weight:800;font-size:1.25rem;line-height:1.35;text-align:center;animation:popIn .2s ease-out both;}
.netcard{background:linear-gradient(150deg,#1d2a3a,#0f1722);color:#fff;border-radius:16px;padding:16px;margin:4px 0 18px;box-shadow:0 8px 22px rgba(15,23,34,.28);}
.netcard-t{font-weight:900;font-size:1.1rem;}
.netcard-s{font-size:.82rem;opacity:.8;margin:4px 0 12px;line-height:1.4;}
textarea[readonly]{background:var(--paper-deep);}
/* ── polish pass ── */
.btn{transition:transform .08s,box-shadow .15s,filter .15s;}
.btn:active:not(:disabled){transform:translateY(1px) scale(.985);filter:brightness(.96);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn:focus-visible,.iconbtn:focus-visible,.lrow:focus-visible{outline:3px solid var(--hl-dark);outline-offset:2px;}
.lrow{transition:transform .08s,border-color .12s,background .12s;}
.lrow:active{transform:scale(.99);}
.lrow.sel::after{content:"✓";margin-left:auto;font-weight:900;color:var(--ok-deep);}
.card{transition:box-shadow .2s;}
.gamecard{transition:transform .18s cubic-bezier(.2,.9,.3,1.3),box-shadow .2s;}
.gamecard:active{transform:scale(.97) rotate(0deg);}
.netcard{position:relative;overflow:hidden;}
.netcard::before{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,210,63,.35),transparent 70%);}
.netcard-t::after{content:"";display:inline-block;width:9px;height:9px;margin-left:8px;border-radius:50%;background:#4cf08d;box-shadow:0 0 0 0 rgba(76,240,141,.7);animation:livePulse 1.8s infinite;vertical-align:middle;}
@keyframes livePulse{70%{box-shadow:0 0 0 9px rgba(76,240,141,0);}100%{box-shadow:0 0 0 0 rgba(76,240,141,0);}}
.pcard{position:relative;background:var(--card);border:2px solid var(--card-edge);box-shadow:0 5px 14px var(--card-shadow);}
.pcard::before{content:"";position:absolute;top:-9px;left:50%;width:54px;height:16px;transform:translateX(-50%) rotate(-2deg);background:rgba(255,210,63,.75);border-radius:2px;}
.timer-disp.urgent{animation:pulseBig .7s infinite;color:var(--bad);}
.pill{box-shadow:inset 0 0 0 1px rgba(31,36,84,.08);}
.slabel{letter-spacing:.06em;}
.gc-soon{transition:transform .2s;}
.gc-soon:hover{transform:rotate(0deg) translateY(-2px);}
/* ================= REDESIGN: sticker-book ================= */
:root{--stk:3px solid var(--ink);--off:4px 4px 0 var(--ink);--radius:16px;}
body{font-size:16px;}
#app{max-width:520px;}
.card,.deskcard{border:var(--stk);border-radius:var(--radius);box-shadow:var(--off);background:var(--card);}
.deskcard{padding:18px;}
.btn{border:var(--stk)!important;border-radius:14px;font-weight:900;letter-spacing:.01em;padding:13px 18px;box-shadow:0 5px 0 var(--ink);transition:transform .07s,box-shadow .07s;}
.btn:active:not(:disabled){transform:translateY(4px) scale(1)!important;box-shadow:0 1px 0 var(--ink);filter:none;}
.btn-ink{background:var(--ink);color:var(--paper);box-shadow:0 5px 0 var(--hl-dark);}
.btn-ink:active:not(:disabled){box-shadow:0 1px 0 var(--hl-dark);}
.btn-ghost{background:var(--card);color:var(--ink);}
.btn-accent{background:var(--hl);color:var(--ink);}
.btn-sm{box-shadow:0 3px 0 var(--ink);padding:8px 12px;}
input,textarea,select{border:2.5px solid var(--ink);border-radius:12px;font-weight:600;}
input:focus,textarea:focus{outline:3px solid var(--hl);outline-offset:0;}
.lrow{border:2.5px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:3px 3px 0 var(--ink);margin-bottom:8px;}
.lrow:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
.lrow.sel{background:var(--hl);}
.avatar{border:2.5px solid var(--ink);}
.pill{border:2px solid var(--ink);background:var(--card);box-shadow:none;font-weight:800;}
.slabel{font-weight:900;text-transform:uppercase;font-size:.7rem;letter-spacing:.1em;color:var(--ink-dim);margin-bottom:8px;}
.wordmark{font-size:3.6rem;text-shadow:4px 4px 0 var(--hl);}
.gamecard{border:var(--stk);border-radius:20px;box-shadow:6px 6px 0 var(--ink);}
.gamecard:hover{transform:translate(-2px,-2px) rotate(var(--r,0deg));box-shadow:8px 8px 0 var(--ink);}
.gamecard:active{transform:translate(4px,4px)!important;box-shadow:2px 2px 0 var(--ink);}

/* ===== LOBBY v2 + per-game identity ===== */
html{-webkit-text-size-adjust:100%;touch-action:manipulation;}
input,textarea,select{font-size:16px!important;}
.btn,.lrow,.chip,.iconbtn{touch-action:manipulation;min-height:44px;}
.btn:disabled,.btn.busy{opacity:.65;pointer-events:none;}
.btn.busy::after{content:"";display:inline-block;width:.9em;height:.9em;margin-left:8px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-2px;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ================================================================
   AUDIO (web audio synthesis – no files needed)
   ================================================================ */
const SFX=(()=>{
  let ctx=null,muted=S.get('idle_muted',false);
  function ac(){
    if(!ctx){try{ctx=new(window.AudioContext||window.webkitAudioContext)();}catch{ctx=null;}}
    if(ctx&&ctx.state==='suspended')ctx.resume();
    return ctx;
  }
  function tone(hz,dur,type='sine',delay=0,vol=0.14){
    if(muted)return;const c=ac();if(!c)return;
    const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;
    o.type=type;o.frequency.value=hz;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);
  }
  return{
    unlock(){ac();},
    isMuted(){return muted;},
    setMuted(v){muted=v;S.set('idle_muted',v);},
    click(){tone(600,.07,'square',0,.08);},
    tap(){tone(880,.05,'square',0,.06);},
    reveal(){tone(440,.12,'sine');tone(660,.14,'sine',.07);},
    success(){tone(523,.1,'sine');tone(659,.1,'sine',.1);tone(784,.16,'sine',.2);},
    fail(){tone(300,.14,'sawtooth',0,.09);tone(220,.2,'sawtooth',.1,.09);},
    win(){[523,659,784,1046].forEach((h,i)=>tone(h,.14+(i==3?.08:0),'sine',i*.12));},
    bad(){tone(280,.2,'square',0,.07);},
    place(){tone(740,.06,'sine',0,.1);}
  };
})();

function burst(){
  const cv=document.getElementById('confetti'),cx=cv.getContext('2d');
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#C23B4B','#1F9E89','#6957D6','#FFD23F','#2BAA66','#1F2454'];
  const ps=Array.from({length:100},()=>({
    x:innerWidth/2+(Math.random()-.5)*100,y:innerHeight*.3+(Math.random()-.5)*40,
    vx:(Math.random()-.5)*9,vy:Math.random()*-7-3,g:.22+Math.random()*.12,
    w:5+Math.random()*5,h:3+Math.random()*4,col:cols[0|Math.random()*cols.length],
    rot:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,life:0
  }));
  let fr=0;const MAX=120;
  (function step(){
    fr++;cx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{
      p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life++;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);
      cx.globalAlpha=clamp(1-fr/MAX,0,1);cx.fillStyle=p.col;
      cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();
    });
    if(fr<MAX)requestAnimationFrame(step);else cx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* ================================================================
   PASS-THE-PHONE ENGINE
   Two phases per player:
     Hand-off screen → Reveal tap → Content → Hide & pass tap
   The content is never auto-shown; requires explicit tap.
   ================================================================ */
let _pq=[],_pi=0,_pcur=null,_pdone=null,_pname=null,_pcontent=null;
function passSequence(items,nameFn,contentFn,onDone){
  _pq=items;_pi=0;_pdone=onDone;_pname=nameFn;_pcontent=contentFn;
  _passHandoff();
}
function _passHandoff(){
  if(_pi>=_pq.length){_pdone();return;}
  _pcur=_pq[_pi];
  $a().innerHTML=
    '<div class="screen"><div class="pass-screen">'+
      '<div class="slabel">Pass the phone — '+(_pi+1)+' of '+_pq.length+'</div>'+
      '<div class="pass-name">📱 → '+esc(_pname(_pcur))+'</div>'+
      '<p class="helptext">Hold the screen away from others until you tap.</p>'+
      '<button class="btn btn-ink btn-block" style="margin-top:16px;" onclick="G._pReveal()">I\'m '+esc(_pname(_pcur))+' — Tap to reveal</button>'+
    '</div></div>';
}
function _pReveal(){
  SFX.reveal();
  const c=_pcontent(_pcur,_pi);
  $a().innerHTML='<div class="screen"><div class="reveal-card">'+c+'<button class="btn btn-ghost btn-block" style="margin-top:18px;" onclick="G._pHide()">Got it — Hide &amp; pass it on</button></div></div>';
}
function _pHide(){_pi++;_passHandoff();}

  function defCfg(){return{count:clamp(S.get('m_count',6),4,20),namesText:getRoster(),detective:true,doctor:true,mafiaCount:null,timer:clamp(S.get('m_timer',180),60,600)};}
  function autoM(n){return Math.max(1,0|n/4);}
  function lnk(){return leaveLink('G.confirmLeave');}
  function mhdr(t,s){return hdr(t,s,'Mafia.rules','G.confirmLeave');}

  function start(){cfg=defCfg();setupRender();}

  function setupRender(){
    const mc=cfg.mafiaCount==null?autoM(cfg.count):cfg.mafiaCount;
    const mafiaWarn=mc>=Math.ceil(cfg.count/2)?'<p class="helptext" style="color:var(--bad);text-align:center;margin-top:4px;">⚠️ That\'s a lot of Mafia — the town will struggle.</p>':'';
    $a().innerHTML=
      '<div class="screen">'+hdr('Pass the Phone Mafia','Game setup','Mafia.rules')+
      '<div class="card"><div class="slabel">Players</div><div class="stepper"><button onclick="Mafia.sc(-1)">−</button><div class="val">'+cfg.count+'</div><button onclick="Mafia.sc(1)">+</button></div><p class="helptext" style="text-align:center;">4–20 · best with 6+</p></div>'+
      '<div class="card"><div class="slabel">Names (one per line, optional)</div><textarea placeholder="Leave blank for Player 1, 2…" oninput="Mafia.sn(this.value)">'+esc(cfg.namesText)+'</textarea></div>'+
      '<div class="card">'+
        '<div class="slabel">Special roles</div>'+
        '<div class="switchrow"><div><div class="slbl">🔍 Detective</div><div class="ssub">Investigates one player per night</div></div><button class="switch'+(cfg.detective?' on':'')+'" onclick="Mafia.td()"></button></div>'+
        '<div class="switchrow"><div><div class="slbl">⚕️ Doctor</div><div class="ssub">Protects one player per night</div></div><button class="switch'+(cfg.doctor?' on':'')+'" onclick="Mafia.tdoc()"></button></div>'+
        '<hr class="divider"/>'+
        '<div class="slabel">Mafia count</div>'+
        '<div class="stepper"><button onclick="Mafia.smc(-1)">−</button><div class="val">'+mc+'</div><button onclick="Mafia.smc(1)">+</button></div>'+
        mafiaWarn+
      '</div>'+
      '<div class="card"><div class="slabel">Discussion timer (per day)</div><div class="stepper"><button onclick="Mafia.stc(-30)">−</button><div class="val" style="font-size:1.25rem;">'+fmtTime(cfg.timer)+'</div><button onclick="Mafia.stc(30)">+</button></div></div>'+
      '<button class="btn btn-ink btn-block" onclick="Mafia.assign()">Assign roles & start →</button>'+
      '</div>';
  }

  function sc(d){cfg.count=clamp(cfg.count+d,4,20);if(cfg.mafiaCount!=null)cfg.mafiaCount=clamp(cfg.mafiaCount,1,Math.max(1,0|(cfg.count-1)/2));S.set('m_count',cfg.count);setupRender();}
  function sn(v){cfg.namesText=v;setRoster(v);}
  function td(){cfg.detective=!cfg.detective;setupRender();}
  function tdoc(){cfg.doctor=!cfg.doctor;setupRender();}
  function smc(d){const cur=cfg.mafiaCount==null?autoM(cfg.count):cfg.mafiaCount,max=Math.max(1,0|(cfg.count-1)/2);cfg.mafiaCount=clamp(cur+d,1,max);setupRender();}
  function stc(d){cfg.timer=clamp(cfg.timer+d,60,600);S.set('m_timer',cfg.timer);setupRender();}

  function rules(){modal('Mafia — How to Play',
    '<p>Mafia is a social deduction game. There are two teams: the <b>Town</b> and the <b>Mafia</b>.</p>'+
    '<p><b>Night phase:</b> Mafia secretly choose someone to eliminate. The Doctor can protect someone. The Detective investigates one player.</p>'+
    '<p><b>Day phase:</b> Everyone discusses who they think is Mafia, then votes to eliminate one player.</p>'+
    '<p><b>Win conditions:</b> Town wins when all Mafia are eliminated. Mafia wins when they equal or outnumber the rest of the town.</p>'+
    '<p class="helptext">Pass the phone to each player in private for role reveals. Never show the screen to the group!</p>'
  );}

  function assign(){
    timerOn=false;clearTimeout(_timerTick);
    const names=parseNames(cfg.namesText,cfg.count);
    const mc=cfg.mafiaCount==null?autoM(cfg.count):cfg.mafiaCount;
    let roles=[];
    for(let i=0;i<mc;i++)roles.push('MAFIA');
    if(cfg.detective)roles.push('DETECTIVE');
    if(cfg.doctor)roles.push('DOCTOR');
    while(roles.length<names.length)roles.push('CIVILIAN');
    roles=shuffle(roles);
    st={players:names.map((n,i)=>({id:i,name:n,role:roles[i],alive:true})),night:1,day:0,log:[]};
    passSequence(
      st.players,
      p=>p.name,
      p=>{
        const info=RI[p.role];
        let extra='';
        if(p.role==='MAFIA'){
          const t=st.players.filter(x=>x.role==='MAFIA'&&x.id!==p.id).map(x=>x.name);
          extra=t.length?'<p class="helptext"><b>Your fellow Mafia:</b> '+t.map(esc).join(', ')+'</p>':'<p class="helptext">You are the <b>only Mafia</b> this round.</p>';
        }
        return '<div style="font-size:2.6rem;">'+info.icon+'</div>'+
          '<div class="slabel" style="margin:6px 0 2px;">'+esc(p.name)+', your role is</div>'+
          '<div style="font-size:1.65rem;font-weight:800;color:'+info.color+';">'+info.label+'</div>'+
          '<p class="helptext" style="margin-top:10px;">'+info.desc+'</p>'+extra;
      },
      nightStart
    );
  }

  /* ---- NIGHT ---- */
  let _nActor=null,_nType=null;
  function nightStart(){
    nActions={};nQueue=[];
    $a().innerHTML=
      '<div class="screen"><div class="deskcard" style="padding:40px 20px;">'+
        '<div style="font-size:2.5rem;">🌙</div>'+
        '<div style="font-size:1.35rem;font-weight:800;margin:8px 0;">Night '+st.night+'</div>'+
        '<p class="helptext">Everyone, put your heads down or look away. Pass the phone when prompted.</p>'+
        '<button class="btn btn-ink btn-block" style="margin-top:16px;" onclick="Mafia.nightQ()">Begin night actions →</button>'+
      '</div>'+lnk()+'</div>';
  }
  function nightQ(){
    nQueue=[];
    const aM=st.players.filter(p=>p.alive&&p.role==='MAFIA');
    const doc=st.players.find(p=>p.alive&&p.role==='DOCTOR');
    const det=st.players.find(p=>p.alive&&p.role==='DETECTIVE');
    if(aM.length)nQueue.push({type:'MAFIA',actors:aM});
    if(doc)nQueue.push({type:'DOCTOR',actors:[doc]});
    if(det)nQueue.push({type:'DETECTIVE',actors:[det]});
    nextNQ();
  }
  function nextNQ(){
    if(!nQueue.length){resolveNight();return;}
    const step=nQueue.shift();_nActor=step;_nType=step.type;
    const labels={MAFIA:'🎭 Mafia',DOCTOR:'⚕️ Doctor',DETECTIVE:'🔍 Detective'};
    const names=step.actors.map(a=>a.name).join(' & ');
    $a().innerHTML=
      '<div class="screen"><div class="pass-screen">'+
        '<div class="slabel">Pass the phone to the</div>'+
        '<div class="pass-name">'+labels[_nType]+'</div>'+
        '<p class="helptext">('+esc(names)+')</p>'+
        '<button class="btn btn-ink btn-block" style="margin-top:16px;" onclick="Mafia.nReveal()">Reveal</button>'+
      '</div></div>';
  }
  function nReveal(){
    SFX.reveal();
    const alive=st.players.filter(p=>p.alive);
    if(_nType==='MAFIA'){
      const targets=alive.filter(p=>p.role!=='MAFIA');
      $a().innerHTML='<div class="screen">'+targetPicker('Choose who to eliminate tonight',targets,'Mafia.nKill')+'</div>';
    }else if(_nType==='DOCTOR'){
      $a().innerHTML='<div class="screen">'+targetPicker('Choose who to protect tonight',alive,'Mafia.nSave')+'</div>';
    }else{
      const targets=alive.filter(p=>p.id!==_nActor.actors[0].id);
      $a().innerHTML='<div class="screen">'+targetPicker('Choose who to investigate',targets,'Mafia.nInvest')+'</div>';
    }
  }
  function targetPicker(title,players,fn){
    return '<div class="reveal-card" style="text-align:left;">'+
      '<div class="slabel" style="text-align:center;">'+esc(title)+'</div>'+
      '<div class="llist" style="margin-top:10px;">'+
        players.map(p=>'<div class="lrow" onclick="'+fn+'('+p.id+')"><div class="avatar">'+esc((p.name[0]||'?').toUpperCase())+'</div><div class="rname">'+esc(p.name)+'</div></div>').join('')+
      '</div></div>';
  }
  function nKill(id){nActions.kill=id;nextNQ();}
  function nSave(id){nActions.save=id;nextNQ();}
  function nInvest(id){
    const t=st.players.find(p=>p.id===id);
    const isM=t.role==='MAFIA';
    isM ? SFX.fail() : SFX.success();
    $a().innerHTML=
      '<div class="screen"><div class="reveal-card">'+
        '<div class="slabel" style="text-align:center;">Investigation result</div>'+
        '<div style="font-size:1.5rem;font-weight:800;margin:10px 0;color:'+(isM?'var(--c-mafia)':'var(--ok-deep)')+';">'+esc(t.name)+' is '+(isM?'MAFIA 🎭':'NOT Mafia ✅')+'</div>'+
        '<button class="btn btn-ghost btn-block" style="margin-top:14px;" onclick="Mafia.nHide()">Hide & pass it on</button>'+
      '</div></div>';
  }
  function nHide(){nextNQ();}

  function resolveNight(){
    let dead=null;
    if(nActions.kill!=null&&nActions.kill!==nActions.save){
      dead=st.players.find(p=>p.id===nActions.kill);
      dead.alive=false;
      st.log.push('Night '+st.night+': '+dead.name+' was eliminated ('+RI[dead.role].label+').');
    }else{
      st.log.push('Night '+st.night+': No one was eliminated.');
    }
    SFX.fail();
    $a().innerHTML=
      '<div class="screen"><div class="deskcard" style="padding:36px 20px;">'+
        '<div style="font-size:2.2rem;">☀️</div>'+
        '<div class="slabel" style="margin:6px 0;">Morning announcement</div>'+
        (dead
          ?'<div style="font-size:1.25rem;font-weight:800;margin:4px 0;">💀 '+esc(dead.name)+' was eliminated</div><p class="helptext">They were the <b>'+RI[dead.role].label+'</b>.</p>'
          :'<div style="font-size:1.25rem;font-weight:800;margin:4px 0;">😌 Everyone survived the night</div>')+
        '<button class="btn btn-ink btn-block" style="margin-top:16px;" onclick="Mafia.morningCheck()">Continue →</button>'+
      '</div>'+lnk()+'</div>';
  }

  function checkWin(){
    const aM=st.players.filter(p=>p.alive&&p.role==='MAFIA').length;
    const aT=st.players.filter(p=>p.alive&&p.role!=='MAFIA').length;
    if(aM===0)return'TOWN';if(aM>=aT)return'MAFIA';return null;
  }
  function morningCheck(){const w=checkWin();if(w)return endScreen(w);st.day++;dayPhase();}

  /* ---- DAY ---- */
  function dayPhase(){
    dayLeft=cfg.timer;timerOn=false;
    const alive=st.players.filter(p=>p.alive);
    const nMafia=st.players.filter(p=>p.alive&&p.role==='MAFIA').length;
    $a().innerHTML=
      '<div class="screen">'+mhdr('Day '+st.day,'Discuss — who is Mafia?')+

          '<p class="helptext" style="margin-bottom:4px;">'+alive.length+' players alive · '+nMafia+' Mafia remain</p>'+
          '<p class="helptext" style="margin-bottom:10px;">Discuss out loud, then vote someone out.</p>'+
          '<div class="timer-disp" id="mTimer">'+fmtTime(dayLeft)+'</div>'+
          '<div class="brow" style="margin-top:14px;">'+
            '<button class="btn btn-ghost" id="mTimerBtn" onclick="Mafia.timerToggle()">Start</button>'+
            '<button class="btn btn-accent" onclick="Mafia.vote()">Vote now</button>'+
          '</div>'+
        '</div>'+
        '<div class="card"><div class="slabel">Alive players</div><div class="llist">'+
          st.players.filter(p=>p.alive).map(p=>'<div class="lrow" style="cursor:default;"><div class="avatar">'+esc((p.name[0]||'?').toUpperCase())+'</div><div class="rname">'+esc(p.name)+'</div></div>').join('')+
        '</div></div>'+
      lnk()+'</div>';
  }
  function timerToggle(){
    timerOn=!timerOn;
    const b=document.getElementById('mTimerBtn');if(b)b.textContent=timerOn?'Pause':'Start';
    if(timerOn)tick();
  }
  function tick(){
    if(!timerOn)return;
    dayLeft=Math.max(0,dayLeft-1);
    const el=document.getElementById('mTimer');
    if(el){el.textContent=fmtTime(dayLeft);el.classList.toggle('urgent',dayLeft<=30&&dayLeft>0);}
    if(dayLeft<=0){timerOn=false;SFX.bad();vote();return;}
    _timerTick=setTimeout(tick,1000);
  }
  function vote(){
    timerOn=false;clearTimeout(_timerTick);
    const alive=st.players.filter(p=>p.alive);
    $a().innerHTML=
      '<div class="screen">'+mhdr('Vote','Who is eliminated?')+
        '<div class="card"><div class="slabel">Tap to eliminate — '+alive.length+' players remain</div>'+
          '<div class="llist">'+alive.map(p=>'<div class="lrow" onclick="Mafia.voteOn('+p.id+')"><div class="avatar">'+esc((p.name[0]||'?').toUpperCase())+'</div><div class="rname">'+esc(p.name)+'</div></div>').join('')+'</div>'+
        '</div>'+
        '<button class="btn btn-ghost btn-block" onclick="Mafia.skipVote()">No consensus — skip elimination</button>'+
      lnk()+'</div>';
  }
  function voteOn(id){
    const p=st.players.find(x=>x.id===id);
    if(!confirm('Eliminate '+p.name+'? This can\'t be undone.'))return;
    p.alive=false;SFX.fail();
    st.log.push('Day '+st.day+': '+p.name+' was voted out ('+RI[p.role].label+').');
    $a().innerHTML=
      '<div class="screen"><div class="deskcard">'+
        '<div style="font-size:2rem;">⚖️</div>'+
        '<div style="font-size:1.25rem;font-weight:800;margin:8px 0;">'+esc(p.name)+' eliminated</div>'+
        '<p class="helptext">They were the <b>'+RI[p.role].label+'</b>.</p>'+
        '<button class="btn btn-ink btn-block" style="margin-top:14px;" onclick="Mafia.afterVote()">Continue →</button>'+
      '</div>'+lnk()+'</div>';
  }
  function skipVote(){st.log.push('Day '+st.day+': Town couldn\'t agree — no elimination.');afterVote();}
  function afterVote(){const w=checkWin();if(w)return endScreen(w);st.night++;nightStart();}

  /* ---- END ---- */
  function endScreen(winner){
    SFX.win();burst();
    const mf=st.players.filter(p=>p.role==='MAFIA').map(p=>p.name);
    $a().innerHTML=
      '<div class="screen">'+
        '<div class="deskcard" style="margin-bottom:14px;">'+
          '<div style="font-size:2.5rem;">'+(winner==='TOWN'?'🏆':'🎭')+'</div>'+
          '<div style="font-size:1.55rem;font-weight:800;margin:6px 0;color:'+(winner==='TOWN'?'var(--ok-deep)':'var(--c-mafia)')+';">'+(winner==='TOWN'?'Town wins!':'Mafia wins!')+'</div>'+
          '<p class="helptext">Mafia were: <b>'+mf.map(esc).join(', ')+'</b></p>'+
        '</div>'+
        '<div class="card"><div class="slabel">Final roles</div><div class="llist">'+
          st.players.map(p=>'<div class="lrow" style="cursor:default;"><div class="avatar">'+esc((p.name[0]||'?').toUpperCase())+'</div><div class="rname">'+esc(p.name)+(p.alive?'':'  💀')+'</div><span class="pill">'+RI[p.role].icon+' '+RI[p.role].label+'</span></div>').join('')+
        '</div></div>'+
        '<div class="card"><div class="slabel">Game log</div>'+st.log.map(l=>'<p class="helptext" style="margin:3px 0;">• '+esc(l)+'</p>').join('')+'</div>'+
        '<div class="brow"><button class="btn btn-ink" style="flex:1;" onclick="Mafia.replay()">Play again</button><button class="btn btn-ghost" style="flex:1;" onclick="Mafia.start()">New setup</button></div>'+
      '</div>';
  }
  function replay(){assign();}

  function stop(){timerOn=false;clearTimeout(_timerTick);}
  return{stop,start,rules,sc,sn,td,tdoc,smc,stc,assign,nightQ,nReveal,nKill,nSave,nInvest,nHide,morningCheck,timerToggle,vote,voteOn,skipVote,afterVote,replay};
})();
