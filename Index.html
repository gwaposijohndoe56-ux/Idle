const DGW='Pizza,Jeepney,House,Rainbow,Cat,Umbrella,Volcano,Robot,Guitar,Bicycle,Fish,Tree,Sun,Spider,Airplane,Clock,Pencil,Banana,Castle,Fire,Heart,Moon,Ghost,Dragon,Crown,Boat,Carabao,Tricycle,Basketball,Mango,Cake,Book,Key,Snowman,Pirate,Star,Mountain,Phone,Bridge,Shoe'.split(',');
const DrawPad={iv:null,col:'#1F2454',sz:5,dirty:false,
 html(){return '<canvas id="dcv" width="320" height="320" class="dg-canvas"></canvas><div class="chiprow" style="margin:8px 0;justify-content:center">'+['#1F2454','#D6555F','#27A060','#4A6FA5','#E8B800'].map(c=>'<button class="dg-col" style="background:'+c+'" onclick="DrawPad.setCol(\''+c+'\')"></button>').join('')+'<button class="chip" onclick="DrawPad.setCol(\'#ffffff\')">🧽</button><button class="chip" onclick="DrawPad.big()">● / •</button><button class="chip" onclick="DrawPad.clear()">🗑</button></div>';},
 setCol(c){this.col=c;},big(){this.sz=this.sz>5?5:14;},
 clear(){const c=document.getElementById('dcv');if(c){const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);this.dirty=true;}},
 snap(){const c=document.getElementById('dcv');return c?c.toDataURL('image/jpeg',.55):'';},
 dot(x,px,py){x.fillStyle=this.col;x.beginPath();x.arc(px,py,this.sz/2,0,6.3);x.fill();this.dirty=true;},
 init(cb){const c=document.getElementById('dcv');if(!c){this.stop();return;}if(c._i)return;c._i=1;const x=c.getContext('2d');if(!x)return;x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.lineCap=x.lineJoin='round';let d=false,lx=0,ly=0;
  const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height];};
  c.onpointerdown=e=>{d=true;[lx,ly]=pt(e);try{c.setPointerCapture(e.pointerId);}catch{}this.dot(x,lx,ly);e.preventDefault();};
  c.onpointermove=e=>{if(!d)return;const[px,py]=pt(e);x.strokeStyle=this.col;x.lineWidth=this.sz;x.beginPath();x.moveTo(lx,ly);x.lineTo(px,py);x.stroke();lx=px;ly=py;this.dirty=true;e.preventDefault();};
  c.onpointerup=c.onpointercancel=()=>{d=false;};
  clearInterval(this.iv);this.iv=null;if(cb)this.iv=setInterval(()=>{if(this.dirty){this.dirty=false;cb(this.snap());}},800);},
 stop(){clearInterval(this.iv);this.iv=null;}};
const dgOk=d=>typeof d==='string'&&d.startsWith('data:image/')&&d.length<250000;
const dgImg=s=>'<img id="live" class="dg-img"'+(s.img?' src="'+s.img+'"':'')+'>';

/* ---------- Heist data/logic ---------- */
const SPC=[['Hacker','💻'],['Driver','🚗'],['Safecracker','🔐'],['Lookout','👀'],['Forger','🪪'],['Muscle','💪']];
const HOB=[['Laser grid blocks the hallway',0],['Security cameras watch the lobby',0],['The getaway truck needs hotwiring',1],['Police chase through the city',1],['The vault door is sealed shut',2],['Safe deposit boxes need cracking',2],['Guards patrol in random shifts',3],['A plainclothes guard hides in the crowd',3],['Reception wants a VIP pass',4],['The guest list needs a forged name',4],['A steel door blocks the way',5],['A panicking crowd must be controlled',5]];
const HTAR=['City Bank','National Museum','Diamond Casino','Gold Exchange','Royal Jewelry Vault','Crypto Tower'];
function hzInit(ps){const n=ps.length,pool=shuffle([0,1,2,3,4,5]),spec={};ps.forEach((p,i)=>spec[p.id]=pool[i%6]);
 return{ps,rat:ps[0|Math.random()*n].id,spec,tar:HTAR[0|Math.random()*HTAR.length],st:shuffle(HOB.slice()).slice(0,5),i:0,ph:'pick',votes:{},h:null,res:[]};}
function hzRun(s,a){const need=s.st[s.i][1],ok=a==='sab'?false:s.spec[s.h]===need?true:Math.random()<.4;s.res.push({ok,h:s.h,sab:a==='sab'});}
const hzCount=s=>({w:s.res.filter(r=>r.ok).length,l:s.res.filter(r=>!r.ok).length});
const hzDone=s=>{const c=hzCount(s);return c.w>=3||c.l>=3;};
const hzBar=s=>{const c=hzCount(s);return '<div class="brow" style="margin-bottom:8px"><div class="pill">🎯 '+nE(s.tar)+'</div><div class="pill">✅ '+c.w+'/3</div><div class="pill">❌ '+c.l+'/3</div></div>';};
const hzMe=(s,pid)=>'<div class="pill" style="margin:0 auto 8px;display:flex;width:max-content">'+SPC[s.spec[pid]][1]+' '+SPC[s.spec[pid]][0]+(pid===s.rat?' · 🐀 RAT':'')+'</div>'+(pid===s.rat?'<p class="helptext" style="text-align:center;margin:0 0 8px">You are the <b>Rat</b>. Make 3 jobs fail without getting caught!</p>':'');
const hzEnd=s=>{const c=hzCount(s),w=c.w>=3;return nbox('<div style="font-size:2.4rem">'+(w?'💰':'🚨')+'</div><div class="pass-name">'+(w?'The crew pulled it off!':'The heist failed!')+'</div><p class="helptext">The Rat was <b>'+nname(s,s.rat)+'</b>.</p>')+nlist(s.ps,p=>'<span class="pill">'+SPC[s.spec[p.id]][1]+' '+SPC[s.spec[p.id]][0]+(p.id===s.rat?' 🐀':'')+'</span>')+(s.res.filter(r=>r.sab).length?'<p class="helptext" style="text-align:center">🐀 Sabotaged: '+s.res.filter(r=>r.sab).length+' job(s)</p>':'');};

/* ---------- pass-the-phone ---------- */
PPG.dg={t:'Draw & Guess',h:'The spotlight player secretly sees a word and draws it on the phone in 60 seconds — no letters or words! Then everyone shouts guesses; tap who got it right. Both score a point.',
 next(s,first){PP.stop();DrawPad.stop();s.act=first?0|Math.random()*s.ps.length:(s.act+1)%s.ps.length;s.word=DGW[Party.bag('dg',DGW.length)];s.ph='h';s.left=60;s.img='';s.res='';s.n++;},
 act(s,a,g){
  if(a==='show'&&s.ph==='h'){s.ph='a';PP.tm=setInterval(()=>{s.left--;const e=document.getElementById('ppt');if(e)e.textContent=fmtTime(Math.max(0,s.left));if(s.left<=0){PP.stop();s.img=DrawPad.snap();s.ph='g';PP.draw();}},1000);}
  else if(a==='done'&&s.ph==='a'){PP.stop();s.img=DrawPad.snap();s.ph='g';}
  else if(a==='got'&&s.ph==='g'){s.ps[+g].pts++;s.ps[s.act].pts++;s.res='🎉 '+esc(s.ps[+g].name)+' guessed it! +1 each.';s.ph='r';}
  else if(a==='out'&&s.ph==='g'){s.res='😅 Nobody got it.';s.ph='r';}
  else if(a==='next'&&s.ph==='r')PPG.dg.next(s);
  else if(a==='fin')s.ph='e';},
 view(s){const an=esc(s.ps[s.act].name),im='<img class="dg-img" src="'+s.img+'">';
  if(s.ph==='h')return '<div class="pass-wrap"><div class="slabel">Pass the phone to</div><div class="pass-name">'+an+'</div><button class="btn btn-ink btn-block" onclick="PP.do(\'show\')">I\'m '+an+' — show my word</button></div>'+ppRank(s);
  if(s.ph==='a')return nbox('<div class="slabel">Draw this — no words!</div><div class="pass-name wsp-word">'+esc(s.word)+'</div><div id="ppt" class="timer-disp">'+fmtTime(Math.max(0,s.left))+'</div>')+DrawPad.html()+'<button class="btn btn-ink btn-block" onclick="PP.do(\'done\')">Done — show everyone</button>';
  if(s.ph==='g')return nbox(im+'<p class="helptext">Everyone shout your guesses! Who got it?</p>')+'<div class="llist">'+s.ps.filter((p,i)=>i!==s.act).map(p=>'<div class="lrow" onclick="PP.do(\'got\',\''+p.id+'\')"><div class="rname">'+esc(p.name)+'</div></div>').join('')+'</div><button class="btn btn-ghost btn-block" onclick="PP.do(\'out\')">Nobody</button>';
  if(s.ph==='r')return nbox(im+'<div class="slabel">It was</div><div class="pass-name">'+esc(s.word)+'</div><p class="helptext">'+s.res+'</p>')+ppRank(s)+'<button class="btn btn-ink btn-block" onclick="PP.do(\'next\')">Next artist →</button><button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="PP.do(\'fin\')">Finish game</button>';
  return nbox('<div style="font-size:2.4rem">🏆</div><div class="pass-name">'+esc(s.ps.slice().sort((a,b)=>b.pts-a.pts)[0].name)+' leads!</div>')+ppRank(s)+'<div class="brow"><button class="btn btn-ink" onclick="PP.go()">Play again</button><button class="btn btn-ghost" onclick="G.hub()">Hub</button></div>';}};

PPG.hz={t:'Heist Planner',h:'Everyone secretly gets a specialty — and one of you is the RAT. Five jobs stand between you and the loot. Talk it out, pick who handles each job, and that person secretly acts. 3 wins takes the heist; 3 fails ends it.',
 next(s){Object.assign(s,hzInit(s.ps));s.ph='rh';s.ri=0;s.n=1;},
 act(s,a,g){
  if(a==='show'&&s.ph==='rh')s.ph='rs';

 view(s){
  const nm=i=>esc(s.ps[i].name);
  if(s.ph==='rh')return '<div class="pass-wrap"><div class="slabel">Pass the phone to</div><div class="pass-name">'+nm(s.ri)+'</div><button class="btn btn-ink btn-block" onclick="PP.do(\'show\')">I\'m '+nm(s.ri)+' — show my role</button></div>';
  if(s.ph==='rs'){const r=s.ri===s.rat;return '<div class="pass-wrap"><div class="slabel">Your specialty</div><div style="font-size:3rem">'+SPC[s.spec[s.ri]][1]+'</div><div class="pass-name">'+SPC[s.spec[s.ri]][0]+'</div>'+(r?'<p class="helptext" style="color:var(--bad);font-weight:800">🐀 You are the RAT. Make 3 jobs fail without being caught. Lie about your specialty if you want!</p>':'<p class="helptext">Target: <b>'+esc(s.tar)+'</b>. Work out who is lying about their skills.</p>')+'<button class="btn btn-ink btn-block" onclick="PP.do(\'hide\')">Hide &amp; pass →</button></div>';}
  if(s.ph==='e')return hzEnd(s)+'<div class="brow"><button class="btn btn-ink" onclick="PP.go()">Play again</button><button class="btn btn-ghost" onclick="G.hub()">Hub</button></div>';
  const ob=s.st[s.i],job=nbox('<div class="slabel">Job '+(s.i+1)+' of 5 — needs '+SPC[ob[1]][1]+' '+SPC[ob[1]][0]+'</div><div class="pcard">'+esc(ob[0])+'</div>');
  if(s.ph==='p')return hzBar(s)+job+'<div class="slabel">Discuss, then tap who handles it</div><div class="llist">'+s.ps.map(p=>'<div class="lrow" onclick="PP.do(\'pick\',\''+p.id+'\')"><div class="avatar">'+esc((p.name[0]||'?').toUpperCase())+'</div><div class="rname">'+esc(p.name)+'</div></div>').join('')+'</div>';
  if(s.ph==='hh')return '<div class="pass-wrap"><div class="slabel">Pass the phone to</div><div class="pass-name">'+nm(s.h)+'</div><button class="btn btn-ink btn-block" onclick="PP.do(\'show2\')">I\'m '+nm(s.h)+' — do the job</button></div>';
  if(s.ph==='a')return hzBar(s)+job+'<button class="btn btn-ok btn-block" onclick="PP.do(\'do\')">🛠 Do the job</button>'+(s.h===s.rat?'<button class="btn btn-bad btn-block" style="margin-top:8px" onclick="PP.do(\'sab\')">🐀 Sabotage it</button>':'');
  const r=s.res[s.res.length-1];return hzBar(s)+nbox('<div style="font-size:2.4rem">'+(r.ok?'✅':'❌')+'</div><div class="pass-name">'+(r.ok?'Job done!':'Job failed!')+'</div><p class="helptext">'+nm(r.h)+' handled it.</p>')+'<button class="btn btn-ink btn-block" onclick="PP.do(\'next\')">'+(hzDone(s)||s.i>=4?'See the result →':'Next job →')+'</button>';}};

/* ---------- different phones ---------- */
function dgNext(s,first){if(!first){const i=s.ps.findIndex(p=>p.id===s.actor);s.actor=s.ps[(i+1)%s.ps.length].id;}s.word=DGW[Party.bag('dg',DGW.length)];s.ph='d';s.end=Date.now()+60000;s.img='';s.res='';s.n++;}
NG.dg={n:'Draw & Guess',i:'🎨',min:3,max:12,
 init(ps){const s={ps:ps.map(p=>({id:p.id,name:p.name,pts:0})),actor:ps[0|Math.random()*ps.length].id,n:0};dgNext(s,true);return s;},
 tick(s){if(s.ph==='d'&&Date.now()>s.end){s.ph='g';return true;}return false;},
 act(s,pid,a,g){
  if(s.ph==='d'&&pid===s.actor){if(a==='img'&&dgOk(g)){s.img=g;return 'img';}if(a==='done'){if(dgOk(g))s.img=g;s.ph='g';}}
  else if(s.ph==='g'&&pid===s.actor){if(a==='got'){const w=s.ps.find(p=>p.id===+g&&p.id!==s.actor);if(!w)return;w.pts++;s.ps.find(p=>p.id===s.actor).pts++;s.res='🎉 '+nE(w.name)+' guessed it! +1 each.';s.ph='r';}else if(a==='out'){s.res='😅 Nobody got it.';s.ph='r';}}
  else if(s.ph==='r'&&pid===0){if(a==='next')dgNext(s);else if(a==='fin')s.ph='end';}
  else if(s.ph==='end'&&a==='again'&&pid===0)Object.assign(s,NG.dg.init(s.ps));},
 kick(s,pid){if(s.ph==='end'||!s.ps.some(p=>p.id===pid))return;const i=s.ps.findIndex(p=>p.id===pid);s.ps=s.ps.filter(p=>p.id!==pid);if(s.ps.length<2){s.ph='end';return;}if(pid===s.actor){s.actor=s.ps[i%s.ps.length].id;s.n--;dgNext(s,true);}},
 view(s,pid){const sc=nlist(s.ps.slice().sort((a,b)=>b.pts-a.pts),p=>'<span class="pill">⭐ '+p.pts+'</span>'),me=pid===s.actor,tm='<div class="timer-disp" data-left="'+nsecs(s.end-Date.now())+'"></div>';
  if(s.ph==='end'){const m=Math.max(...s.ps.map(p=>p.pts)),w=s.ps.filter(p=>p.pts===m);return nbox('<div style="font-size:2.4rem">🏆</div><div class="pass-name">'+w.map(p=>nE(p.name)).join(' & ')+' win'+(w.length>1?'':'s')+'!</div>')+sc+nhostBtn(pid,'Play again','again');}
  if(s.ph==='d')return me?nbox('<div class="slabel">Draw this — no words!</div><div class="pass-name wsp-word">'+nE(s.word)+'</div>'+tm)+DrawPad.html()+'<button class="btn btn-ink btn-block" onclick="Net.act(\'done\',DrawPad.snap())">Done drawing</button>':nbox('<div class="slabel">'+nname(s,s.actor)+' is drawing…</div>'+dgImg(s)+tm+'<p class="helptext">Shout your guesses out loud!</p>')+sc;
  if(s.ph==='g')return nbox(dgImg(s)+(me?'<p class="helptext">Who guessed it?</p>':'<p class="helptext">Shout it out! '+nname(s,s.actor)+' is judging.</p>'))+(me?npick(s.ps.filter(p=>p.id!==pid),'got',nbtn('Nobody','out','','btn-ghost')):'');
  return nbox(dgImg(s)+'<div class="slabel">It was</div><div class="pass-name">'+nE(s.word)+'</div><p class="helptext">'+s.res+'</p>')+sc+(pid===0?nbtn('Next artist →','next')+nbtn('Finish game','fin','','btn-ghost'):'<p class="helptext" style="text-align:center">Waiting for the lobby master…</p>');}};

NG.hz={n:'Heist Planner',i:'🔐',min:3,max:10,
 init:hzInit,
 act(s,pid,a,g){
  if(s.ph==='pick'&&a==='v'&&!(pid in s.votes)&&s.spec[+g]!=null&&s.ps.some(p=>p.id===+g)){s.votes[pid]=+g;if(Object.keys(s.votes).length>=s.ps.length)hzTally(s);}
  else if(s.ph==='act'&&pid===s.h&&(a==='do'||(a==='sab'&&pid===s.rat))){hzRun(s,a);s.ph='res';}
  else if(s.ph==='res'&&a==='next'&&pid===0){if(hzDone(s)||s.i>=4)s.ph='end';else{s.i++;s.ph='pick';s.votes={};s.h=null;}}
  else if(s.ph==='end'&&a==='again'&&pid===0)Object.assign(s,hzInit(s.ps));},
 kick(s,pid){if(s.ph==='end'||!s.ps.some(p=>p.id===pid))return;
  if(pid===s.rat||s.ps.length<=3){const ok=pid===s.rat;s.ph='end';for(let k=0;k<3;k++)s.res.push({ok,h:pid,sab:false});return;}
  s.ps=s.ps.filter(p=>p.id!==pid);delete s.votes[pid];Object.keys(s.votes).forEach(k=>{if(s.votes[k]===pid)delete s.votes[k];});
  if(s.ph==='pick'&&Object.keys(s.votes).length>=s.ps.length)hzTally(s);else if(s.ph==='act'&&s.h===pid){s.ph='pick';s.votes={};s.h=null;}},
 view(s,pid){
  if(s.ph==='end')return hzEnd(s)+nhostBtn(pid,'Play again','again');
  const me=hzMe(s,pid),bar=hzBar(s),ob=s.st[s.i],job=nbox('<div class="slabel">Job '+(s.i+1)+' of 5 — needs '+SPC[ob[1]][1]+' '+SPC[ob[1]][0]+'</div><div class="pcard">'+nE(ob[0])+'</div>');
  if(s.ph==='pick')return me+bar+job+nbox('<p class="helptext">Talk it out! Who should handle this job? ('+Object.keys(s.votes).length+'/'+s.ps.length+' voted)</p>')+(pid in s.votes?nwait('Vote locked…'):npick(s.ps,'v'));
  if(s.ph==='act')return me+bar+job+(pid===s.h?nbox('<p class="helptext"><b>You were chosen!</b></p>')+nbtn('🛠 Do the job','do','','btn-ok')+(pid===s.rat?nbtn('🐀 Sabotage it','sab','','btn-bad'):''):nwait(nname(s,s.h)+' is working on it…'));
  const r=s.res[s.res.length-1];return me+bar+nbox('<div style="font-size:2.4rem">'+(r.ok?'✅':'❌')+'</div><div class="pass-name">'+(r.ok?'Job done!':'Job failed!')+'</div><p class="helptext">'+nname(s,r.h)+' handled it.</p>')+nhostBtn(pid,hzDone(s)||s.i>=4?'See the result →':'Next job →','next');}};
function hzTally(s){const c={};Object.values(s.votes).forEach(v=>c[v]=(c[v]||0)+1);const m=Math.max(...Object.values(c)),top=Object.keys(c).filter(k=>c[k]===m).map(Number);s.h=top[0|Math.random()*top.length];s.ph='act';}

/* ================================================================
   HOW TO PLAY — full guides with step-by-step + worked examples
   ================================================================ */
const HOW={
lobby:{t:'📡 Lobbies',meta:['👥 any game','📱 each player uses their own phone','⚡ 4-letter room code'],
 goal:`Every player uses their **own phone**. One person is the **host**; their phone runs the game and everyone else sees only what *they* are allowed to see (secret roles, private dice, and so on).`,
 need:`Everyone opens this same IDLE page on their own phone, with internet (Wi-Fi or mobile data).`,
 steps:[`**Host:** tap **Create lobby**. A 4-letter room code appears instantly.`,`**Host:** tap **Share** (or read the code out loud).`,`**Players:** type the code on the home screen and tap **Join**. You land in the lobby straight away.`,`**Host:** pick a game. **Start** lights up when there are enough players.`,`If someone's connection drops, they rejoin their seat automatically when it comes back.`],
 ex:[`> Example: Ana taps Create lobby and sees the code K7QM.`,`**Ben:** types K7QM and taps Join — he's in.`,`**Ana:** picks Spy Hunt and taps Start.`],
 win:`The lobby is just how you connect. Each game explains its own win condition (tap **?** inside a game).`,
 net:`No internet at all? Use **Pair manually** under the Join button: it works on the same Wi-Fi or a phone hotspot by swapping two codes.`,
 tips:[`The host's phone **is the game** — keep it awake and the page open.`,`If the host refreshes the page, the same room code comes back and players reconnect on their own.`,`If someone drops mid-game, the host sees a **Remove & continue** button.`]},

mafia:{t:'🎭 Mafia',meta:['👥 4–15 players (best 6–10)','⏱ 15–30 min','📱 1 shared phone or own phones'],
 goal:`A secret **Mafia** team is hiding among the **Town**. Town wins by voting out every Mafia member. Mafia wins when they **equal or outnumber** everyone else.`,
 need:`A group of friends in a circle. Pass-the-phone: ONE phone, passed around. Different phones: everyone uses their own.`,
 steps:[`**Set up:** choose the number of players, type the names (one per line), and choose how many Mafia there are. Switch the **Doctor** and **Detective** on or off (they're recommended with 5+ players). Tap Start.`,`**Roles are secretly dealt.** The phone says "Pass the phone to <name>". That person takes it, taps **Reveal**, reads their role privately, then taps **Hide & pass it on**. Never let anyone peek!`,`**Night:** everyone closes their eyes or puts their head down. Tap **Begin night actions**. The phone calls the roles one at a time: the **Mafia** (huddle together and quietly choose one victim), the **Doctor** (chooses one person to protect), the **Detective** (chooses one person to investigate — the phone secretly tells them if that person is Mafia).`,`**Morning:** the phone announces who was eliminated overnight. If the Doctor protected the victim, **nobody dies**. Eliminated players are out, but may watch silently.`,`**Day:** everyone talks. Accuse people, defend yourself, share clues — and lie if you are Mafia! You can use the timer to keep the discussion moving.`,`**Vote:** when the group agrees on a suspect, tap that player. They are eliminated and their role is revealed.`,`Night → Morning → Day → Vote repeats until one team wins.`],
 ex:[`> Example: 6 players. 1 Mafia, 1 Doctor, 1 Detective, 3 Civilians. Secretly: Ana = Mafia, Ben = Detective, Cara = Doctor, Dan / Eli / Fay = Civilians.`,`> **Night 1.** Ana (Mafia) picks Dan. Cara (Doctor) protects Fay. Ben (Detective) investigates Ana — the phone whispers "Ana is MAFIA".`,`> **Morning 1.** The phone says "Dan was eliminated." Dan is out.`,`**Ben:** "I'm the Detective. I checked Ana last night — she's Mafia!"`,`**Ana:** "That's a lie! Ben is the Mafia, he's trying to frame me!"`,`**Eli:** "Ben didn't have a reason to invent this… I vote Ana."`,`> Most players vote Ana. Her role is revealed: Mafia. Town wins because no Mafia is left!`],
 win:`**Town:** vote out all Mafia. **Mafia:** be equal to or more than the remaining Town.`,
 net:`Everyone sees their own role on their own phone. At night, only the roles that act see buttons (Mafia see their teammates). In the day, tap **Ready to vote** (when more than half are ready, voting starts), then everyone votes on their phone or taps **Skip — no elimination**. Needs 4+ players; Doctor + Detective appear with 5+.`,
 tips:[`Detective: revealing too early gets you killed. Wait for a moment you can prove it.`,`Mafia: copy what Town says. Pretend to be as confused as everyone else.`,`Everyone: watch who votes quickly or who always votes with the crowd.`]},

spy:{t:'🕵️ Spy Hunt',meta:['👥 3–12 players','⏱ 5–10 min','🔀 2 modes: Classic + Word Hint'],
 goal:`**Classic (locations):** everyone except one player knows a secret **location**. Town must find the **Spy**; the Spy must work out the location. *(For the other mode, choose **Word Hint** and tap ? there.)*`,
 need:`Pass-the-phone: one phone. Different phones: each player's phone shows their own card.`,
 steps:[`**Set up:** choose players, names, and the time limit. The phone secretly picks one location and one Spy.`,`**Card reveal:** pass the phone to each player. They tap Reveal. Everyone EXCEPT the Spy sees the **location** and their **role** there (like "Doctor" at a Hospital). The Spy sees only "You are the SPY". Hide, then pass.`,`**Start the timer.** Players take turns asking **any** other player **one question** about the location. Good questions are specific but not obvious: "Is it loud here?" ✔  "Is this a hospital?" ✘.`,`Answers must be **true but vague** — prove you belong without handing the Spy the answer.`,`The Spy tries to blend in and figure out the location from what they hear.`,`**Accuse** anyone at any time (or when time ends). The group votes. If the accused person is the Spy, the Spy gets **one last chance**: pick the location from a list of 8. A correct guess still wins for the Spy!`],
 ex:[`> Location: **Hospital**. Ana = Doctor, Ben = Nurse, Cara = Patient, Dan = **Spy**.`,`**Ana → Ben:** "Do you have to wear something special here?"`,`**Ben:** "Yes, and it's usually a bit colorful."`,`**Ben → Dan:** "How busy is it today?"`,`**Dan (Spy):** "Pretty busy… as usual."  *(He bluffs.)*`,`**Dan → Cara:** "Is it loud where you are?"`,`**Cara:** "Not really. People speak softly."`,`**Cara → Dan:** "What did you do before you came here?"`,`**Dan:** "Uh… the usual stuff."  *(Suspiciously vague!)*`,`> The group accuses Dan. He's the Spy, so he gets the final guess from 8 locations. If he picks Hospital, he wins anyway — which is why answers shouldn't be too obvious!`],
 win:`**Town wins** if they correctly accuse the Spy and the Spy guesses the wrong location. **Spy wins** if they guess the location, or if the group accuses the wrong person.`,
 net:`Each phone privately shows the location + role (or "You are the SPY"). A 5-minute timer runs. Anyone can tap **Call a vote**; everyone then taps who they suspect. If the Spy is voted out they guess from 8 locations. The Spy can also tap **I know the location!** at any time to guess early — right = Spy wins, wrong = Town wins. There are 55 locations and none repeat until all are used.`,
 tips:[`Spy: ask questions that sound clever but work for many places.`,`Town: don't give away too much, or the Spy simply guesses at the end.`,`Roles matter! If you're the Nurse, answer like a nurse.`]},

wspy:{t:'💬 Spy Hunt: Word Hint',meta:['👥 3–12 players','⏱ 3–8 min','🎲 choose a genre or Random'],
 goal:`Everyone gets the **same secret word — except one imposter** who only knows the **genre**. Take turns giving hints. Town finds the imposter; the imposter tries to blend in or guess the word.`,
 need:`Pass-the-phone: one phone. Different phones: each phone shows your word privately.`,
 steps:[`**Pick a genre:** People, Places, Animals, Food, Objects, Moments, School — or **🎲 Random**, which draws from ALL genres. Choose how many minutes the hint round lasts.`,`**Secret reveal:** pass the phone around. Most players see the **word**. The imposter sees "You are the IMPOSTER" and the **genre** only.`,`**Hint round:** players take turns in the order shown. On your turn say **one hint** out loud (a single word or short phrase), then tap **Hint given — next player**.`,`Hints must **prove you know the word** without making it too easy. Too obvious = the imposter learns it. Too vague = you look like the imposter.`,`Keep going around until the timer ends (or anyone taps **Call the vote now**).`,`**Vote:** everyone points at their suspect at the same time. Tap the person with the most votes.`,`If the imposter is caught, they get **one guess** at the word from 8 choices in the same genre.`],
 ex:[`> Genre: **Food**. Secret word: **Halo-Halo**. Ana, Ben, Dan know it. **Cara is the imposter** (she only knows "Food").`,`**Ana:** "Cold."`,`**Ben:** "Layers."`,`**Cara (imposter):** "Popular."  *(a safe, vague hint)*`,`**Dan:** "Summer."`,`**Ana (round 2):** "Purple."`,`**Cara:** "Sweet."`,`> Vote → Cara is caught. Her 8 choices all look like foods: Halo-Halo, Pizza, Sushi, Taho… Using the clues "Cold, Layers, Summer, Purple" she picks Halo-Halo and **wins anyway**! Better hints would have been trickier.`],
 win:`**Town** wins if the imposter is voted out AND guesses wrongly. **Imposter** wins if not caught, or if they guess the word.`,
 net:`The Lobby Master picks the genre before starting. Each phone shows the word (or the imposter screen). The player whose turn it is sees **Hint given ✔**. A 3-minute timer runs, then everyone votes on their own phone. The imposter's guess screen appears only on their phone.`,
 tips:[`Imposter: copy the style of earlier hints, and don't hesitate.`,`Town: avoid hints like the word's first letter.`,`Genre "Random" is the hardest — the imposter has less to go on, but so do you.`]},

ttt:{t:'⭕ Ultimate Tic-Tac-Toe',meta:['👥 2 players (others watch)','⏱ 10–15 min','🧠 thinking game'],
 goal:`Win **three small boards in a row** on the big 3×3 board — like tic-tac-toe, but every square is its own tic-tac-toe game.`,
 need:`Pass-the-phone: 2 players share one phone. Different phones: the first two players in the lobby are ✕ and ○, everyone else spectates live.`,
 steps:[`The big board has **9 small boards**. ✕ goes first and may play in **any** small board.`,`**The Golden Rule:** the square you pick inside a small board decides where your opponent must play next. If you pick the **top-right** square of any small board, your opponent must play in the **top-right small board**.`,`Win a small board by getting 3 in a row there. That board is now claimed by you (it shows a big ✕ or ○) and can't be played in anymore.`,`If you're sent to a board that is **already won or full**, you may play in **any open board**.`,`The glowing board(s) show where you're allowed to play.`,`Win the game by claiming 3 small boards in a **row, column or diagonal**. If all boards are done and nobody has a line, it's a draw.`],
 ex:[`> Players: **Ana (✕)** and **Ben (○)**.`,`**Ana:** plays the **center** square of the **center** board.`,`> The center square means Ben must play in the **center board**.`,`**Ben:** plays the **top-right** square of the center board.`,`> Now Ana must play in the **top-right board**.`,`**Ana:** wins that board with three ✕ in the middle row. It turns into a big ✕.`,`> Later Ben is sent to the top-right board — but it's already won — so he may play **anywhere**. That freedom is powerful: use it to attack!`],
 win:`Claim three small boards in a line. Draw if all boards are finished with no line.`,
 net:`The first two players in the lobby are ✕ and ○; extra players see the live board as spectators. Only the player whose turn it is can tap the glowing squares. The host can start a **Rematch (swap sides)**.`,
 tips:[`Think about where your move SENDS your opponent, not just what it does here.`,`Sending someone to a nearly-won board can be a trap — or a gift.`,`It is often smart to sacrifice a small board to control where the opponent plays.`]},

dice:{t:`🎲 Liar's Dice`,meta:['👥 2–8 players','⏱ 10–20 min','🤥 bluffing game'],
 goal:`Everyone has secret dice. Bid on how many dice of one face exist **on the whole table**. Catch bluffers to make them lose dice. **Last player with dice wins.**`,
 need:`Pass-the-phone: one phone — each player looks at their dice privately when it is handed to them. Different phones: your dice are on your own screen.`,
 steps:[`Choose players and **dice per player** (5 is classic). Tap Roll & start. Everyone secretly looks at their own dice (pass-the-phone: look, **hide**, pass).`,`The first player makes a **bid**: a quantity and a face — for example "**3 × ⚃**" means "there are at least three 4s among ALL dice on the table".`,`Each next player must either **raise the bid** (a higher quantity, **or** the same quantity with a higher face) **or call 🚨 Liar!**`,`When someone calls Liar, **all dice are revealed** and counted. In this version **1s are NOT wild** — only the exact face counts.`,`If the true count is **at least** the bid → the bid was honest and the **caller** loses one die. If it's lower → the bidder bluffed and **the bidder** loses one die.`,`Everyone re-rolls. The loser starts the next round. A player with 0 dice is out.`],
 ex:[`> Ana, Ben and Cara each have 3 dice (9 in total).`,`**Ana** (secretly 2, 2, 5) bids **3 × ⚁** (three 2s).`,`**Ben** (1, 4, 6) raises: **4 × ⚁**.`,`**Cara** (3, 3, 2) raises with a higher face: **4 × ⚂** (four 3s).`,`**Ana** bluffs bigger: **5 × ⚂**.`,`**Ben:** "Liar!" — all dice are shown. 3s: Ana 0 + Ben 0 + Cara 2 = **2**. Only 2 threes, the bid was 5.`,`> The bid was a bluff → **Ana loses a die**. She starts the next round.`],
 win:`Be the last player who still has dice.`,
 net:`Your dice are only on your phone. When it's your turn use **− / +** for quantity, tap a face, then **Bid** or **🚨 Liar!**. The game tells you whose turn it is, shows everyone's dice at the reveal (the bid face is highlighted), and removes the die automatically.`,
 tips:[`Count your own dice first: if you hold three 4s, bidding on 4s is safer.`,`Bluff when the bid is already high — others can't be sure.`,`Don't always raise by one — sudden big jumps confuse people.`]},

wc:{t:'🔤 Word Chain Blitz',meta:['👥 2–10 players','⏱ 5–10 min','⚡ fast thinking'],
 goal:`Say a word that **starts with the last letter of the previous word** before your timer runs out. Run out of lives and you're eliminated. **Last player standing wins.**`,
 need:`Pass-the-phone: one phone, passed to the player whose turn it is (or the phone stays on the table and each player types). Different phones: type on your own phone when it's your turn.`,
 steps:[`Choose the number of players, **lives** (1–5) and the **timer** per turn (10–30 seconds).`,`The first player may type **any word**. The last letter of that word becomes the **starting letter** for the next player (shown in big letters on screen).`,`On your turn: type a word that starts with that letter and tap **Submit →**.`,`You lose a life if you: run out of time, type a word that starts with the wrong letter, repeat a word that was already used, or tap **💀 Skip**.`,`When you lose all lives you're out. The game checks the starting letter and repeats only — **the group** decides if a word is real, so challenge fake words!`],
 ex:[`> 3 lives each, 20-second timer. Players: Ana, Ben, Cara.`,`**Ana:** "tiger" → next letter is **R**.`,`**Ben:** "river" → next letter is **R** again.`,`**Cara:** "rabbit" → letter **T**.`,`**Ana:** "tiger" → ❌ already used! Ana loses a life (2 ❤ left).`,`**Ben (after Ana's penalty, still T):** "table" → letter **E**.`,`**Cara:** "eagle" → **E**. And so on until only one player has lives.`],
 win:`Be the last player with lives left.`,
 net:`The phone of the player whose turn it is shows a typing box and a big timer; everyone else watches the chain grow. Timeouts and mistakes are announced to everyone.`,
 tips:[`Words ending in X, Q or Z are traps — try ending your word with a hard letter!`,`Keep a few long words ready for common letters.`]},

tq:{t:'🤔 20 Questions',meta:['👥 3–12 players','⏱ 5–10 min','🕵️ yes/no questions'],
 goal:`The **Thinker** secretly picks something. Everyone else asks **yes/no/maybe** questions to guess it in **20 questions or fewer**.`,
 need:`Pass-the-phone: one phone is passed to the Thinker first. Different phones: the Thinker types their secret on their own phone.`,
 steps:[`Choose the players, then pick the **Thinker** (tap a name or **🎲 Pick randomly**).`,`The Thinker takes the phone secretly, types the secret (an animal, person, place, object…) and an optional **category**, then taps **Lock in 🔒**.`,`Hand the phone back to the group. Tap **Start questions →**.`,`Players take turns asking a question **out loud** that can be answered with yes / no / maybe.`,`The Thinker taps **✅ Yes**, **🤔 Maybe** or **❌ No**. The counter goes down and the answers are listed.`,`When someone guesses right, tap **🎉 Guessed it!**. If the counter reaches 0 or the group gives up, the Thinker wins.`],
 ex:[`> Ben is the Thinker. Secret: **Penguin**. Category: Animal.`,`**Ana:** "Does it live in water?" → Ben taps 🤔 Maybe.`,`**Cara:** "Can it fly?" → ❌ No.`,`**Dan:** "Is it black and white?" → ✅ Yes.`,`**Ana:** "Does it live somewhere cold?" → ✅ Yes.`,`**Cara:** "Is it a penguin?" → ✅ Yes!`,`> Ben taps 🎉 Guessed it! — they needed only 5 of the 20 questions.`],
 win:`**The group** wins by guessing in time. **The Thinker** wins if all 20 questions are used up.`,
 net:`The Thinker types on their own phone. Everyone sees the question counter and answers list; only the Thinker sees the secret and the Yes/Maybe/No buttons. The host can start the **next Thinker** after each round.`,
 tips:[`Start with big questions: alive? bigger than a person? found in the Philippines?`,`Thinker: pick something fair — not too obscure!`]},

hot:{t:'🔥 Hot Takes',meta:['👥 2–12 players','⏱ endless','🗣 debate game'],
 goal:`A spicy opinion appears. Defend it, attack it, then everybody picks a side. The **minority** has to explain their choice. There's no score — it's all about the arguments!`,
 need:`Pass-the-phone: one phone on the table, everyone points on "three". Different phones: tap 👍 or 👎 secretly on your own phone.`,
 steps:[`Choose the players. A **hot take** card appears: for example "Homework should be banned on weekends."`,`Discuss for a moment. The player in the spotlight starts by defending (or attacking) it.`,`On "three", everyone shows their opinion: **👍 Agree** or **👎 Disagree** (pass-the-phone: point; different phones: tap a button).`,`Count the votes. The **smaller side (the minority)** explains why they think that. If it's an even split, everyone defends their side!`,`Tap **Next card** for a new take.`],
 ex:[`> Card: "**Pineapple belongs on pizza.**" 6 players.`,`**Ana (spotlight):** "Yes! The sweet and salty combo is perfect."`,`> On three: 4 players point 👍, 2 point 👎.`,`> 👎 is the minority → **Ben and Dan must explain.**`,`**Ben:** "Fruit is for dessert, not dinner."`,`**Dan:** "The pineapple makes the pizza soggy."`,`> Tap Next card. Another take appears!`],
 win:`Nobody wins or loses — it's a conversation starter. Play as long as you like.`,
 net:`Everyone secretly taps 👍/👎, then the results show who voted what and who the minority is. The host taps **Next take**.`,
 tips:[`Defend a take even if you disagree — it's more fun!`,`Keep explanations short so everyone gets a turn.`]},

nhie:{t:'🫣 Never Have I Ever',meta:['👥 2–12 players','⏱ 10–15 min','🖐 elimination'],
 goal:`Everyone starts with **5 fingers**. Confess to things you've done and lose fingers. **Last player with fingers wins.**`,
 need:`Pass-the-phone: one phone shows the card and the finger list. Different phones: each player answers honestly on their own phone.`,
 steps:[`Choose the players. Everyone starts with 🖐 ×5.`,`A card appears, like "Never have I ever… fallen asleep in class."`,`**Anyone who HAS done it loses a finger** — tap their name (pass-the-phone) or tap **✋ I have** (different phones). If you haven't, tap **🙅 I have not**.`,`Tap **Next card**. New card, new confessions.`,`A player with **0 fingers is out**. The last player left wins!`],
 ex:[`> Players: Ana, Ben, Cara (🖐×5 each).`,`> Card 1: "…fallen asleep in class."  Ana and Cara have → both drop to 4 fingers.`,`> Card 2: "…sent a text to the wrong person."  Only Ben has → Ben 4 fingers.`,`> Card 3: "…waved at someone who wasn't waving at me."  Everyone has → Ana 3, Ben 3, Cara 3.`,`> …after many cards, Cara reaches 0 and is out. Ana and Ben keep going until one finger decides it.`],
 win:`Be the last with at least 1 finger.`,
 net:`Everyone answers privately on their phone. After all have answered, the results show who confessed and everyone's fingers update. The host taps **Next card**.`,
 tips:[`It's a game of honesty — no fibbing!`,`Strategy: nothing. Just embarrassment. 😅`]},

emo:{t:'📖 Emoji Story',meta:['👥 3–12 players','⏱ 10–15 min','🎭 charades with emojis'],
 goal:`A movie or title is shown only as **emojis**. The spotlight player **mimes** it (no words!) and the others guess the title.`,
 need:`Pass-the-phone: one phone on the table shows the emojis. Different phones: everyone sees the emojis, but only the actor sees the title.`,
 steps:[`Choose the players. The spotlight player for the round is shown.`,`The emojis for a title appear (like 🦁👑). Everyone can see them — they're the clue!`,`The spotlight player **mimes** or acts the title. **No talking or sounds!**`,`Everyone else shouts out guesses.`,`Pass-the-phone: tap **Reveal answer** when someone guesses or time runs out, then **Next card**.`],
 ex:[`> Emojis: **🦁👑**. Spotlight: Ana.`,`> Ana roars like a lion, then places an imaginary crown on her head.`,`**Ben:** "Lion King!"`,`> Ana taps Ben. **+1 point each** for Ana and Ben (different phones). Pass-the-phone: tap Reveal answer → "The Lion King".`,`> Next round: the next player takes the spotlight.`],
 win:`Different phones: whoever has the most points when the host taps **Finish game**. Pass-the-phone: for fun — no scoring.`,
 net:`60-second timer per round. Everyone sees the emojis. The **actor** also sees the title and taps **who guessed it** — both get +1. The host moves to the next round or finishes the game.`,
 tips:[`Act out the **number of words** and **syllables** with your fingers.`,`Mime the most famous scene.`]},

wyr:{t:'⚖️ Would You Rather Duel',meta:['👥 2–12 players','⏱ endless','🤔 dilemmas'],
 goal:`Two impossible choices appear. Everyone picks a side. The **minority has to explain** why they chose differently.`,
 need:`Pass-the-phone: one phone — tap each player's pick. Different phones: everyone taps A or B on their own phone.`,
 steps:[`Choose the players. A dilemma appears with **🅰️** and **🅱️**.`,`Think! Decide silently.`,`Pass-the-phone: for each player, tap **A** or **B** in their row (everyone says their choice out loud). Different phones: tap your own choice.`,`When everyone has picked, the result shows how many chose each side.`,`The **minority explains** their choice. Perfect split? Everyone defends their side!`,`Tap **Next** for a new dilemma.`],
 ex:[`> Dilemma: **A) Have no homework forever** or **B) Have no exams forever.**`,`> Ana picks A, Ben A, Cara B, Dan A, Eli B.`,`> Result: 🅰️ 3 · 🅱️ 2 → the minority is **Cara and Eli**.`,`**Cara:** "Homework takes my free time every day!"`,`**Eli:** "Exams are what stress me, not homework."`],
 win:`No scoring — enjoy the debate.`,
 net:`Everyone's choice is hidden until all have voted; then the split and the minority are shown to everyone. The host taps **Next**.`,
 tips:[`Make people explain *why* — that's where the fun is.`,`Pass-the-phone: each person should say their choice out loud *before* the host taps it, so nobody copies the crowd.`,`Make up a follow-up question for the minority: "Would you still choose that if…?"`]},

cha:{t:'🎭 Charades Deck',meta:['👥 3–12 players','⏱ 60 sec per round','🎬 acting game'],
 goal:`The spotlight player **mimes a secret word** in 60 seconds, **no sounds or words**. Score points when the room guesses it.`,
 need:`Pass-the-phone: pass the phone to the actor first, then put it where everyone can see the timer. Different phones: only the actor's phone shows the word.`,
 steps:[`Choose the players. The phone says whose turn it is — pass it to them.`,`The actor taps **show my word** and reads it privately (with its category, like Movie / Animal / Job / Pinoy).`,`The 60-second timer starts. The actor mimes — **no talking, no pointing at words!**`,`The others shout guesses. When someone is right, the actor taps **who guessed it**. Both get **+1 point**.`,`If the time runs out or you want to skip, the word is revealed. Tap **Next player**.`,`Tap **Finish game** to see the final ranking.`],
 ex:[`> Actor: Cara. Secret: **Taking a selfie** (category 🎬 Action).`,`> Cara holds up an imaginary phone, makes a duck face, and clicks.`,`**Ana:** "Taking a photo!"  **Ben:** "Selfie!"`,`> Cara taps **Ben** → +1 for Cara and +1 for Ben.`,`> The phone moves to the next actor.`],
 win:`Highest points when the game is finished.`,
 net:`Guessers only see the **category** and the timer. The actor sees the word and taps who guessed. The host moves to the next round.`,
 tips:[`Start by showing the **category** (movie? animal?).`,`Use big movements — small ones are easy to miss.`]},

tri:{t:'🧠 Trivia Showdown',meta:['👥 2–12 players','⏱ 10 questions','⚡ speed bonus (online)'],
 goal:`Answer 10 multiple-choice questions. **Most points wins.**`,
 need:`Pass-the-phone: one person reads the questions aloud and everyone answers out loud. Different phones: everyone answers on their own screen.`,
 steps:[`Choose the players. A question with four answers A–D appears.`,`**Pass-the-phone:** the phone-holder reads the question and answers aloud; everyone decides; tap **Reveal answer**; then tap **everyone who got it right** (+1 each); tap **Next question**.`,`**Different phones:** tap your answer within **15 seconds**. Faster correct answers earn **more points** (500–1000).`,`After 10 questions the winner is shown.`],
 ex:[`> Question 3: "**Capital city of the Philippines?** A) Cebu B) Davao C) Manila D) Baguio"`,`> Ana taps C in 2 seconds → about 930 points. Ben taps C in 12 seconds → about 600 points. Cara taps A → 0.`,`> The correct answer (C) is shown. Everyone sees the score list. The host taps **Next question**.`,`> **Pass-the-phone version of the same question:** the reader says the question and options aloud. Ana and Ben shout "C!", Cara says "A!". The reader taps **Reveal answer** (C is green), then taps **Ana** and **Ben** (they get +1 each) and taps **Next question**.`,`> After question 10 the phone shows the winners and the final score list.`],
 win:`Highest score after 10 questions.`,
 net:`Everyone answers privately. When all have answered (or time runs out) the right answer and the leaderboard appear. The host taps **Next question**.`,
 tips:[`Don't rush if you aren't sure — a wrong answer scores 0, but a slow right one still scores!`,`Pass-the-phone: the reader should read all four answers before anyone answers, so nobody gets a head start.`,`Different phones: you can only answer once per question — tap carefully.`]},

cn:{t:'🗝️ Codenames Lite',meta:['👥 4–12 players (teams)','⏱ 15–20 min','🔴 vs 🔵'],
 goal:`Two teams (**🔴 Red** and **🔵 Blue**). Each team's **Spymaster** knows which of the 25 words belong to their team. They give one-word clues so their **operatives** find all of their team's agents first.`,
 need:`Pass-the-phone: one phone in the middle; spymasters peek at the key. Different phones: teams are assigned automatically and spymasters see the key on their phones.`,
 steps:[`The board has 25 words. The starting team has **9 agents**, the other has **8**. There are **7 neutral** bystanders and **1 💥 assassin**.`,`The **Spymaster** gives a clue: **one word + one number** (e.g. "ocean 3" = 3 words relate to "ocean"). The clue must NOT be a word on the board.`,`The team's **operatives** discuss and tap words one by one.`,`If it's **your agent** → keep guessing (up to the number + 1). Neutral or the **other team's** agent → your turn ends. **Assassin → your team loses immediately!**`,`Tap **End turn** when you want to stop.`,`The first team to find **all** of their agents wins.`],
 ex:[`> Red team. Red words include: **Whale, Dolphin, Anchor**. The assassin is **Spider**.`,`**Red Spymaster:** "Ocean 3."`,`**Operatives:** tap **Whale** → it turns red ✓. Tap **Dolphin** → red ✓. Tap **Anchor** → red ✓.`,`> They've used their 3 guesses. They may use one bonus guess but stop and tap **End turn**.`,`**Blue Spymaster:** "Web 1." Operatives tap **Spider** — it's the assassin! 💥 → **Blue loses**, Red wins.`],
 win:`Find all your team's words first. Hit the assassin and your team loses.`,
 net:`Players are split into Red and Blue; the first player on each team is the **Spymaster** (they see the colored key). Spymasters type their clue ("ocean 3") on their phone, then only that team's operatives can tap words. Needs 4+ players.`,
 tips:[`Pass-the-phone: make sure only spymasters look at the **🗝️ Spymaster key**.`,`Spymasters: connect 2–3 words with a clean clue; avoid clues that point to the assassin.`]},

tel:{t:'📞 Telephone Whispers',meta:['👥 3–12 players','⏱ 5–10 min','😂 chaos'],
 goal:`A message is passed down the line **alternating between words and emojis**. At the end, laugh at how it changed!`,
 need:`Pass-the-phone: one phone passed to each player in turn. Different phones: everyone plays at the same time.`,
 steps:[`Player 1 **writes a silly phrase** (tap 💡 for ideas).`,`Player 2 sees the phrase and writes it using **only emojis** — no letters!`,`Player 3 sees only the emojis and writes what they **think it means in words**.`,`The chain continues (words → emojis → words…) until everyone has played.`,`At the end, the **whole chain** is revealed in order with every player's name.`],
 ex:[`> Players: Ana, Ben, Cara, Dan.`,`**1. Ana (words):** "A pirate eating halo-halo".`,`**2. Ben (emojis):** 🏴‍☠️🍧.`,`**3. Cara (words):** "A pirate with ice cream".`,`**4. Dan (emojis):** 🍦🌊.`,`> The final reveal shows the chain: phrase → emojis → new phrase → emojis. It's now far from the original.`],
 win:`Nobody wins — the laughs are the prize.`,
 net:`Everyone starts their **own** chain, and each round every chain moves to the next player. A 90-second timer per round; at the end you see **every** chain.`,
 tips:[`Emoji turns: don't type letters, only emojis.`,`Be creative — the weirder, the funnier.`]},

dg:{t:'🎨 Draw & Guess',meta:['👥 3–12 players','⏱ 60 sec per round','✏️ drawing game'],
 goal:`The artist secretly draws a word; the others shout guesses. When someone is right, both the artist and the guesser score.`,
 need:`Your finger! Pass-the-phone: the artist draws, then shows the drawing to everyone. Different phones: the drawing appears **live** on everyone's phone.`,
 steps:[`The phone shows whose turn it is. Pass it to the artist (pass-the-phone).`,`The artist taps **show my word** and sees it — like "Pizza".`,`Draw it with your finger. No letters or numbers! Use the colors, **🧽 eraser**, **● / •** (brush size) and **🗑** (clear).`,`When done (or when time runs out), tap **Done**. Everyone sees the final drawing.`,`Others shout guesses. The artist taps **who guessed it** (+1 each). Nobody? Tap **Nobody**.`,`Tap **Next artist** or **Finish game**.`],
 ex:[`> Artist: Ben. Word: **Jeepney**.`,`> Ben draws a long bus, a front hood and wheels. Ana shouts "Bus!", Cara shouts "Jeepney!"`,`> Ben taps **Cara** → +1 point for Ben and +1 point for Cara.`,`> The phone moves to the next artist.`],
 win:`Most points when the game ends.`,
 net:`Everyone else sees your drawing update about every second. The artist's screen doesn't refresh while drawing, so nothing gets erased. The host picks Next artist.`,
 tips:[`Draw the **most recognizable part** first.`,`Short on time? Draw outlines, not details.`]},

hz:{t:'🔐 Heist Planner',meta:['👥 3–10 players','⏱ 10–15 min','🐀 hidden traitor'],
 goal:`The crew must pull off a heist by passing **3 out of 5 jobs**. But a secret **🐀 Rat** is among you, trying to make **3 jobs fail**.`,
 need:`Pass-the-phone: one phone passed in private. Different phones: your role is on your own screen.`,
 steps:[`Each player secretly gets a **specialty**: 💻 Hacker, 🚗 Driver, 🔐 Safecracker, 👀 Lookout, 🪪 Forger or 💪 Muscle. One player is also the **Rat**. Reveal privately (pass-the-phone: Reveal, then Hide & pass).`,`A job appears, such as "Laser grid blocks the hallway — needs 💻 Hacker".`,`**Talk it out:** who should handle it? Claim your specialty (the Rat may lie!). Then choose one person (everyone votes on different phones; pass-the-phone: tap the name).`,`The chosen player secretly acts: **🛠 Do the job** (or, if they're the Rat, **🐀 Sabotage it**).`,`**Result:** the **right specialty always succeeds**. A **wrong specialty** succeeds only **40%** of the time. Sabotage always fails.`,`The first side to reach **3 successes (✅)** or **3 failures (❌)** ends the heist. The Rat and everyone's specialty are revealed.`],
 ex:[`> Players: Ana (Hacker), Ben (Driver 🐀 **the Rat**), Cara (Safecracker), Dan (Lookout).`,`> **Job 1: "Laser grid blocks the hallway" → needs Hacker.** Ana: "I'm the Hacker, I'll do it." Ben: "Me too, I'm the Hacker!" (a lie). The crew trusts Ana and picks her. She taps Do the job → ✅ success.`,`> **Job 2: "The vault door is sealed" → needs Safecracker.** The crew picks Cara → ✅ again (2/3).`,`> **Job 3: "The getaway truck needs hotwiring" → needs Driver.** Ben (the Rat) says "I'm the Driver!" — the crew picks him since he's telling the truth. But he taps 🐀 **Sabotage** → ❌ fail.`,`> **Job 4:** the crew assigns Dan; he's a Lookout doing a Hacker job → 40% chance, fails ❌. Job 5 succeeds (3/3 ✅). **The crew wins!** The Rat is revealed: Ben.`],
 win:`**Crew:** 3 successful jobs. **Rat:** 3 failed jobs without being caught.`,
 net:`Your specialty is always shown at the top of your own screen (Rat players also get the Rat reminder). Everyone votes who should do each job. Only the chosen player sees the action buttons.`,
 tips:[`Crew: ask who has the matching specialty — then watch who volunteers too eagerly.`,`Rat: sometimes do the job honestly to build trust, then sabotage on a key job.`]}
};
const Help={
 fmt:t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>'),
 html(id){const h=HOW[id];if(!h)return '<p>No guide for this screen yet.</p>';const f=Help.fmt;
  let o='<div class="howto"><div class="how-meta">'+h.meta.map(m=>'<span class="pill">'+f(m)+'</span>').join('')+'</div>';
  o+='<h4>🎯 The goal</h4><p>'+f(h.goal)+'</p>';
  if(h.need)o+='<h4>🧰 What you need</h4><p>'+f(h.need)+'</p>';
  o+='<h4>📖 Step by step</h4><ol class="how-steps">'+h.steps.map(s=>'<li>'+f(s)+'</li>').join('')+'</ol>';
  if(h.ex)o+='<h4>🎬 Full example</h4><div class="how-demo">'+h.ex.map(l=>l.startsWith('>')?'<div class="how-note">'+f(l.slice(1).trim())+'</div>':'<div class="how-line">'+f(l)+'</div>').join('')+'</div>';
  if(h.win)o+='<h4>🏆 How to win</h4><p>'+f(h.win)+'</p>';
  if(h.net)o+='<h4>📡 On different phones</h4><p>'+f(h.net)+'</p>';
  if(h.tips)o+='<h4>💡 Tips</h4><ul>'+h.tips.map(x=>'<li>'+f(x)+'</li>').join('')+'</ul>';
  return o+'</div>';},
 show(id){const h=HOW[id];if(!h)return;modal(h.t+' — How to play',Help.html(id));},
 open(){Help.show(HELP.id);}
};

const Net=(()=>{
  const $e=id=>document.getElementById(id);let mode='local';
  const rtcCfg=()=>mode==='online'?{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}:{iceServers:[]};
  let wgenre='random',role=null,roster=[],pending=[],nid=1,lg='spy',game=null,gst=null,hc=null,myId=0,run=false,inGame=false,joinReply='',peers={};
  const enc=d=>btoa(JSON.stringify({type:d.type,sdp:d.sdp,m:mode==='online'?'o':'l'})),dec=t=>JSON.parse(atob(t.replace(/\s+/g,'')));
  const gathered=pc=>new Promise(r=>{if(pc.iceGatheringState==='complete')return r();const f=()=>{if(pc.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',f);r();}};pc.addEventListener('icegatheringstatechange',f);setTimeout(r,mode==='online'?7000:3500);});
  const send=(p,o)=>{try{if(p&&p.dc&&p.dc.readyState==='open')p.dc.send(JSON.stringify(o));}catch{}};
  const on=()=>roster.filter(r=>!r.off);
  function copyTa(id){const t=$e(id);if(!t)return;t.select();try{navigator.clipboard.writeText(t.value);}catch{}try{document.execCommand('copy');}catch{}SFX.success();}
  function netOk(){if(typeof RTCPeerConnection==='undefined'){alert('This browser does not support phone-to-phone play. Try Chrome or Safari.');return false;}return true;}


  /* ===================== ROOM-CODE LOBBY (PeerJS broker, host-authoritative) =====================
     States: idle → creating|joining → lobby(host|client) → playing → lobby … → leaving → idle
     Identity: stable client id (cid) in localStorage; a refresh/reconnect restores the same seat.
     Liveness: client pings every 4s; host drops silent peers after 14s (no arbitrary sync delays). */
  const ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',PRE='idleroom-';
  const hh=c=>String(c).split('').reduce((a,ch)=>(a*31+ch.charCodeAt(0))>>>0,7).toString(36);
  let mig=null,strict=false,via=null,code='',peer=null,busy=false,tok=0,hb=null,lastSeen={},reconn=0,reconT=null,leaving=false,hostConn0=null;
  const myCid=(()=>{let c=S.get('idle_cid','');if(!c){c=Math.random().toString(36).slice(2)+Date.now().toString(36);S.set('idle_cid',c);}return c;})();
  const myName=()=>String(S.get('idle_name','')||'').replace(/[<>]/g,'').trim().slice(0,18);
  const mkCode=()=>Array.from({length:4},()=>ALPHA[0|Math.random()*ALPHA.length]).join('');
  const parse=d=>{try{const m=typeof d==='string'?JSON.parse(d):d;return m&&typeof m==='object'?m:null;}catch{return null;}};
  function flash(t){const b=$e('toasts');if(!b)return;const d=document.createElement('div');d.className='toast';d.textContent=t;b.appendChild(d);while(b.children.length>3)b.firstChild.remove();setTimeout(()=>d.remove(),2600);}
  function hubBusy(w,t){const b=$e(w==='c'?'hbCreate':'hbJoin');if(b){b.dataset.t=b.dataset.t||b.textContent;b.textContent=t;b.classList.add('busy');}const o=$e(w==='c'?'hbJoin':'hbCreate');if(o)o.disabled=true;}
  function hubReset(){[['hbCreate','Create lobby'],['hbJoin','Join']].forEach(([i,t])=>{const b=$e(i);if(b){b.textContent=t;b.classList.remove('busy');b.disabled=false;}});}
  function showErr(m){const e=$e('hbErr');if(e){e.textContent=m;e.classList.add('show');}else flash(m);}
  function hideErr(){const e=$e('hbErr');if(e)e.classList.remove('show');}
  function noLib(){showErr('Online lobbies need an internet connection. Use "Pair manually" below to play on the same Wi-Fi without internet.');}
  function wrapConn(conn){return{conn,dc:{get readyState(){return conn.open?'open':'closed';},send:s=>conn.send(s)},pc:{close(){try{conn.close();}catch{}}}};}
  function startHb(){clearInterval(hb);hb=setInterval(()=>{
    if(role==='client'&&via==='code'&&hc&&hc.dc.readyState==='open')send(hc,{t:'ping'});
    if(role==='host'&&via==='code'){const now=Date.now();Object.keys(peers).forEach(id=>{if(now-(lastSeen[id]||now)>14000){try{peers[id].conn.close();}catch{}peerGone(peers[id]);}});}
  },4000);}
  function teardown(){leaving=true;clearInterval(hb);clearTimeout(reconT);tok++;busy=false;reconn=0;try{if(peer)peer.destroy();}catch{}peer=null;via=null;code='';lastSeen={};try{sessionStorage.removeItem('idle_room');sessionStorage.removeItem('idle_host');}catch{}hubReset();setTimeout(()=>{leaving=false;},0);}

  function create(want){
    if(busy||role)return;if(!mig)strict=false;if(typeof want!=='string'||!/^[A-Z2-9]{4}$/.test(want))want='';SFX.unlock();if(typeof Peer==='undefined')return noLib();
    busy=true;hideErr();hubBusy('c','Creating…');const my=++tok;let tries=0;
    const attempt=()=>{
      if(my!==tok)return;const c=(tries<4&&want)||mkCode(),pr=new Peer(PRE+c,{debug:0});let open=false;
      const timer=setTimeout(()=>{if(!open&&my===tok){tok++;busy=false;try{pr.destroy();}catch{}if(mig)return giveUp();hubReset();showErr('Could not reach the lobby service. Check your connection and retry.');}},9000);
      pr.on('open',()=>{clearTimeout(timer);if(my!==tok){pr.destroy();return;}open=true;busy=false;peer=pr;code=c;via='code';role='host';HELP.id='lobby';
        try{sessionStorage.setItem('idle_host',c);}catch{}roster=[{id:0,name:myName()||'Host',cid:myCid,h:hh(myCid)}];nid=1;pending=[];lg='spy';gst=null;game=null;peers={};lastSeen={};
        if(mig){mig.forEach(r=>roster.push({id:nid++,name:r.name,h:r.h,off:true}));mig=null;strict=false;flash('You are now the host 👑');setTimeout(()=>{if(role==='host'&&!gst){roster=roster.filter(r=>!r.off);lobbyPush();render();}},20000);}
        startHb();SFX.success();render();});
      pr.on('connection',hostConn);
      pr.on('disconnected',()=>{if(open&&peer===pr&&!pr.destroyed){try{pr.reconnect();}catch{}}});
      pr.on('error',e=>{if(!open){clearTimeout(timer);try{pr.destroy();}catch{}if(e.type==='unavailable-id'&&(!strict||tries<4)&&tries++<8)return want&&tries<=4?void setTimeout(attempt,1500):attempt();if(my===tok){tok++;busy=false;if(mig)return giveUp();hubReset();showErr('Could not create a room. Check your internet and retry.');}}});
    };attempt();
  }
  function hostConn(conn){
    const p=Object.assign(wrapConn(conn),{pid:null});
    conn.on('data',d=>{const m=parse(d);if(!m)return;if(p.pid!=null)lastSeen[p.pid]=Date.now();
      if(m.t==='ping')send(p,{t:'pong'});else if(m.t==='hi')hostHi(p,m);else if(m.t==='act'&&gst&&p.pid!=null&&typeof m.a==='string')onAct(p.pid,m.a.slice(0,40),m.g);});
    conn.on('close',()=>peerGone(p));conn.on('error',()=>peerGone(p));
  }
  function hostHi(p,m){
    if(p.pid!=null||role!=='host')return;
    const cid=String(m.cid||'').slice(0,40);let nm=String(m.name||'').replace(/[<>]/g,'').trim().slice(0,18)||'Player';
    let r=cid?roster.find(x=>x.id!==0&&(x.cid===cid||x.h===hh(cid))):null;
    if(r){r.cid=cid;if(peers[r.id]&&peers[r.id]!==p)try{peers[r.id].conn.close();}catch{}r.off=false;r.gone=false;flash(nm+' reconnected');}
    else{if(on().length>=12){send(p,{t:'err',e:'full'});return;}
      let k=2,b=nm;while(roster.some(x=>x.name===nm))nm=b+' '+k++;r={id:nid++,name:nm,cid,h:hh(cid)};roster.push(r);flash(nm+' joined');}
    p.pid=r.id;peers[r.id]=p;lastSeen[r.id]=Date.now();SFX.success();
    send(p,{t:'you',id:r.id,code});lobbyPush();if(gst)push();else render();
  }
  function peerGone(p){
    if(p.pid==null||peers[p.pid]!==p)return;const r=roster.find(x=>x.id===p.pid);delete peers[p.pid];
    if(r){flash(r.name+' disconnected');if(gst&&!r.gone)r.off=true;else roster=roster.filter(x=>x!==r);}
    lobbyPush();if(gst)push();else if(role==='host')render();
  }
  function joinCode(raw){
    if(busy||role)return;const c=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');SFX.unlock();hideErr();
    if(c.length!==4)return showErr('Enter the 4-character room code.');
    if(typeof Peer==='undefined')return noLib();
    busy=true;hubBusy('j','Joining…');connectTo(c,false);
  }
  function connectTo(c,silent){
    const my=++tok;let done=false;const pr=new Peer({debug:0});
    const fail=m=>{if(done||my!==tok)return;done=true;tok++;try{pr.destroy();}catch{}if(silent)return giveUp();busy=false;hubReset();showErr(m);};
    const timer=setTimeout(()=>fail('Room not found, or no connection. Check the code and retry.'),10000);
    pr.on('error',e=>{if(done)return;clearTimeout(timer);fail(e.type==='peer-unavailable'?'Room not found. Check the code.':'Connection problem. Please retry.');});
    pr.on('open',()=>{if(my!==tok)return pr.destroy();
      const conn=pr.connect(PRE+c,{reliable:true});
      conn.on('open',()=>conn.send(JSON.stringify({t:'hi',name:myName()||'Player',cid:myCid})));
      conn.on('data',d=>{const m=parse(d);if(!m||my!==tok&&!done)return;
        if(m.t==='err'){return fail(m.e==='full'?'That room is full.':'Could not join that room.');}
        if(m.t==='you'&&!done){done=true;clearTimeout(timer);busy=false;reconn=0;try{if(peer&&peer!==pr)peer.destroy();}catch{}peer=pr;code=c;via='code';role='client';hc=wrapConn(conn);hostConn0=conn;myId=m.id;HELP.id='lobby';leaving=false;
          try{sessionStorage.setItem('idle_room',c);}catch{}startHb();SFX.success();}
        if(done&&peer===pr)onHost(m);});
      conn.on('close',()=>{if(!done)return fail('The room closed.');if(peer===pr&&role==='client'&&!leaving)hostLost();});
    });
  }
  function successor(){const c=roster.filter(r=>r.id!==0&&!r.off&&!r.gone).map(r=>r.id);return c.length?Math.min(...c):-1;}
  function takeOver(){
    const c=code,list=roster.filter(r=>r.id!==0&&r.id!==myId&&!r.gone).map(r=>({name:r.name,h:r.h}));
    clearTimeout(reconT);reconT=null;tok++;try{if(peer)peer.destroy();}catch{}peer=null;hc=null;role=null;via=null;gst=null;game=null;inGame=false;
    mig=list;strict=true;busy=false;create(c);
  }
  function giveUp(){mig=null;strict=false;flash('The host left the room');leave();}
  function hostLost(){
    if(reconT)return;flash('Connection lost — reconnecting…');
    const tryAgain=()=>{reconT=null;if(role!=='client'||leaving)return;if(++reconn>14)return giveUp();if(reconn>3&&successor()===myId&&role==='client')return takeOver();try{if(peer)peer.destroy();}catch{}peer=null;const c=code,saveRole=role;
      // keep role/view; connectTo swaps in the new connection when the host answers
      const my=++tok,pr=new Peer({debug:0});let ok=false;pr.on('error',()=>{if(!ok&&my===tok)reconT=setTimeout(()=>{reconT=null;hostLost();},1500);});
      pr.on('open',()=>{const conn=pr.connect(PRE+c,{reliable:true});conn.on('open',()=>conn.send(JSON.stringify({t:'hi',name:myName()||'Player',cid:myCid})));
        conn.on('data',d=>{const m=parse(d);if(!m)return;if(m.t==='you'&&!ok){ok=true;reconn=0;peer=pr;hc=wrapConn(conn);myId=m.id;flash('Reconnected ✓');}if(ok)onHost(m);});
        conn.on('close',()=>{if(ok&&role==='client'&&!leaving)hostLost();else if(!ok&&my===tok&&!reconT)reconT=setTimeout(()=>{reconT=null;hostLost();},1500);});});};
    reconT=setTimeout(tryAgain,600);
  }
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&role==='client'&&via==='code'&&hc&&hc.dc.readyState!=='open'&&!reconT)hostLost();});
  addEventListener('pagehide',()=>{if(role==='client'&&hc)send(hc,{t:'bye'});});
  function share(){const t='Join my IDLE lobby! Room code: '+code;if(navigator.share)navigator.share({title:'IDLE',text:t}).catch(()=>{});else copyCode();}
  function copyCode(){try{navigator.clipboard.writeText(code);}catch{}flash('Code '+code+' copied');}
  function renderRoom(){
    DrawPad.stop();setTheme(null);const host=role==='host',ps=roster.filter(r=>!r.gone&&(!r.off||gst)),act=on(),g=NG[lg]||NG.spy,ok=act.length>=g.min&&act.length<=g.max;
    const who=r=>r.off?'<span class="pill off">reconnecting…</span>':r.id===0?'<span class="pill">👑 host</span>':r.id===myId&&!host?'<span class="pill live">you</span>':'<span class="pill live">ready</span>';
    $a().innerHTML='<div class="screen">'+hdr('Lobby',host?'You are the host':'Waiting for the host',null,'Net.leaveAsk')+
      '<div class="roomcode"><div class="rc-l">ROOM CODE</div><div class="rc-c">'+code.split('').map(ch=>'<span>'+nE(ch)+'</span>').join('')+'</div><div class="brow"><button class="btn btn-ghost btn-sm" style="background:var(--card)" onclick="Net.share()">📤 Share</button><button class="btn btn-ghost btn-sm" style="background:var(--card)" onclick="Net.copyCode()">📋 Copy</button></div></div>'+
      '<div class="card"><div class="slabel">Players ('+act.length+')</div>'+nlist(ps,who)+'</div>'+
      '<div class="card"><div class="slabel">'+(host?'Pick a game':'Next game')+'</div><div class="llist">'+chips()+'</div></div>'+
      (host&&lg==='wspy'?'<div class="card"><div class="slabel">Word genre</div>'+wChips(wgenre,'Net.setGenre')+'</div>':'')+
      (host?'<div class="lobstat'+(ok?' ready':'')+'"><i></i>'+(ok?'Ready — '+act.length+' players':nE(g.n)+' needs '+g.min+'–'+g.max+' players')+'</div><button class="btn btn-ink btn-block" '+(ok?'':'disabled')+' onclick="Net.start()">'+(ok?'Start '+nE(g.n)+' →':'Waiting for players…')+'</button>':nwait(run?'A game is running — you\'ll join the next one.':'Waiting for the host to start…'))+'</div>';
  }

  /* ---------- HOST ---------- */
  function chooser(kind){SFX.unlock();HELP.id='lobby';role=null;
    const h=kind==='host';
    $a().innerHTML='<div class="screen">'+hdr(h?'Host a lobby':'Join a lobby','Choose how to connect',null,'Net.leave')+
     '<div class="modecard mc-a" onclick="Net.'+(h?'hostGo':'joinGo')+'(\'local\')"><div class="mc-i">📶</div><div><b>Same Wi-Fi / hotspot</b><span>Free — no mobile data needed. Everyone must be on the same Wi-Fi, or connected to one person\'s hotspot. Best for the classroom.</span></div></div>'+
     '<div class="modecard mc-b" onclick="Net.'+(h?'hostGo':'joinGo')+'(\'online\')"><div class="mc-i">🌐</div><div><b>Online</b><span>Friends can be anywhere, on different networks. Uses mobile data or internet Wi-Fi.</span></div></div>'+
     '<p class="helptext" style="text-align:center">'+(h?'Not sure? Tap <b>?</b> at the top for step-by-step help.':'The code your host sends decides the type — we switch automatically.')+'</p></div>';}
  function host(){if(!netOk())return;chooser('host');}
  function hostGo(m){mode=m==='online'?'online':'local';hostStart();}
  function hostStart(){if(!netOk())return;SFX.unlock();HELP.id='lobby';role='host';roster=[{id:0,name:(S.get('idle_name','')||'').trim()||'Host'}];nid=1;pending=[];lg='spy';gst=null;game=null;peers={};render();}
  async function invite(){
    const pc=new RTCPeerConnection(rtcCfg()),dc=pc.createDataChannel('g'),p={pc,dc,code:'',ans:'',pid:null};pending.push(p);render();
    dc.onmessage=m=>onPeer(p,JSON.parse(m.data));
    dc.onclose=()=>{if(p.pid!=null){const r=roster.find(x=>x.id===p.pid);if(r)r.off=true;lobbyPush();if(gst)push();else render();}};
    await pc.setLocalDescription(await pc.createOffer());await gathered(pc);p.code=enc(pc.localDescription);render();
  }
  async function accept(i){
    const p=pending[i],t=$e('ans'+i);if(!p||!t)return;
    try{await p.pc.setRemoteDescription(dec(t.value.trim()));t.value='';p.ans='';p.wait=true;render();}catch{alert('That reply code is not valid. Ask them to copy it again.');}
  }
  function drop(i){const p=pending[i];if(p){try{p.pc.close();}catch{}pending.splice(i,1);render();}}
  function onPeer(p,m){
    if(m.t==='hi'&&p.pid==null){let nm=String(m.name||'Player').trim().slice(0,18)||'Player',k=2,b=nm;while(roster.some(r=>r.name===nm))nm=b+' '+k++;
      p.pid=nid++;roster.push({id:p.pid,name:nm});peers[p.pid]=p;pending=pending.filter(x=>x!==p);send(p,{t:'you',id:p.pid});SFX.success();lobbyPush();if(!gst)render();}
    else if(m.t==='act'&&gst&&p.pid!=null)onAct(p.pid,m.a,m.g);
  }
  function lobbyPush(){const o={t:'lobby',roster:roster.map(r=>({id:r.id,name:r.name,off:r.off,gone:r.gone,h:r.h})),lg,run:!!gst};Object.values(peers).forEach(p=>send(p,o));}
  function setGenre(k){if(role==='host'&&(k==='random'||WGEN[k])){wgenre=k;SFX.tap();render();}}
  function pick(id){if(role==='host'&&NG[id]){lg=id;SFX.tap();lobbyPush();render();}}
  function start(){if(gst||role!=='host')return;const g=NG[lg],ps=on();if(!g||ps.length<g.min||ps.length>g.max)return;game=lg;HELP.id=lg;gst=g.init(ps.map(r=>({id:r.id,name:r.name})),lg==='wspy'?{genre:wgenre}:undefined);SFX.reveal();push();}
  function wrap(pid,h){const off=pid===0?roster.filter(r=>r.off&&!r.gone):[];const ga=GA[game]||GA.spy;return '<div class="screen gscreen" style="--ga:'+ga[0]+';--ga2:'+ga[1]+'">'+'<div class="gbar"><b>'+NG[game].i+'</b><span>'+nE(NG[game].n)+'</span></div>'+hdr(NG[game].n,pid===0?(via==='code'?'You are the host':'You are the lobby master'):'Lobby game',null,'Net.leaveAsk')+off.map(r=>'<div class="card" style="background:var(--hl);display:flex;align-items:center;gap:10px;font-weight:700;font-size:.85rem;padding:12px 14px"><span style="flex:1">⚠ '+nE(r.name)+' disconnected</span><button class="btn btn-ink btn-sm" onclick="Net.kick('+r.id+')">Remove &amp; continue</button></div>').join('')+h+'</div>';}
  function push(){if(!gst)return;if(role==='host')setTheme(game);on().forEach(r=>{if(gst.ps&&!gst.ps.some(q=>q.id===r.id))return;let h;try{h=wrap(r.id,NG[game].view(gst,r.id));}catch(e){console.error(e);return;}if(r.id===0)showView(h);else send(peers[r.id],{t:'view',html:h,g:game});});}
  function setImg(d){const e=$e('live');if(e&&d)e.src=d;}
  function onAct(pid,a,g){if(!gst)return;let r;try{r=NG[game].act(gst,pid,a,g);}catch(e){console.error(e);}
    if(r==='img'){on().forEach(x=>{if(x.id===pid)return;if(x.id===0)setImg(gst.img);else send(peers[x.id],{t:'img',d:gst.img});});return;}push();}
  function kick(id){const r=roster.find(x=>x.id===id);if(!r||!r.off)return;r.gone=true;if(gst&&NG[game].kick){try{NG[game].kick(gst,id);}catch(e){console.error(e);}}push();}
  function toLobby(){if(role!=='host')return;HELP.id='lobby';gst=null;game=null;Object.values(peers).forEach(p=>send(p,{t:'toLobby'}));lobbyPush();render();}
  function act(a,g){if(role==='host')onAct(0,a,g);else send(hc,{t:'act',a,g});}
  function actIn(a,id){const e=$e(id);act(a,e?e.value:'');}
  function leaveAsk(){if(role==='host'&&gst){if(confirm('Back to the lobby? The game will end for everyone.'))toLobby();}else if(confirm('Leave the lobby?'))leave();}
  function leave(){teardown();try{Object.values(peers).forEach(p=>p.pc.close());pending.forEach(p=>p.pc.close());if(hc&&hc.pc)hc.pc.close();}catch{}role=null;gst=null;game=null;hc=null;peers={};pending=[];inGame=false;joinReply='';renderHub();}

  function showView(h){const keep={},fa=document.activeElement&&document.activeElement.id;document.querySelectorAll('#app input[id],#app textarea[id]').forEach(e=>keep[e.id]=e.value);$a().innerHTML=h;Object.keys(keep).forEach(k=>{const e=$e(k);if(e&&keep[k])e.value=keep[k];});if($e('dcv'))DrawPad.init(d=>act('img',d));else DrawPad.stop();tickDom();const f=$e(fa||'wcn');if(f&&f.tagName==='INPUT'){f.focus();try{f.setSelectionRange(f.value.length,f.value.length);}catch{}}}
  function tickDom(){document.querySelectorAll('[data-left]').forEach(e=>{if(!e.dataset.end)e.dataset.end=Date.now()+ +e.dataset.left*1000;});document.querySelectorAll('[data-end]').forEach(e=>{const s=nsecs(+e.dataset.end-Date.now());e.textContent=fmtTime(s);e.classList.toggle('urgent',s<=30&&s>0);});}
  setInterval(()=>{tickDom();if(role==='host'&&gst&&NG[game].tick&&NG[game].tick(gst))push();},1000);

  function chips(){return Object.keys(NG).map(k=>{const g=NG[k];return '<div class="lrow'+(k===lg?' sel':'')+'" '+(role==='host'?'onclick="Net.pick(\''+k+'\')"':'style="cursor:default"')+'><div class="avatar" style="background:none;font-size:1.3rem">'+g.i+'</div><div class="rname">'+nE(g.n)+'</div><span class="pill">'+g.min+'–'+g.max+'</span><button class="chip" style="padding:3px 9px" onclick="event.stopPropagation();Help.show(\''+k+'\')">?</button></div>';}).join('');}
  function render(){
    if(via==='code')return renderRoom();
    DrawPad.stop();if(!gst)setTheme(null);
    if(role==='host'){
      pending.forEach((p,i)=>{const t=$e('ans'+i);if(t)p.ans=t.value;});
      if(gst)return;
      const ps=on(),g=NG[lg],ok=ps.length>=g.min&&ps.length<=g.max;
      $a().innerHTML='<div class="screen">'+hdr('Lobby','You are the lobby master',null,'Net.leaveAsk')+
        '<div class="card"><div class="slabel">In the lobby ('+ps.length+') · '+(mode==='online'?'🌐 Online':'📶 Wi-Fi / hotspot')+'</div>'+nlist(ps,r=>r.id===0?'<span class="pill">👑 master</span>':'<span class="pill" style="background:var(--ok);color:#fff">online</span>')+'</div>'+
        pending.map((p,i)=>'<div class="card"><div class="slabel">New phone '+(i+1)+'</div>'+
          (p.code?'<p class="helptext">1. Send this code to the friend (any chat app):</p><textarea id="code'+i+'" readonly style="font-family:var(--fmono);font-size:.62rem;height:64px">'+p.code+'</textarea><button class="btn btn-ghost btn-sm" style="margin:6px 0" onclick="Net.copy(\'code'+i+'\')">Copy code</button>'+
            '<p class="helptext">2. Paste the reply code they send back:</p><textarea id="ans'+i+'" style="font-family:var(--fmono);font-size:.62rem;height:64px" placeholder="Reply code">'+nE(p.ans||'')+'</textarea>'+
            (p.wait?'<p class="helptext">Connecting…</p>':'<button class="btn btn-ink btn-sm" style="margin-top:6px" onclick="Net.accept('+i+')">Connect</button>')
            :'<p class="helptext">Making a code…</p>')+
          ' <button class="btn btn-ghost btn-sm" style="margin-top:6px" onclick="Net.drop('+i+')">Cancel</button></div>').join('')+
        '<button class="btn btn-accent btn-block" onclick="Net.invite()">➕ Invite a phone</button>'+
        '<p class="helptext" style="margin:6px 2px 14px">'+(mode==='online'?'🌐 <b>Online</b> — friends can be anywhere. Everyone needs mobile data or internet Wi-Fi. If someone can\'t connect, try again once or use hotspot mode.':'📶 <b>Same Wi-Fi / hotspot</b> — everyone must be on the same network. No mobile data needed.')+' Codes contain your network address — only send them to friends.</p>'+
        '<div class="card"><div class="slabel">Pick a game (you can change it any time)</div><div class="llist">'+chips()+'</div></div>'+(lg==='wspy'?'<div class="card"><div class="slabel">Word genre</div>'+wChips(wgenre,'Net.setGenre')+'</div>':'')+
        '<button class="btn btn-ink btn-block" '+(ok?'':'disabled')+' onclick="Net.start()">'+(ok?'Start '+nE(g.n)+' →':nE(g.n)+' needs '+g.min+'–'+g.max+' players')+'</button></div>';
    }else if(role==='client'){
      const ps=on();
      $a().innerHTML='<div class="screen">'+hdr('Lobby','Connected',null,'Net.leaveAsk')+'<div class="card"><div class="slabel">In the lobby ('+ps.length+')</div>'+nlist(ps,r=>(r.id===0?'<span class="pill">👑 master</span>':r.id===myId?'<span class="pill">you</span>':''))+'</div>'+
        '<div class="card"><div class="slabel">Next game</div><div class="llist">'+chips()+'</div></div>'+nwait(run?'A game is running. You will join the next one.':'Waiting for the lobby master to start…')+'</div>';
    }
  }

  /* ---------- JOIN ---------- */
  function joinScreen(){if(!netOk())return;chooser('join');}
  function joinGo(m){mode=m==='online'?'online':'local';SFX.unlock();HELP.id='lobby';role='client';joinReply='';renderJoin();}
  function renderJoin(){
    $a().innerHTML='<div class="screen">'+hdr('Join a lobby','Different phone',null,'Net.leave')+
      '<div class="card"><div class="slabel">Your name</div><input value="'+nE(S.get('idle_name',''))+'" placeholder="you" oninput="S.set(\'idle_name\',this.value)"/></div>'+
      '<p class="helptext" style="text-align:center">'+(mode==='online'?'🌐 Online mode':'📶 Same Wi-Fi / hotspot mode')+'</p>'+(joinReply?
        '<div class="card"><p class="helptext">Send this reply code to the lobby master. You will connect automatically.</p><textarea id="reply" readonly style="font-family:var(--fmono);font-size:.62rem;height:80px">'+joinReply+'</textarea><button class="btn btn-ink btn-block" style="margin-top:8px" onclick="Net.copy(\'reply\')">Copy reply code</button></div>'
        :'<div class="card"><p class="helptext">Paste the code the lobby master sent you.</p><textarea id="jc" style="font-family:var(--fmono);font-size:.62rem;height:80px" placeholder="Lobby code"></textarea><button class="btn btn-ink btn-block" style="margin-top:8px" onclick="Net.joinMake()">Make my reply code</button></div>')+'</div>';
  }
  async function joinMake(){
    let off;try{off=dec($e('jc').value.trim());}catch{return alert('That code is not valid. Copy the whole thing again.');}
    if(off.m){const nm2=off.m==='o'?'online':'local';if(nm2!==mode){mode=nm2;alert('This code is for '+(mode==='online'?'🌐 Online':'📶 Same Wi-Fi / hotspot')+' mode — switched automatically.');}}
    const nm=(S.get('idle_name','')||'').trim().slice(0,18)||'Player';
    const pc=new RTCPeerConnection(rtcCfg());hc={pc};
    pc.ondatachannel=e=>{const dc=e.channel;hc.dc=dc;
      dc.onopen=()=>{inGame=false;dc.send(JSON.stringify({t:'hi',name:nm}));};
      dc.onmessage=m=>onHost(JSON.parse(m.data));
      dc.onclose=()=>{if(role==='client'){alert('Lost connection to the lobby.');leave();}};};
    try{await pc.setRemoteDescription(off);await pc.setLocalDescription(await pc.createAnswer());await gathered(pc);joinReply=enc(pc.localDescription);renderJoin();}
    catch{alert('Could not use that code.');}
  }
  function onHost(m){
    if(m.t==='pong')return;
    if(m.t==='you'){myId=m.id;}
    else if(m.t==='lobby'){if(!Array.isArray(m.roster))return;roster=m.roster;lg=NG[m.lg]?m.lg:'spy';run=!!m.run;if(!run)inGame=false;if(!inGame)render();}
    else if(m.t==='view'){inGame=true;HELP.id=m.g||'lobby';setTheme(typeof m.g==='string'&&GA[m.g]?m.g:null);showView(m.html);}
    else if(m.t==='toLobby'){inGame=false;HELP.id='lobby';render();}
    else if(m.t==='img')setImg(m.d);
  }
  return{create,joinCode,share,copyCode,hideErr,host,hostGo,joinGo,invite,accept,drop,setGenre,pick,start,act,actIn,kick,toLobby,leave,leaveAsk,joinScreen,joinMake,copy:copyTa,render};
})();

/* ================================================================
   BOOT
   ================================================================ */
(()=>{
  Object.keys(GAME_DATA.words).forEach(k=>{if(WGEN[k]){const have=new Set(WGEN[k][1].split(',').map(x=>x.toLowerCase()));WGEN[k][1]+=','+GAME_DATA.words[k].split(',').filter(w=>!have.has(w.toLowerCase())).join(',');}});
  mergeUnique(WYR,GAME_DATA.wyr);mergeUnique(CHA,GAME_DATA.cha);mergeUnique(TRI,GAME_DATA.tri);mergeUnique(CNW,GAME_DATA.cnw);mergeUnique(TELP,GAME_DATA.tel);mergeUnique(DGW,GAME_DATA.dg);
  (()=>{const D=Party.DK;[['hot',GAME_DATA.hot],['nhie',GAME_DATA.nhie],['emo',GAME_DATA.emo]].forEach(([k,a])=>{if(D[k]&&a)mergeUnique(D[k].c,a);});})();
  document.getElementById('muteBtn').textContent=SFX.isMuted()?'🔇':'🔊';
  renderHub();
  try{const hc0=sessionStorage.getItem('idle_host'),rc=sessionStorage.getItem('idle_room');if(hc0)Net.create(hc0);else if(rc){const i=document.getElementById('hbCode');if(i)i.value=rc;Net.joinCode(rc);}}catch{}
})();
</script>
