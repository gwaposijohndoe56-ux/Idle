  (EXTRA+'\n'+GAME_DATA.spyLocs).split('\n').forEach(l=>{const[n,r]=l.split(';');if(n&&r&&!LOCS.some(x=>x.n===n))LOCS.push({n:n.trim(),r:r.split(',')});});
  function nextLoc(){
    let b=S.get('spy_bag',[]).filter(n=>LOCS.some(l=>l.n===n));
    if(!b.length)b=shuffle(LOCS.map(l=>l.n));
    const n=b.pop();S.set('spy_bag',b);
    return LOCS.findIndex(l=>l.n===n);
  }
  let cfg,st,timerOn=false,tLeft=0,_tt=null;
  function defCfg(){return{count:clamp(S.get('s_count',5),3,10),namesText:getRoster(),timer:clamp(S.get('s_timer',300),60,900)};}
  function lnk(){return leaveLink('G.confirmLeave');}
  function shdr(t,s){return hdr(t,s,'Spy.rules','G.confirmLeave');}

  function startClassic(){HELP.id='spy';cfg=defCfg();setupRender();}function start(){SpyMode.choose();}
  function setupRender(){
    $a().innerHTML=
      '<div class="screen">'+hdr('Spy Hunt','Game setup','Spy.rules')+
      '<div class="card"><div class="slabel">Players</div><div class="stepper"><button onclick="Spy.sc(-1)">−</button><div class="val">'+cfg.count+'</div><button onclick="Spy.sc(1)">+</button></div><p class="helptext" style="text-align:center;">3–10 · best with 4+</p></div>'+
      '<div class="card"><div class="slabel">Names (one per line, optional)</div><textarea placeholder="Leave blank for Player 1, 2…" oninput="Spy.sn(this.value)">'+esc(cfg.namesText)+'</textarea></div>'+
      '<div class="card"><div class="slabel">Discussion timer</div><div class="stepper"><button onclick="Spy.stc(-30)">−</button><div class="val" style="font-size:1.25rem;">'+fmtTime(cfg.timer)+'</div><button onclick="Spy.stc(30)">+</button></div></div>'+
      '<button class="btn btn-ink btn-block" onclick="Spy.deal()">Assign roles & start →</button>'+
      '</div>';
  }
  function sc(d){cfg.count=clamp(cfg.count+d,3,10);S.set('s_count',cfg.count);setupRender();}
  function sn(v){cfg.namesText=v;setRoster(v);}
  function stc(d){cfg.timer=clamp(cfg.timer+d,60,900);S.set('s_timer',cfg.timer);setupRender();}

  function rules(){modal('Spy Hunt — How to Play',
    '<p>One player is secretly the <b>Spy</b>. Everyone else knows the same location and has a role there.</p>'+
    '<p><b>How to play:</b> Take turns asking each other questions about the location — without naming it directly. The Spy tries to figure out the location from your answers. Everyone else tries to catch the Spy.</p>'+
    '<p><b>Accuse:</b> At any time, accuse someone of being the Spy. If you\'re right, the Spy gets one final chance: guess the location correctly to steal the win!</p>'+
    '<p class="helptext">Good questions are specific but not obvious: "How busy is it here?" or "Did you have to pay to get in?"</p>'
  );}

  function deal(){
    const names=parseNames(cfg.namesText,cfg.count);
    const loc=LOCS[nextLoc()];
    const spyIdx=0|Math.random()*names.length;
    const roles=shuffle(loc.r);
    st={
      players:names.map((n,i)=>({id:i,name:n,isSpy:i===spyIdx,role:roles[i%roles.length]})),
      loc,spyId:spyIdx
    };
    passSequence(
      st.players,
      p=>p.name,
      p=>{
        if(p.isSpy)return(
          '<div style="font-size:2.6rem;">🕵️</div>'+
          '<div class="slabel" style="margin:8px 0 3px;">'+esc(p.name)+', you are the</div>'+
          '<div style="font-size:1.75rem;font-weight:800;color:var(--c-spy2);">SPY</div>'+
          '<p class="helptext" style="margin-top:10px;">You don\'t know the location. Listen to answers, ask vague questions, and try to figure it out — or just stay hidden until time runs out.</p>'
        );
        return(
          '<div style="font-size:2.4rem;">📍</div>'+
          '<div class="slabel" style="margin:8px 0 3px;">'+esc(p.name)+', the location is</div>'+
          '<div style="font-size:1.6rem;font-weight:800;color:var(--c-spy2);">'+esc(st.loc.n)+'</div>'+
          '<p class="helptext" style="margin-top:6px;">Your role: <b>'+esc(p.role)+'</b></p>'+
          '<p class="helptext">One player is the Spy and doesn\'t know the location. Don\'t give it away too obviously!</p>'
        );
      },
      discuss
    );
  }

  function discuss(){
    tLeft=cfg.timer;timerOn=false;
    $a().innerHTML=
      '<div class="screen">'+shdr('Spy Hunt','Question round')+
        '<div class="card" style="text-align:center;">'+
          '<p class="helptext" style="margin-bottom:10px;">Ask each other questions about the location. Don\'t say its name!</p>'+
          '<div class="timer-disp" id="spyTimer">'+fmtTime(tLeft)+'</div>'+
          '<div class="brow" style="margin-top:14px;">'+
            '<button class="btn btn-ghost" id="spyTimerBtn" onclick="Spy.timerToggle()">Start</button>'+
            '<button class="btn btn-accent" onclick="Spy.accuse()">Accuse someone</button>'+
          '</div>'+
        '</div>'+
        '<div class="card"><div class="slabel">Players</div><div class="llist">'+
          st.players.map(p=>'<div class="lrow" style="cursor:default;"><div class="avatar">'+esc((p.name[0]||'?').toUpperCase())+'</div><div class="rname">'+esc(p.name)+'</div></div>').join('')+
        '</div></div>'+
      lnk()+'</div>';
  }
  function timerToggle(){
    timerOn=!timerOn;
    const b=document.getElementById('spyTimerBtn');if(b)b.textContent=timerOn?'Pause':'Start';
    if(timerOn)tick_();
  }
  function tick_(){
    if(!timerOn)return;
    tLeft=Math.max(0,tLeft-1);
    const el=document.getElementById('spyTimer');
    if(el){el.textContent=fmtTime(tLeft);el.classList.toggle('urgent',tLeft<=30&&tLeft>0);}
    if(tLeft<=0){timerOn=false;SFX.bad();accuse();return;}
    _tt=setTimeout(tick_,1000);
  }

  function accuse(){
    timerOn=false;clearTimeout(_tt);
    $a().innerHTML=
      '<div class="screen">'+shdr('Accusation','Who is the Spy?')+
        '<div class="card"><div class="slabel">Tap the player you think is the Spy</div>'+
          '<div class="llist">'+st.players.map(p=>'<div class="lrow" onclick="Spy.accuseOn('+p.id+')"><div class="avatar">'+esc((p.name[0]||'?').toUpperCase())+'</div><div class="rname">'+esc(p.name)+'</div></div>').join('')+'</div>'+
        '</div>'+
      lnk()+'</div>';
  }
  function accuseOn(id){
    const p=st.players.find(x=>x.id===id);
    if(!p)return;
    if(!confirm('Accuse '+p.name+' of being the Spy?'))return;
    if(p.isSpy){
      SFX.success();
      $a().innerHTML=
        '<div class="screen"><div class="deskcard">'+
          '<div style="font-size:2rem;">🎯</div>'+
          '<div style="font-size:1.3rem;font-weight:800;margin:8px 0;">Caught! '+esc(p.name)+' is the Spy!</div>'+
          '<p class="helptext">The Spy gets one last chance — guess the location correctly and they still win!</p>'+
          '<div class="brow" style="margin-top:14px;">'+
            '<button class="btn btn-ghost" style="flex:1;" onclick="Spy.spyPass()">Spy won\'t guess</button>'+
            '<button class="btn btn-accent" style="flex:1;" onclick="Spy.spyGuess()">Spy will guess</button>'+
          '</div>'+
        '</div>'+lnk()+'</div>';
    }else{
      SFX.fail();endScreen('TOWN_WRONG');
    }
  }
  function spyPass(){endScreen('TOWN');}
  function spyGuess(){
    // Offer 6 location choices that include the correct one, randomised
    let pool=[...LOCS].filter(l=>l.n!==st.loc.n);pool=shuffle(pool).slice(0,7);
    pool.push(st.loc);pool=shuffle(pool);
    $a().innerHTML=
      '<div class="screen"><div class="card" style="text-align:left;">'+
        '<div class="slabel" style="text-align:center;margin-bottom:12px;">Spy — where were you?</div>'+
        '<div class="llist">'+pool.map(l=>'<div class="lrow" onclick="Spy.spyPick('+LOCS.indexOf(l)+')"><div class="rname">'+esc(l.n)+'</div></div>').join('')+'</div>'+
      '</div></div>';
  }
  function spyPick(i){LOCS[i].n===st.loc.n?endScreen('SPY'):endScreen('TOWN');}

  function endScreen(result){
    SFX.win();burst();
    const spy=st.players.find(p=>p.isSpy);
    const RESULTS={
      SPY:        ['🕵️','Spy wins!',      'The Spy correctly identified the location!', 'var(--c-spy2)'],
      TOWN:       ['🏆','Town wins!',     'The Spy was caught and couldn\'t guess the location.','var(--ok-deep)'],
      TOWN_WRONG: ['🕵️','Spy wins!',      'Wrong accusation — the Spy was never caught!','var(--c-spy2)']
    };
    const m=RESULTS[result]||RESULTS.TOWN;
    $a().innerHTML=
      '<div class="screen">'+
        '<div class="deskcard" style="margin-bottom:14px;">'+
          '<div style="font-size:2.5rem;">'+m[0]+'</div>'+
          '<div style="font-size:1.5rem;font-weight:800;margin:6px 0;color:'+m[3]+';">'+m[1]+'</div>'+
          '<p class="helptext">'+m[2]+'</p>'+
          '<p class="helptext" style="margin-top:6px;">The location was <b>'+esc(st.loc.n)+'</b>. The Spy was <b>'+esc(spy.name)+'</b>.</p>'+
        '</div>'+
        '<div class="card"><div class="slabel">Everyone\'s role</div><div class="llist">'+
          st.players.map(p=>'<div class="lrow" style="cursor:default;"><div class="avatar">'+esc((p.name[0]||'?').toUpperCase())+'</div><div class="rname">'+esc(p.name)+'</div><span class="pill">'+(p.isSpy?'🕵️ Spy':esc(p.role))+'</span></div>').join('')+
        '</div></div>'+
        '<div class="brow"><button class="btn btn-ink" style="flex:1;" onclick="Spy.deal()">Play again</button><button class="btn btn-ghost" style="flex:1;" onclick="Spy.start()">New setup</button></div>'+
      '</div>';
  }

  function stop(){timerOn=false;clearTimeout(_tt);}
  return{LOCS,nextLoc,startClassic,stop,start,rules,sc,sn,stc,deal,timerToggle,accuse,accuseOn,spyPass,spyGuess,spyPick};
})();

/* ================================================================
   ██████████████████ GAME 3: ULTIMATE TIC-TAC-TOE ██████████████████
   Ultimate Tic-Tac-Toe rules:
   • 9 mini-boards arranged in a 3×3 meta-board.
   • Your move's position in a mini-board dictates which meta-cell
     the next player MUST play in.
   • Win a mini-board to claim it on the meta. Win 3 meta in a row
     to win the game. If sent to a won/full board → play anywhere.
   ================================================================ */
const UTTT=(()=>{
  // Board state: metaBoard[0-8] = who won mini ('X','O','D',null)
  // miniBoards[0-8][0-8] = cell owner ('X','O',null)
  // active = which meta-cell is forced (null = anywhere)
  // turn = 'X' or 'O'
  const WIN_LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  let st,p1,p2,scores={X:0,O:0,D:0};

  function checkMini(cells){
    for(const[a,b,c]of WIN_LINES)if(cells[a]&&cells[a]===cells[b]&&cells[a]===cells[c])return cells[a];
    if(cells.every(x=>x))return'D';
    return null;
  }
  function checkMeta(mb){
    for(const[a,b,c]of WIN_LINES)if(mb[a]&&mb[a]!=='D'&&mb[a]===mb[b]&&mb[a]===mb[c])return mb[a];
    if(mb.every(x=>x))return'D';
    return null;
  }
  function initState(){
    return{
      meta:Array(9).fill(null),
      mini:Array.from({length:9},()=>Array(9).fill(null)),
      active:null,turn:'X',winner:null,moveCount:0,
      lastMove:{meta:-1,cell:-1}
    };
  }

  function start(){
    scores={X:0,O:0,D:0};p1=null;p2=null;
    // Ask for player names
    const r=getRoster();const ns=parseNames(r,2);
    p1=ns[0];p2=ns[1];
    $a().innerHTML=
      '<div class="screen">'+hdr('Ultimate Tic-Tac-Toe','2 players')+
        '<div class="card">'+
          '<div class="slabel">Player names</div>'+
          '<div style="display:flex;flex-direction:column;gap:10px;margin-top:4px;">'+
            '<div style="display:flex;align-items:center;gap:10px;"><div style="width:28px;height:28px;border-radius:50%;background:var(--c-mafia);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;">X</div><input id="ttt_p1" value="'+esc(p1)+'" placeholder="Player 1"/></div>'+
            '<div style="display:flex;align-items:center;gap:10px;"><div style="width:28px;height:28px;border-radius:50%;background:var(--c-spy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;">O</div><input id="ttt_p2" value="'+esc(p2)+'" placeholder="Player 2"/></div>'+
          '</div>'+
        '</div>'+
        '<div class="card"><div class="slabel">How to play</div>'+
          '<p class="helptext">There are 9 mini boards inside a big board. Win 3 mini boards in a row to win. <b>The cell you pick in a mini board sends your opponent to that same-position board.</b> If that board is full or won, they can play anywhere.</p>'+
        '</div>'+
        '<button class="btn btn-ink btn-block" onclick="UTTT.begin()">Play →</button>'+
      '</div>';
  }

  function begin(){
    const i1=document.getElementById('ttt_p1'),i2=document.getElementById('ttt_p2');
    if(i1) p1=i1.value.trim()||'Player 1';
    if(i2) p2=i2.value.trim()||'Player 2';
    if(!p1) p1='Player 1';
    if(!p2) p2='Player 2';
    st=initState();render();
  }
  function rematch(){st=initState();render();}

  const POS=['top-left','top-center','top-right','mid-left','center','mid-right','bot-left','bot-center','bot-right'];
  function currentName(){return st.turn==='X'?p1:p2;}

  function render(){
    if(st.winner)return renderEnd();
    const turnColor=st.turn==='X'?'var(--c-mafia)':'var(--c-spy)';
    const turnName=currentName();

    // Status bar text
    let statusText;
    if(st.active===null)statusText='<b style="color:'+turnColor+';">'+esc(turnName)+'</b> — play in any open board';
    else statusText='<b style="color:'+turnColor+';">'+esc(turnName)+'</b> — play in <b>'+POS[st.active]+'</b> board ↓';

    let metaHtml='<div class="meta-wrap"><div class="meta-board">';
    for(let m=0;m<9;m++){
      const isActive=st.meta[m]===null&&(st.active===null||st.active===m);
      let cls='meta-cell';
      if(st.meta[m]==='X')cls+=' won-X';
      else if(st.meta[m]==='O')cls+=' won-O';
      else if(st.meta[m]==='D')cls+=' drawn-meta';
      else if(isActive)cls+=' active-zone';

      let inner='';
      if(st.meta[m]==='X'){inner='<div class="meta-cell-won-mark cx">X</div>';}
      else if(st.meta[m]==='O'){inner='<div class="meta-cell-won-mark co">O</div>';}
      else if(st.meta[m]==='D'){inner='<div class="meta-cell-won-mark cd">draw</div>';}
      else{
        inner='<div class="mini-board">';
        for(let c=0;c<9;c++){
          const val=st.mini[m][c];
          const canClick=isActive&&val===null;
          const isLast=m===st.lastMove.meta&&c===st.lastMove.cell;
          let mcls='mini-cell';
          if(val==='X')mcls+=' cx';
          else if(val==='O')mcls+=' co';
          if(!canClick)mcls+=' blocked';
          if(isLast)mcls+=' last';
          const onclick=canClick?'onclick="UTTT.place('+m+','+c+')"':'';
          inner+='<div class="'+mcls+'" '+onclick+'>'+(val||'')+'</div>';
        }
        inner+='</div>';
      }
      metaHtml+='<div class="'+cls+'">'+inner+'</div>';
    }
    metaHtml+='</div></div>';
    $a().innerHTML='<div class="screen">'+hdr('Ultimate Tic-Tac-Toe','Local game',null,'G.confirmLeave')+
        '<div class="ttt-legend">'+
          '<div class="ttt-chip cx">✕ '+esc(p1)+' <span style="opacity:.55;font-weight:600;">'+scores.X+'</span></div>'+
          '<div class="ttt-chip co">○ '+esc(p2)+' <span style="opacity:.55;font-weight:600;">'+scores.O+'</span></div>'+
        '</div>'+
        '<div class="card card-tight"><div class="uttt-status">'+statusText+'</div>'+metaHtml+'</div>'+
        '<div class="brow" style="margin-top:10px;"><button class="btn btn-ghost btn-sm" onclick="UTTT.start()">New game</button><button class="btn btn-ghost btn-sm" onclick="G.confirmLeave()">← Hub</button></div>'+
      '</div>';
  }

  function place(meta,cell){
    if(st.winner)return;
    if(st.meta[meta]!==null)return;
    if(st.active!==null&&st.active!==meta)return;
    if(st.mini[meta][cell]!==null)return;
    SFX.place();

    // Place piece
    st.mini[meta][cell]=st.turn;
    st.moveCount++;
    st.lastMove={meta,cell};

    // Check if mini board is won
    const miniWin=checkMini(st.mini[meta]);
    if(miniWin)st.meta[meta]=miniWin;

    // Determine next active board
    let next=cell;
    if(st.meta[next]!==null)next=null; // that board is done → play anywhere

    // Check global win
    const globalWin=checkMeta(st.meta);
    if(globalWin){st.winner=globalWin;render();return;}

    // If all meta cells decided → draw
    if(st.meta.every(x=>x)){st.winner='D';render();return;}

    // Switch turn
    st.turn=st.turn==='X'?'O':'X';
    st.active=next;
    render();
  }

  function renderEnd(){
    if(scores[st.winner]!==undefined) scores[st.winner]++;
    else scores.D++;
    SFX.win();burst();
    const isDraw=st.winner==='D';
    const winnerName=st.winner==='X'?p1:st.winner==='O'?p2:null;
    const col=st.winner==='X'?'var(--c-mafia)':st.winner==='O'?'var(--c-spy)':'var(--ink-dim)';

    let metaHtml='<div class="meta-wrap"><div class="meta-board">';
    for(let m=0;m<9;m++){
      let cls='meta-cell';
      if(st.meta[m]==='X')cls+=' won-X';
      else if(st.meta[m]==='O')cls+=' won-O';
      else if(st.meta[m]==='D')cls+=' drawn-meta';
      let inner='';
      if(st.meta[m]==='X')inner='<div class="meta-cell-won-mark cx">X</div>';
      else if(st.meta[m]==='O')inner='<div class="meta-cell-won-mark co">O</div>';
      else if(st.meta[m]==='D')inner='<div class="meta-cell-won-mark cd">draw</div>';
      else{
        inner='<div class="mini-board">';
        for(let c=0;c<9;c++){
          const v=st.mini[m][c];
          inner+='<div class="mini-cell blocked '+(v==='X'?'cx':v==='O'?'co':'')+'">'+( v||'')+'</div>';
        }
        inner+='</div>';
      }
      metaHtml+='<div class="'+cls+'">'+inner+'</div>';
    }
    metaHtml+='</div></div>';

    $a().innerHTML='<div class="screen">'+
        '<div class="deskcard" style="margin-bottom:14px;">'+
          '<div style="font-size:2.4rem;">'+(isDraw?'🤝':(st.winner==='X'?'✕':'○'))+'</div>'+
          '<div style="font-size:1.5rem;font-weight:800;margin:6px 0;color:'+col+';">'+
            (isDraw?'It\'s a draw!':esc(winnerName)+' wins!')+'</div>'+
          '<p class="helptext" style="margin:4px 0 10px;">'+(isDraw?'No one claimed three boards.':'Congratulations!')+'</p>'+
          '<div style="display:flex;gap:8px;justify-content:center;font-family:var(--fmono);font-size:.85rem;font-weight:800;">'+
            '<span class="ttt-chip cx">✕ '+esc(p1)+' '+scores.X+'</span>'+
            (scores.D?'<span class="pill">Draws '+scores.D+'</span>':'')+
            '<span class="ttt-chip co">○ '+esc(p2)+' '+scores.O+'</span>'+
          '</div>'+
        '</div>'+
        '<div class="card card-tight">'+metaHtml+'</div>'+
        '<div class="brow" style="margin-top:12px;">'+
          '<button class="btn btn-ink" style="flex:1;" onclick="UTTT.rematch()">Play again</button>'+
          '<button class="btn btn-ghost" style="flex:1;" onclick="G.hub()">Hub</button>'+
        '</div>'+
      '</div>';
  }

  return{start,begin,rematch,place};
})();

/* ================================================================
   ██████ GAME 4: LIAR'S DICE ██████
   Roll privately, bid on totals across all dice, call bluffs.
   ================================================================ */
const LiarsDice=(()=>{
  const D=['⚀','⚁','⚂','⚃','⚄','⚅'];
  let cfg,st,_bidCount=1,_bidFace=1,_resPlayers=[],_rCount=0,_rMax=5;

  function defCfg(){return{count:clamp(S.get('ld_count',4),2,8),dice:clamp(S.get('ld_dice',5),3,5),namesText:getRoster()};}
  function lnk(){return leaveLink('G.confirmLeave');}

  function start(){cfg=defCfg();setupRender();}

  function setupRender(){
    $a().innerHTML=
      '<div class="screen">'+hdr('Liar\'s Dice','Setup')+
      '<div class="card"><div class="slabel">Players</div>'+
        '<div class="stepper"><button onclick="LiarsDice.sc(-1)">−</button><div class="val">'+cfg.count+'</div><button onclick="LiarsDice.sc(1)">+</button></div>'+
        '<p class="helptext" style="text-align:center;">2–8 players</p></div>'+
      '<div class="card"><div class="slabel">Dice per player</div>'+
        '<div class="stepper"><button onclick="LiarsDice.sd(-1)">−</button><div class="val">'+cfg.dice+'</div><button onclick="LiarsDice.sd(1)">+</button></div></div>'+
      '<div class="card"><div class="slabel">Names (one per line, optional)</div>'+
        '<textarea placeholder="Leave blank for Player 1, 2…" oninput="LiarsDice.sn(this.value)">'+esc(cfg.namesText)+'</textarea></div>'+
      '<div class="card"><div class="slabel">How to play</div>'+
        '<p class="helptext">Everyone rolls secretly. Players take turns bidding how many dice of a certain face exist across ALL dice. Call <b>Liar!</b> if you think the bid is impossible. Reveal counts — wrong bidder or caller loses a die. Last player with dice wins!</p></div>'+
      '<button class="btn btn-ink btn-block" onclick="LiarsDice.deal()">Roll &amp; start →</button>'+
      '</div>';
  }
  function sc(d){cfg.count=clamp(cfg.count+d,2,8);S.set('ld_count',cfg.count);setupRender();}
  function sd(d){cfg.dice=clamp(cfg.dice+d,3,5);S.set('ld_dice',cfg.dice);setupRender();}
  function sn(v){cfg.namesText=v;setRoster(v);}

  function roll(n){return Array.from({length:n},()=>1+Math.floor(Math.random()*6));}

  function deal(){
    const names=parseNames(cfg.namesText,cfg.count);
    st={players:names.map((n,i)=>({id:i,name:n,dice:roll(cfg.dice),alive:true})),maxDice:cfg.dice,currentBid:null,ti:0,lastBidder:null,round:1,_resIdx:0,_resCounts:[]};
    rollPhase();
  }

  function rollPhase(){
    passSequence(
      st.players.filter(p=>p.alive),
      p=>p.name,
      p=>'<div class="slabel" style="text-align:center;">'+esc(p.name)+' — your '+p.dice.length+' dice</div>'+
         '<div class="dice-grid">'+p.dice.map(d=>'<div class="die">'+D[d-1]+'</div>').join('')+'</div>'+
         '<p class="helptext">Remember your dice — hide this before passing.</p>',
      biddingPhase
    );
  }

  function cur(){const a=st.players.filter(p=>p.alive);return a[st.ti%a.length];}
  function biddingPhase(){renderBidding();}

  function renderBidding(){
    const bid=st.currentBid;
    const bidStr=bid?'<span style="font-size:2.2rem;font-weight:900;">'+bid.count+' × '+D[bid.face-1]+'</span>':'<span style="color:var(--ink-faint);font-style:italic;">No bid yet</span>';
    const alive=st.players.filter(p=>p.alive);
    $a().innerHTML=
      '<div class="screen">'+hdr('Liar\'s Dice','Round '+st.round,null,'G.confirmLeave')+
      '<div class="card" style="text-align:center;">'+
        '<div class="slabel">Current bid</div>'+
        '<div style="margin:10px 0 4px;">'+bidStr+'</div>'+'<div class="helptext"><b>'+esc(cur().name)+'</b>\'s turn</div>'+
      '</div>'+
      '<div class="card"><div class="slabel">Alive ('+alive.length+' players)</div>'+
        '<div class="llist">'+alive.map(p=>'<div class="lrow" style="cursor:default;"><div class="avatar">'+esc((p.name[0]||'?').toUpperCase())+'</div><div class="rname">'+esc(p.name)+'</div><span class="pill">'+p.dice.length+' 🎲</span></div>').join('')+'</div>'+
      '</div>'+
      '<div class="brow">'+
        '<button class="btn btn-ink" style="flex:2;" onclick="LiarsDice.openBidPick()">Raise bid</button>'+
        (bid?'<button class="btn btn-bad" style="flex:1;" onclick="LiarsDice.callLiar()">🚨 Liar!</button>':'')+
      '</div>'+
      lnk()+'</div>';
  }

  function openBidPick(){
    const bid=st.currentBid;
    _bidCount=bid?bid.count+1:1;
    _bidFace=bid?bid.face:1;
    renderBidPick();
  }
  function renderBidPick(){
    const totalDice=st.players.filter(p=>p.alive).reduce((s,p)=>s+p.dice.length,0);
    $a().innerHTML=
      '<div class="screen">'+hdr('Make your bid',null,null,'G.confirmLeave')+
      '<div class="card">'+
        '<div class="slabel">How many?</div>'+
        '<div class="stepper" style="margin:8px 0 16px;"><button onclick="LiarsDice.bc(-1)">−</button><div class="val">'+_bidCount+'</div><button onclick="LiarsDice.bc(1)">+</button></div>'+
        '<div class="slabel">Showing face</div>'+
        '<div class="bid-faces">'+[1,2,3,4,5,6].map(f=>'<button class="face-btn'+(f===_bidFace?' sel':'')+'" onclick="LiarsDice.bf('+f+')">'+D[f-1]+'</button>').join('')+'</div>'+
        '<div class="slabel" style="text-align:center;">Your bid: '+_bidCount+' × '+D[_bidFace-1]+' ('+totalDice+' dice total)</div>'+
        '<div id="bidErr" style="color:var(--bad);font-size:.82rem;font-weight:700;text-align:center;min-height:18px;margin:4px 0;"></div>'+
      '</div>'+
      '<div class="brow">'+
        '<button class="btn btn-ghost" style="flex:1;" onclick="LiarsDice.renderBidding()">Cancel</button>'+
        '<button class="btn btn-ink" style="flex:1;" onclick="LiarsDice.confirmBid()">Bid it</button>'+
      '</div>'+
      '</div>';
  }
  function bc(d){_bidCount=Math.max(1,_bidCount+d);renderBidPick();}
  function bf(f){_bidFace=f;renderBidPick();}
  function confirmBid(){
    const bid=st.currentBid;
    const valid=!bid||_bidCount>bid.count||(_bidCount===bid.count&&_bidFace>bid.face);
    if(!valid){
      const el=document.getElementById('bidErr');
      if(el)el.textContent='Must be higher than current bid!';
      return;
    }
    st.currentBid={count:_bidCount,face:_bidFace};st.lastBidder=cur().id;st.ti++;
    SFX.tap();renderBidding();
  }

  function callLiar(){
    if(!st.currentBid)return;
    const bid=st.currentBid;
    $a().innerHTML=
      '<div class="screen"><div class="deskcard">'+
        '<div style="font-size:2rem;">🚨</div>'+
        '<div style="font-size:1.3rem;font-weight:800;margin:8px 0;">Calling Liar!</div>'+
        '<div style="font-size:1.8rem;font-weight:900;margin:6px 0;">'+bid.count+' × '+D[bid.face-1]+'</div>'+
        '<p class="helptext">Each player will secretly tap how many '+D[bid.face-1]+' they have.</p>'+
        '<div class="brow" style="margin-top:16px;">'+
          '<button class="btn btn-ghost" style="flex:1;" onclick="LiarsDice.renderBidding()">Never mind</button>'+
          '<button class="btn btn-bad" style="flex:1;" onclick="LiarsDice.startRes()">Call it!</button>'+
        '</div>'+
      '</div></div>';
  }
  function startRes(){
    const bid=st.currentBid,alive=st.players.filter(p=>p.alive);
    const total=alive.reduce((t,p)=>t+p.dice.filter(d=>d===bid.face).length,0),ok=total>=bid.count;
    const caller=cur(),bidder=st.players.find(p=>p.id===st.lastBidder)||alive[0],loser=ok?caller:bidder;
    ok?SFX.success():SFX.fail();
    $a().innerHTML=
      '<div class="screen"><div class="deskcard" style="margin-bottom:14px;">'+
        '<div style="font-weight:800;">Bid: '+bid.count+' × '+D[bid.face-1]+'</div>'+
        '<div style="font-size:2.8rem;font-weight:900;margin:6px 0;color:'+(ok?'var(--ok-deep)':'var(--bad)')+';">'+total+' '+D[bid.face-1]+'</div>'+
        '<div style="font-weight:800;">'+(ok?'✅ Bid was true':'❌ Bid was a bluff')+' — <b>'+esc(loser.name)+'</b> loses a die</div></div>'+
      '<div class="card"><div class="slabel">Everyone\'s dice</div><div class="llist">'+
        alive.map(p=>'<div class="lrow" style="cursor:default;"><div class="rname">'+esc(p.name)+'</div><span style="font-size:1.5rem;letter-spacing:2px;">'+p.dice.map(d=>d===bid.face?'<b style="background:var(--hl);border-radius:5px;">'+D[d-1]+'</b>':D[d-1]).join('')+'</span></div>').join('')+
      '</div></div>'+
      '<button class="btn btn-ink btn-block" onclick="LiarsDice.loseOne('+loser.id+')">Next round →</button></div>';
  }
  function loseOne(id){
    const p=st.players.find(x=>x.id===id);if(!p||!p.alive)return;
    p.dice.pop();if(p.dice.length===0)p.alive=false;
    const alive=st.players.filter(x=>x.alive);
    if(alive.length<=1){endScreen(alive[0]||null);return;}
    // Re-roll for next round
    alive.forEach(x=>{x.dice=roll(x.dice.length);});
    st.currentBid=null;st.lastBidder=null;st.ti=Math.max(0,alive.findIndex(x=>x.id===id));st.round++;
    rollPhase();
  }
  function endScreen(winner){
    SFX.win();if(winner)burst();
    $a().innerHTML=
      '<div class="screen"><div class="deskcard" style="margin-bottom:14px;">'+
        '<div style="font-size:2.5rem;">'+(winner?'🎲':'🤝')+'</div>'+
        '<div style="font-size:1.5rem;font-weight:800;margin:6px 0;color:var(--ok-deep);">'+(winner?esc(winner.name)+' wins!':'Draw!')+'</div>'+
        '<p class="helptext">Last one with dice standing!</p>'+
      '</div>'+
      '<div class="brow">'+
        '<button class="btn btn-ink" style="flex:1;" onclick="LiarsDice.deal()">Play again</button>'+
        '<button class="btn btn-ghost" style="flex:1;" onclick="LiarsDice.start()">New setup</button>'+
      '</div>'+
      lnk()+'</div>';
  }
  function replay(){deal();}

  return{start,sc,sd,sn,deal,renderBidding,openBidPick,bc,bf,confirmBid,callLiar,startRes,loseOne,replay};
})();

/* ================================================================
   ██████ GAME 5: WORD CHAIN BLITZ ██████
   Each word must start with the last letter of the previous.
   Beat the timer or lose a life. Last standing wins.
   ================================================================ */
const WordChain=(()=>{
  let cfg,st,_timerOn=false,_timerTick=null;

  function defCfg(){return{
    count:clamp(S.get('wc_count',4),2,10),
    lives:clamp(S.get('wc_lives',3),1,5),
    timer:clamp(S.get('wc_timer',20),10,30),
    namesText:getRoster()
  };}

  function start(){cfg=defCfg();setupRender();}

  function setupRender(){
    $a().innerHTML=
      '<div class="screen">'+hdr('Word Chain Blitz','Setup','WordChain.rules')+
      '<div class="card"><div class="slabel">Players</div><div class="stepper"><button onclick="WordChain.sc(-1)">−</button><div class="val">'+cfg.count+'</div><button onclick="WordChain.sc(1)">+</button></div></div>'+
      '<div class="card"><div class="slabel">Lives per player</div><div class="stepper"><button onclick="WordChain.sl(-1)">−</button><div class="val">'+cfg.lives+'</div><button onclick="WordChain.sl(1)">+</button></div></div>'+
      '<div class="card"><div class="slabel">Seconds per turn</div><div class="stepper"><button onclick="WordChain.stm(-1)">−</button><div class="val">'+cfg.timer+'</div><button onclick="WordChain.stm(1)">+</button></div></div>'+
      '<div class="card"><div class="slabel">Names (one per line, optional)</div><textarea placeholder="Leave blank for Player 1, 2…" oninput="WordChain.sn(this.value)">'+esc(cfg.namesText)+'</textarea></div>'+
      '<button class="btn btn-ink btn-block" onclick="WordChain.deal()">Start game →</button>'+
      '</div>';
  }
  function rules(){modal('Word Chain Blitz — Rules',
    '<p>Take turns saying words. Each word must <b>start with the last letter</b> of the previous word.</p>'+
    '<ul><li>No repeating words</li><li>Must start with the highlighted letter</li><li>Beat the timer or lose a life</li><li>Lose all lives = eliminated</li></ul><p>Last player standing wins!</p>'
  );}
  function sc(d){cfg.count=clamp(cfg.count+d,2,10);S.set('wc_count',cfg.count);setupRender();}
  function sl(d){cfg.lives=clamp(cfg.lives+d,1,5);S.set('wc_lives',cfg.lives);setupRender();}
  function stm(d){cfg.timer=clamp(cfg.timer+d,10,30);S.set('wc_timer',cfg.timer);setupRender();}
  function sn(v){cfg.namesText=v;setRoster(v);}

  function deal(){
    const names=parseNames(cfg.namesText,cfg.count);
    st={players:names.map((n,i)=>({id:i,name:n,lives:cfg.lives,alive:true})),lastLetter:null,wordLog:[],usedWords:new Set(),turn:0,timeLeft:cfg.timer};
    render();startTimer();
  }

  function stopTimer(){_timerOn=false;clearTimeout(_timerTick);}
  function startTimer(){stopTimer();_timerOn=true;tickWC();}
  function tickWC(){
    if(!_timerOn)return;
    st.timeLeft=Math.max(0,st.timeLeft-1);
    const el=document.getElementById('wcTimer');
    if(!el){_timerOn=false;return;}
    el.textContent=fmtTime(st.timeLeft);
    el.classList.toggle('urgent',st.timeLeft<=10&&st.timeLeft>0);
    if(st.timeLeft<=0){
      _timerOn=false;SFX.bad();
      const alive=st.players.filter(p=>p.alive);
      const cur=alive[st.turn%alive.length];
      if(cur)penalize(cur,'Time\'s up!');
      return;
    }
    _timerTick=setTimeout(tickWC,1000);
  }

  function render(){
    const alive=st.players.filter(p=>p.alive);
    const cur=alive[st.turn%alive.length];
    if(!cur){cont();return;}
    const req=st.lastLetter;
    $a().innerHTML=
      '<div class="screen">'+hdr('Word Chain',null,'WordChain.rules','G.confirmLeave')+
      '<div class="card" style="text-align:center;padding-bottom:10px;">'+
        (st.wordLog.length?'<div class="helptext" style="margin-bottom:4px;">Last: <b>'+esc(st.wordLog[st.wordLog.length-1])+'</b></div>':'')+
        '<div class="slabel" style="margin-bottom:4px;">Start with</div>'+
        '<div class="wc-letter">'+(req?req.toUpperCase():'🔤')+'</div>'+
        '<div style="font-weight:800;font-size:1rem;margin:6px 0 10px;color:var(--ink-dim);">'+esc(cur.name)+'\'s turn</div>'+
        '<input id="wcInput" placeholder="type your word…" autocomplete="off" autocorrect="off" spellcheck="false" style="font-size:1.1rem;margin-bottom:10px;" onkeyup="if(event.key===\'Enter\')WordChain.submit()"/>'+
        '<div class="brow">'+
          '<button class="btn btn-ghost btn-sm" onclick="WordChain.skipTurn()">💀 Skip</button>'+
          '<button class="btn btn-ink" style="flex:1;" onclick="WordChain.submit()">Submit →</button>'+
        '</div>'+
        '<div class="timer-disp" id="wcTimer" style="margin-top:10px;font-size:2rem;">'+fmtTime(st.timeLeft)+'</div>'+
      '</div>'+
      (st.wordLog.length?
        '<div class="card"><div class="slabel">Chain ('+st.wordLog.length+' words)</div>'+
          '<div class="wc-chain">'+st.wordLog.slice(-16).reverse().map((w,i)=>'<span class="wc-chip'+(i===0?' fresh':'')+'">'+esc(w)+'</span>').join('')+'</div>'+
        '</div>':'')+
      '<div class="card"><div class="slabel">Players</div><div class="llist">'+
        st.players.map(p=>'<div class="lrow '+(p.alive?'':'dead')+'" style="cursor:default;"><div class="avatar" style="background:'+(p.alive?'var(--ink)':'var(--ink-faint)')+';">'+esc((p.name[0]||'?').toUpperCase())+'</div><div class="rname">'+esc(p.name)+'</div><span class="pill">'+(p.alive?'❤️'.repeat(p.lives)||'💔':'💀 out')+'</span></div>').join('')+
      '</div></div>'+
      leaveLink('G.confirmLeave')+'</div>';
    setTimeout(()=>{const i=document.getElementById('wcInput');if(i)i.focus();},60);
  }

  function submit(){
    stopTimer();
    const input=document.getElementById('wcInput');if(!input)return;
    const word=input.value.trim().toLowerCase().replace(/[^a-z]/g,'');
    input.value='';
    if(!word){startTimer();return;}
    const alive=st.players.filter(p=>p.alive);
    const cur=alive[st.turn%alive.length];
    const req=st.lastLetter;
    if(req&&word[0]!==req){penalize(cur,'Must start with "'+req.toUpperCase()+'"');return;}
    if(st.usedWords.has(word)){penalize(cur,'"'+word+'" already used!');return;}
    SFX.place();
    st.usedWords.add(word);st.wordLog.push(word);
    st.lastLetter=word[word.length-1];
    st.turn++;st.timeLeft=cfg.timer;
    render();startTimer();
  }

  function skipTurn(){
    stopTimer();
    const alive=st.players.filter(p=>p.alive);
    const cur=alive[st.turn%alive.length];
    if(cur)penalize(cur,'Skipped!');
  }

  function penalize(player,reason){
    player.lives--;SFX.fail();
    if(player.lives<=0)player.alive=false;
    st.turn++;
    $a().innerHTML=
      '<div class="screen"><div class="deskcard">'+
        '<div style="font-size:2.2rem;">💀</div>'+
        '<div style="font-size:1.1rem;font-weight:800;margin:8px 0;">'+esc(player.name)+': '+esc(reason)+'</div>'+
        '<p class="helptext">'+(player.lives<=0?esc(player.name)+' is <b>eliminated!</b>':'Lost a life — '+player.lives+' remaining.')+'</p>'+
        '<button class="btn btn-ink btn-block" style="margin-top:14px;" onclick="WordChain.cont()">Continue →</button>'+
      '</div></div>';
  }

  function cont(){
    const alive=st.players.filter(p=>p.alive);
    if(alive.length<=1){endScreen(alive[0]||null);return;}
    st.timeLeft=cfg.timer;render();startTimer();
  }

  function endScreen(winner){
    stopTimer();SFX.win();if(winner)burst();
    $a().innerHTML=
      '<div class="screen"><div class="deskcard" style="margin-bottom:14px;">'+
        '<div style="font-size:2.4rem;">'+(winner?'🏆':'🤝')+'</div>'+
        '<div style="font-size:1.5rem;font-weight:800;margin:6px 0;color:var(--ok-deep);">'+(winner?esc(winner.name)+' wins!':'It\'s a draw!')+'</div>'+
        '<p class="helptext">'+st.wordLog.length+' word'+(st.wordLog.length!==1?'s':'')+' in the chain.</p>'+
      '</div>'+
      (st.wordLog.length?'<div class="card"><div class="slabel">Full chain</div><div class="wc-chain">'+st.wordLog.map(w=>'<span class="wc-chip">'+esc(w)+'</span>').join('')+'</div></div>':'')+
      '<div class="brow"><button class="btn btn-ink" style="flex:1;" onclick="WordChain.deal()">Play again</button><button class="btn btn-ghost" style="flex:1;" onclick="WordChain.start()">New setup</button></div>'+
      '</div>';
  }

  return{stop:stopTimer,start,rules,sc,sl,stm,sn,deal,submit,skipTurn,cont};
})();

/* ================================================================
   ██████ GAME 6: 20 QUESTIONS ██████
   One thinker, 20 yes/no/maybe questions, one hidden answer.
   ================================================================ */
const TwentyQ=(()=>{
  let _count=4,_names=[],_cat='',st;

  function start(){_count=clamp(S.get('tq_count',4),3,12);setupRender();}

  function setupRender(){
    $a().innerHTML=
      '<div class="screen">'+hdr('20 Questions','Setup')+
      '<div class="card"><div class="slabel">Number of players</div>'+
        '<div class="stepper"><button onclick="TwentyQ.sc(-1)">−</button><div class="val">'+_count+'</div><button onclick="TwentyQ.sc(1)">+</button></div></div>'+
      '<div class="card"><div class="slabel">Names (one per line, optional)</div>'+
        '<textarea placeholder="Leave blank for Player 1, 2…" oninput="TwentyQ.sn(this.value)">'+esc(getRoster())+'</textarea></div>'+
      '<div class="card"><div class="slabel">How to play</div>'+
        '<p class="helptext">One player secretly thinks of something — an animal, person, place, thing, anything. Everyone else takes turns asking yes/no/maybe questions. 20 questions max to guess it!</p></div>'+
      '<button class="btn btn-ink btn-block" onclick="TwentyQ.chooseThinker()">Choose thinker →</button>'+
      '</div>';
  }
  function sc(d){_count=clamp(_count+d,3,12);S.set('tq_count',_count);setupRender();}
  function sn(v){setRoster(v);}

  function chooseThinker(){
    _names=parseNames(getRoster(),_count);
    $a().innerHTML=
      '<div class="screen">'+hdr('20 Questions','Who\'s the Thinker?',null,'G.confirmLeave')+
      '<div class="card"><div class="slabel">Tap to pick</div>'+
        '<div class="llist">'+_names.map((n,i)=>'<div class="lrow" onclick="TwentyQ.setThinker('+i+')"><div class="avatar">'+esc((n[0]||'?').toUpperCase())+'</div><div class="rname">'+esc(n)+'</div></div>').join('')+'</div>'+
      '</div>'+
      '<button class="btn btn-ghost btn-block" style="margin-top:4px;" onclick="TwentyQ.randThinker()">🎲 Pick randomly</button>'+
      leaveLink('G.confirmLeave')+'</div>';
  }
  function randThinker(){setThinker(Math.floor(Math.random()*_names.length));}
  function setThinker(idx){
    st={thinker:{id:idx,name:_names[idx]},answer:'',category:'',questionsLeft:20,log:[]};
    thinkerPass();
  }
  function thinkerPass(){
    $a().innerHTML=
      '<div class="screen"><div class="pass-screen">'+
        '<div class="slabel">Pass to</div>'+
        '<div class="pass-name">🤔 '+esc(st.thinker.name)+'</div>'+
        '<p class="helptext">Cover screen while passing.</p>'+
        '<button class="btn btn-ink btn-block" style="margin-top:16px;" onclick="TwentyQ.thinkerReveal()">I\'m '+esc(st.thinker.name)+' — show setup</button>'+
      '</div></div>';
  }
  function thinkerReveal(){
    SFX.reveal();_cat='';
    $a().innerHTML=
      '<div class="screen"><div class="reveal-card" style="text-align:left;">'+
        '<div class="slabel" style="text-align:center;">'+esc(st.thinker.name)+', what are you thinking of?</div>'+
        '<input id="tqAns" placeholder="e.g. a banana, Elon Musk, Mount Everest…" autocomplete="off" style="margin:14px 0;font-size:1rem;"/>'+
        '<div class="slabel">Category (optional)</div>'+
        '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:8px 0 16px;">'+
          [['🐾','Animal'],['🌍','Place'],['👤','Person'],['🎬','Movie'],['🍕','Food'],['🔧','Object']].map(([ico,lbl])=>
            '<button id="cat_'+lbl+'" onclick="TwentyQ.setCat(\''+ico+' '+lbl+'\')" style="padding:10px 4px;border-radius:10px;border:2px solid transparent;background:var(--paper-deep);font-size:.78rem;font-weight:700;cursor:pointer;transition:all .1s;line-height:1.4;">'+ico+'<br>'+lbl+'</button>'
          ).join('')+
        '</div>'+
        '<button class="btn btn-ink btn-block" onclick="TwentyQ.lockIn()">Lock in — hide my answer 🔒</button>'+
      '</div></div>';
  }
  function setCat(cat){
    _cat=cat;
    document.querySelectorAll('[id^="cat_"]').forEach(b=>{b.style.borderColor='transparent';b.style.background='var(--paper-deep)';});
    const key=cat.split(' ').slice(1).join(' ');
    const btn=document.getElementById('cat_'+key);
    if(btn){btn.style.borderColor='var(--ink)';btn.style.background='var(--card)';}
  }
  function lockIn(){
    const input=document.getElementById('tqAns');
    if(!input||!input.value.trim()){input.style.borderColor='var(--bad)';setTimeout(()=>{if(input)input.style.borderColor='';},1600);return;}
    st.answer=input.value.trim();st.category=_cat;_cat='';
    $a().innerHTML=
      '<div class="screen"><div class="deskcard">'+
        '<div style="font-size:2.2rem;">🔒</div>'+
        '<div style="font-size:1.2rem;font-weight:800;margin:8px 0;">Answer locked!</div>'+
        (st.category?'<div class="pill" style="display:inline-flex;margin:6px auto;">'+esc(st.category)+'</div>':'')+
        '<p class="helptext" style="margin-top:10px;">Pass the phone back to the group. They\'ll ask questions — you tap Yes, No, or Maybe.</p>'+

const GA={spy:['var(--c-spy)','var(--c-spy2)'],wspy:['var(--c-spy)','var(--c-spy2)'],ttt:['var(--c-ttt)','var(--c-ttt2)'],dice:['var(--c-dice)','var(--c-dice2)'],wc:['var(--c-wc)','var(--c-wc2)'],tq:['var(--c-tq)','var(--c-tq2)'],mafia:['var(--c-mafia)','var(--c-mafia2)'],hot:['#D9480F','#7C2D12'],nhie:['#C2255C','#6B0F32'],emo:['#E8A100','#8A5D00'],wyr:['#7048E8','#3B1F9C'],cha:['#0B7285','#04404B'],tri:['#1971C2','#0B3C73'],cn:['#C23B4B','#243558'],tel:['#2F9E44','#16531F'],dg:['#E8590C','#7A2E06'],hz:['#343A40','#111']};

/* ---------- Spy Hunt ---------- */
function spyVoteStart(s){s.ph='vote';s.votes={};}
function spyGuessStart(s,why){const L=Spy.LOCS;let o=[];L.forEach((l,i)=>{if(l.n!==s.loc.n)o.push(i);});o=shuffle(o).slice(0,7);o.push(L.findIndex(l=>l.n===s.loc.n));s.choices=shuffle(o);s.why=why;s.ph='guess';}
function spyTally(s){const c={};Object.values(s.votes).forEach(v=>c[v]=(c[v]||0)+1);const m=Math.max(...Object.values(c)),top=Object.keys(c).filter(k=>c[k]===m).map(Number);
  if(top.length===1&&top[0]===s.spy)spyGuessStart(s,'caught');else{s.res='spy';s.why='wrong';s.ph='end';}}
/* ---------- Mafia ---------- */
const MN={M:'Mafia 🎭',D:'Doctor ⚕️',T:'Detective 🔍',C:'Civilian 👤'};
const mfAlive=s=>s.ps.filter(p=>!s.dead[p.id]);
function mfInit(ps){const n=ps.length,mc=Math.max(1,0|n/4);let r=[];for(let i=0;i<mc;i++)r.push('M');if(n>=5)r.push('D','T');while(r.length<n)r.push('C');r=shuffle(r);const role={};ps.forEach((p,i)=>role[p.id]=r[i]);
  return{ps,role,dead:{},ph:'night',n:1,act:{},inv:{},ready:{},votes:{},msg:'',win:null};}
function mfWin(s){const a=mfAlive(s),m=a.filter(p=>s.role[p.id]==='M').length;return m===0?'town':m>=a.length-m?'mafia':null;}
function mfDawn(s){const ms=mfAlive(s).filter(p=>s.role[p.id]==='M'),c={};ms.forEach(p=>{if(s.act[p.id]!=null)c[s.act[p.id]]=(c[s.act[p.id]]||0)+1;});
  let t=null,b=0;for(const k in c)if(c[k]>b){b=c[k];t=+k;}
  const saved=mfAlive(s).some(p=>s.role[p.id]==='D'&&s.act[p.id]===t);
  if(t!=null&&!saved){s.dead[t]=true;s.msg='💀 '+nname(s,t)+' was killed in the night — they were '+MN[s.role[t]]+'.';}else s.msg='😌 Nobody died last night.';
  s.win=mfWin(s);s.ph=s.win?'end':'day';s.ready={};}
function mfVoteEnd(s){const c={};let sk=0;Object.values(s.votes).forEach(v=>{if(v==='x')sk++;else c[v]=(c[v]||0)+1;});
  const m=Math.max(0,...Object.values(c)),top=Object.keys(c).filter(k=>c[k]===m);
  if(m>0&&top.length===1&&m>sk){const id=+top[0];s.dead[id]=true;s.msg='⚖️ '+nname(s,id)+' was voted out — they were '+MN[s.role[id]]+'.';}else s.msg='🤷 The town could not agree. Nobody was voted out.';
  s.win=mfWin(s);if(s.win)s.ph='end';else{s.ph='night';s.n++;s.act={};s.inv={};}}
/* ---------- Liar's Dice ---------- */
const ldAlive=s=>s.ps.filter(p=>p.dice.length);
const ldCur=s=>{const a=ldAlive(s);return a[s.t%a.length];};
const ldRoll=s=>s.ps.forEach(p=>{p.dice=p.dice.map(()=>1+(0|Math.random()*6));});
function ldInit(ps){const s={ps:ps.map(p=>({id:p.id,name:p.name,dice:[1,1,1,1,1]})),t:0,bid:null,bidder:null,ph:'bid',round:1,d:{c:1,f:1},err:'',rev:null};ldRoll(s);return s;}

const NG={
 spy:{n:'Spy Hunt',i:'🕵️',min:3,max:12,
  init(ps){const loc=Spy.LOCS[Spy.nextLoc()],spy=ps[0|Math.random()*ps.length].id,rs=shuffle(loc.r),roles={};ps.forEach((p,i)=>roles[p.id]=rs[i%rs.length]);
   return{ps,loc,spy,roles,ph:'talk',end:Date.now()+300000,votes:{},choices:[],res:null,why:''};},

   if(s.ph==='guess')return me?nbox('<div class="pass-name">Name the location</div><p class="helptext">Get it right and you still win.</p>')+'<div class="llist">'+s.choices.map(i=>'<div class="lrow" onclick="Net.act(\'g\',\''+i+'\')"><div class="rname">'+nE(Spy.LOCS[i].n)+'</div></div>').join('')+'</div>':nwait('The Spy is guessing the location…');
   const sw=s.res==='spy';
   return nbox('<div style="font-size:2.4rem">'+(sw?'🕵️':'🏆')+'</div><div class="pass-name" style="color:'+(sw?'var(--c-spy2)':'var(--ok-deep)')+'">'+(sw?'Spy wins!':'Town wins!')+'</div><p class="helptext">The location was <b>'+nE(s.loc.n)+'</b>. The Spy was <b>'+nname(s,s.spy)+'</b>.</p>')+nlist(s.ps,p=>'<span class="pill">'+(p.id===s.spy?'🕵️ Spy':nE(s.roles[p.id]))+'</span>')+nhostBtn(pid,'Play again','again');}},

 mafia:{n:'Mafia',i:'🎭',min:4,max:15,

   else if(s.ph==='day'&&a==='r'&&al){s.ready[pid]=1;if(Object.keys(s.ready).length>mfAlive(s).length/2){s.ph='vote';s.votes={};}}
   else if(s.ph==='vote'&&a==='v'&&al&&!(pid in s.votes)){if(g!=='x'&&(s.dead[+g]||+g===pid||!s.ps.some(p=>p.id===+g)))return;s.votes[pid]=g;if(mfAlive(s).every(p=>p.id in s.votes))mfVoteEnd(s);}

/* ---------- Word Chain / Ultimate TTT / Emoji Story (lobby versions) ---------- */
const wcCur=s=>{const a=s.ps.filter(p=>p.lives>0);return a[s.t%a.length];};
function wcPen(s,p,why){p.lives--;s.note=nE(p.name)+': '+why+(p.lives<=0?' — eliminated!':' — '+p.lives+' ❤ left');s.t++;if(s.ps.filter(q=>q.lives>0).length<=1){s.ph='end';return;}s.end=Date.now()+s.secs*1000;}
NG.wc={n:'Word Chain Blitz',i:'🔤',min:2,max:10,
 init(ps){return{ps:ps.map(p=>({id:p.id,name:p.name,lives:3})),t:0,last:null,log:[],used:{},ph:'play',secs:20,end:Date.now()+20000,note:''};},
 tick(s){if(s.ph==='play'&&Date.now()>s.end){wcPen(s,wcCur(s),"Time's up!");return true;}return false;},
 act(s,pid,a,g){
  if(s.ph==='play'&&wcCur(s).id===pid){const c=wcCur(s);
   if(a==='skip')wcPen(s,c,'Skipped!');
   else if(a==='w'){const w=String(g).trim().toLowerCase().replace(/[^a-z]/g,'');if(!w)return;
    if(s.last&&w[0]!==s.last)wcPen(s,c,'Must start with '+s.last.toUpperCase());
    else if(s.used[w])wcPen(s,c,w+' was already used');
    else{s.used[w]=1;s.log.push(w);s.last=w[w.length-1];s.t++;s.note='';s.end=Date.now()+s.secs*1000;}}}
  else if(s.ph==='end'&&a==='again'&&pid===0)Object.assign(s,NG.wc.init(s.ps));},
 view(s,pid){
  if(s.ph==='end'){const w=s.ps.find(p=>p.lives>0);return nbox('<div style="font-size:2.4rem">'+(w?'🏆':'🤝')+'</div><div class="pass-name">'+(w?nE(w.name)+' wins!':'Draw!')+'</div><p class="helptext">'+s.log.length+' words in the chain.</p>')+(s.log.length?'<div class="card"><div class="wc-chain">'+s.log.map(w=>'<span class="wc-chip">'+nE(w)+'</span>').join('')+'</div></div>':'')+nhostBtn(pid,'Play again','again');}
  const c=wcCur(s),mine=c.id===pid;
  return '<div class="card" style="text-align:center">'+(s.note?'<div class="helptext" style="color:var(--bad);font-weight:700">'+s.note+'</div>':'')+(s.log.length?'<div class="helptext">Last: <b>'+nE(s.log[s.log.length-1])+'</b></div>':'')+'<div class="slabel">Start with</div><div class="wc-letter">'+(s.last?s.last.toUpperCase():'🔤')+'</div><div style="font-weight:800;margin:6px 0">'+(mine?'Your turn!':nE(c.name)+'\'s turn')+'</div>'+
   (mine?'<input id="wcn" placeholder="type your word…" autocomplete="off" autocorrect="off" spellcheck="false" style="font-size:1.1rem;margin-bottom:10px" onkeyup="if(event.key===\'Enter\')Net.actIn(\'w\',\'wcn\')"/><div class="brow"><button class="btn btn-ghost btn-sm" onclick="Net.act(\'skip\',\'\')">💀 Skip</button><button class="btn btn-ink" style="flex:1" onclick="Net.actIn(\'w\',\'wcn\')">Submit →</button></div>':'')+
   '<div class="timer-disp" data-left="'+nsecs(s.end-Date.now())+'" style="margin-top:8px;font-size:2rem"></div></div>'+
   (s.log.length?'<div class="card"><div class="slabel">Chain ('+s.log.length+')</div><div class="wc-chain">'+s.log.slice(-16).reverse().map((w,i)=>'<span class="wc-chip'+(i===0?' fresh':'')+'">'+nE(w)+'</span>').join('')+'</div></div>':'')+
   nlist(s.ps,p=>'<span class="pill">'+(p.lives>0?'❤'.repeat(p.lives):'💀')+'</span>');}};

const UW=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const uwMini=c=>{for(const[a,b,d]of UW)if(c[a]&&c[a]===c[b]&&c[a]===c[d])return c[a];return c.every(x=>x)?'D':null;};
const uwMeta=m=>{for(const[a,b,d]of UW)if(m[a]&&m[a]!=='D'&&m[a]===m[b]&&m[a]===m[d])return m[a];return m.every(x=>x)?'D':null;};
const UPOS=['top-left','top-center','top-right','mid-left','center','mid-right','bot-left','bot-center','bot-right'];
NG.ttt={n:'Ultimate Tic-Tac-Toe',i:'⭕',min:2,max:12,
 init(ps,prev){const s={ps,x:ps[0].id,o:ps[1].id,meta:Array(9).fill(null),mini:Array.from({length:9},()=>Array(9).fill(null)),active:null,turn:'X',win:null,last:[-1,-1],ph:'play'};if(prev){s.x=prev.o;s.o=prev.x;}return s;},
 act(s,pid,a,g){
  if(s.ph==='play'&&a==='p'&&pid===(s.turn==='X'?s.x:s.o)){
   const[m,c]=String(g).split('-').map(Number);
   if(!(m>=0&&m<9&&c>=0&&c<9)||s.meta[m]!==null||(s.active!==null&&s.active!==m)||s.mini[m][c]!==null)return;
   s.mini[m][c]=s.turn;s.last=[m,c];const mw=uwMini(s.mini[m]);if(mw)s.meta[m]=mw;
   const gw=uwMeta(s.meta);if(gw){s.win=gw;s.ph='end';return;}
   s.active=s.meta[c]!==null?null:c;s.turn=s.turn==='X'?'O':'X';}
  else if(s.ph==='end'&&a==='again'&&pid===0)Object.assign(s,NG.ttt.init(s.ps,{x:s.x,o:s.o}));},
 view(s,pid){
  const mine=s.ph==='play'&&pid===(s.turn==='X'?s.x:s.o),tn=nname(s,s.turn==='X'?s.x:s.o);
  let b='<div class="meta-wrap"><div class="meta-board">';
  for(let m=0;m<9;m++){const act=s.meta[m]===null&&(s.active===null||s.active===m)&&s.ph==='play';let cls='meta-cell',inner='';
   if(s.meta[m]==='X'){cls+=' won-X';inner='<div class="meta-cell-won-mark cx">X</div>';}
   else if(s.meta[m]==='O'){cls+=' won-O';inner='<div class="meta-cell-won-mark co">O</div>';}
   else if(s.meta[m]==='D'){cls+=' drawn-meta';inner='<div class="meta-cell-won-mark cd">draw</div>';}
   else{if(act)cls+=' active-zone';inner='<div class="mini-board">';
    for(let c=0;c<9;c++){const v=s.mini[m][c],ok=mine&&act&&v===null;inner+='<div class="mini-cell'+(v==='X'?' cx':v==='O'?' co':'')+(ok?'':' blocked')+(s.last[0]===m&&s.last[1]===c?' last':'')+'"'+(ok?' onclick="Net.act(\'p\',\''+m+'-'+c+'\')"':'')+'>'+(v||'')+'</div>';}
    inner+='</div>';}
   b+='<div class="'+cls+'">'+inner+'</div>';}
  b+='</div></div>';
  const lg='<div class="ttt-legend"><div class="ttt-chip cx">✕ '+nname(s,s.x)+'</div><div class="ttt-chip co">○ '+nname(s,s.o)+'</div></div>';
  const st=s.ph==='end'?'<b>'+(s.win==='D'?'Draw!':(s.win==='X'?nname(s,s.x):nname(s,s.o))+' wins! 🏆')+'</b>':mine?'<b>Your move</b> — '+(s.active===null?'any open board':'play in <b>'+UPOS[s.active]+'</b> ↓'):'<b>'+tn+'</b> is playing'+(s.active===null?'':' in '+UPOS[s.active]);
  return lg+'<div class="card card-tight"><div class="uttt-status">'+st+'</div>'+b+'</div>'+(s.ph==='end'?nhostBtn(pid,'Rematch (swap sides)','again'):(pid===s.x||pid===s.o?'':'<p class="helptext" style="text-align:center">You are spectating.</p>'));}};

    else if(st.ph==='guess')b='<div class="card" style="text-align:center"><div style="font-size:2.2rem">🎯</div><div class="pass-name">'+nm(st.imp)+' was caught!</div><p class="helptext">Hand over the phone. Guess the secret word to still win.</p></div><div class="llist">'+st.ch.map((w,k)=>'<div class="lrow" onclick="WordSpy.guess('+k+')"><div class="rname">'+esc(w)+'</div></div>').join('')+'</div>';

const PPG={
 wyr:{t:'Would You Rather Duel',h:'A dilemma appears. Everyone secretly decides, then each player taps their side. The minority must explain their choice.',
  next(s){s.card=WYR[Party.bag('wyr',WYR.length)].split('|');s.v={};s.ph='a';s.n++;},
  act(s,a,g){if(a==='v'&&s.ph==='a'){const[i,x]=g.split(':');s.v[i]=x;if(s.ps.every(p=>p.id in s.v))s.ph='r';}else if(a==='next')PPG.wyr.next(s);},
  view(s){const h='<div class="slabel">Would you rather…</div><div class="duel">🅰️ '+esc(s.card[0])+'</div><div class="slabel" style="text-align:center">or</div><div class="duel">🅱️ '+esc(s.card[1])+'</div>';
   if(s.ph==='a')return nbox(h)+'<div class="slabel">Tap each player\'s pick</div>'+s.ps.map(p=>'<div class="lrow" style="cursor:default"><div class="rname">'+esc(p.name)+'</div>'+['A','B'].map(x=>'<button class="chip'+(s.v[p.id]===x?' on':'')+'" onclick="PP.do(\'v\',\''+p.id+':'+x+'\')">'+x+'</button>').join('')+'</div>').join('');
   const A=s.ps.filter(p=>s.v[p.id]==='A'),B=s.ps.filter(p=>s.v[p.id]==='B'),m=A.length===B.length?null:A.length<B.length?A:B;
   return nbox(h+'<p class="helptext">🅰️ '+A.length+' · 🅱️ '+B.length+'</p>')+nbox(m?'<b>Minority explains:</b> '+m.map(p=>esc(p.name)).join(', '):'<b>Perfect split!</b> Everybody defend your side.')+'<button class="btn btn-ink btn-block" onclick="PP.do(\'next\')">Next dilemma →</button>';}},
 cha:{t:'Charades Deck',h:'The spotlight player secretly sees a word and mimes it — no sounds or words! Tap who guessed it within 60 seconds. Both score a point.',
  next(s,first){PP.stop();if(!first)s.act=(s.act+1)%s.ps.length;else s.act=0|Math.random()*s.ps.length;s.card=CHA[Party.bag('cha',CHA.length)].split('|');s.ph='h';s.left=60;s.res='';s.n++;},
  act(s,a,g){
   if(a==='show'&&s.ph==='h'){s.ph='a';PP.tm=setInterval(()=>{s.left--;const e=document.getElementById('ppt');if(e)e.textContent=fmtTime(Math.max(0,s.left));if(s.left<=0){PP.stop();s.ph='r';s.res="⏰ Time's up!";PP.draw();}},1000);}
   else if(a==='got'&&s.ph==='a'){PP.stop();s.ps[+g].pts++;s.ps[s.act].pts++;s.res='🎉 '+esc(s.ps[+g].name)+' guessed it! +1 each for '+esc(s.ps[+g].name)+' and '+esc(s.ps[s.act].name)+'.';s.ph='r';}
   else if(a==='skip'&&s.ph==='a'){PP.stop();s.res='⏭ Skipped.';s.ph='r';}
   else if(a==='next'&&s.ph==='r')PPG.cha.next(s);
   else if(a==='fin'){PP.stop();s.ph='e';}},
  view(s){const an=esc(s.ps[s.act].name);
   if(s.ph==='h')return '<div class="pass-wrap"><div class="slabel">Pass the phone to</div><div class="pass-name">'+an+'</div><button class="btn btn-ink btn-block" onclick="PP.do(\'show\')">I\'m '+an+' — show my word</button></div>'+ppRank(s);
   if(s.ph==='a')return nbox('<div class="slabel">'+esc(s.card[0])+' — mime it, no words!</div><div class="pass-name wsp-word">'+esc(s.card[1])+'</div><div id="ppt" class="timer-disp">'+fmtTime(Math.max(0,s.left))+'</div>')+'<div class="slabel">Who guessed it?</div><div class="llist">'+s.ps.filter((p,i)=>i!==s.act).map(p=>'<div class="lrow" onclick="PP.do(\'got\',\''+p.id+'\')"><div class="rname">'+esc(p.name)+'</div></div>').join('')+'</div><button class="btn btn-ghost btn-block" onclick="PP.do(\'skip\')">Skip</button>';
   if(s.ph==='r')return nbox('<div class="slabel">The word was</div><div class="pass-name">'+esc(s.card[1])+'</div><p class="helptext">'+s.res+'</p>')+ppRank(s)+'<button class="btn btn-ink btn-block" onclick="PP.do(\'next\')">Next player →</button><button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="PP.do(\'fin\')">Finish game</button>';
   return nbox('<div style="font-size:2.4rem">🏆</div><div class="pass-name">'+esc(s.ps.slice().sort((a,b)=>b.pts-a.pts)[0].name)+' leads!</div>')+ppRank(s)+'<div class="brow"><button class="btn btn-ink" onclick="PP.go()">Play again</button><button class="btn btn-ghost" onclick="G.hub()">Hub</button></div>';}},
 tri:{t:'Trivia Showdown',h:'One person reads each question aloud to the group (10 questions). Reveal the answer, then tap everyone who got it right. Most points wins.',
  next(s){s.q=triPick();s.ok={};s.ph='a';s.n++;},
  act(s,a,g){
   if(a==='rev')s.ph='r';else if(a==='tog')s.ok[g]=!s.ok[g];
   else if(a==='next'){s.ps.forEach(p=>{if(s.ok[p.id])p.pts++;});if(s.n>=10)s.ph='e';else PPG.tri.next(s);}},
  view(s){
   if(s.ph==='e'){const top=Math.max(...s.ps.map(p=>p.pts)),w=s.ps.filter(p=>p.pts===top);return nbox('<div style="font-size:2.4rem">🏆</div><div class="pass-name">'+w.map(p=>esc(p.name)).join(' & ')+' win'+(w.length>1?'':'s')+'!</div>')+ppRank(s)+'<div class="brow"><button class="btn btn-ink" onclick="PP.go()">Play again</button><button class="btn btn-ghost" onclick="G.hub()">Hub</button></div>';}
   const L='ABCD',opts='<div class="llist">'+s.q.o.map((o,i)=>'<div class="lrow" style="cursor:default'+(s.ph==='r'&&i===s.q.c?';background:var(--ok);color:#fff':'')+'"><div class="avatar">'+L[i]+'</div><div class="rname">'+esc(o)+'</div></div>').join('')+'</div>';
   if(s.ph==='a')return nbox('<div class="slabel">Question '+s.n+' of 10 — read it out loud</div><div class="pcard">'+esc(s.q.q)+'</div>')+opts+'<button class="btn btn-ink btn-block" onclick="PP.do(\'rev\')">Reveal answer</button>';
   return nbox('<div class="slabel">Answer</div><div class="pcard">'+L[s.q.c]+'. '+esc(s.q.o[s.q.c])+'</div><p class="helptext">Tap everyone who got it right</p>')+'<div class="llist">'+s.ps.map(p=>'<div class="lrow'+(s.ok[p.id]?' sel':'')+'" onclick="PP.do(\'tog\',\''+p.id+'\')"><div class="rname">'+esc(p.name)+'</div><span class="pill">⭐ '+p.pts+'</span></div>').join('')+'</div><button class="btn btn-ink btn-block" onclick="PP.do(\'next\')">'+(s.n>=10?'Finish →':'Next question →')+'</button>';}}
};
const PP={g:null,n:4,names:'',st:null,tm:null,
 stop(){clearInterval(this.tm);this.tm=null;DrawPad.stop();},
 start(g){this.stop();this.g=g;this.n=clamp(S.get('p_count',4),2,12);this.names=getRoster();this.setup();},
 setup(){const d=PPG[this.g];$a().innerHTML='<div class="screen">'+hdr(d.t,'Setup',null,'G.hub')+'<div class="card"><div class="slabel">Players</div><div class="stepper"><button onclick="PP.sc(-1)">−</button><div class="val">'+this.n+'</div><button onclick="PP.sc(1)">+</button></div></div><div class="card"><div class="slabel">Names (one per line, optional)</div><textarea oninput="PP.sn(this.value)" placeholder="Leave blank for Player 1, 2…">'+esc(this.names)+'</textarea></div><div class="card"><div class="slabel">How to play</div><p class="helptext">'+d.h+'</p></div><button class="btn btn-ink btn-block" onclick="PP.go()">Start →</button></div>';},
 sc(x){this.n=clamp(this.n+x,2,12);S.set('p_count',this.n);this.setup();},
 sn(v){this.names=v;setRoster(v);},
 go(){this.stop();const names=parseNames(this.names,this.n);this.st={ps:names.map((n,i)=>({id:i,name:n,pts:0})),n:0};PPG[this.g].next(this.st,true);SFX.reveal();this.draw();},
 do(a,g){PPG[this.g].act(this.st,a,g);this.draw();},
 draw(){const d=PPG[this.g],s=this.st;$a().innerHTML='<div class="screen">'+hdr(d.t,'Round '+s.n,null,'G.confirmLeave')+d.view(s)+'</div>';if(document.getElementById('dcv'))DrawPad.init(null);else DrawPad.stop();}};

NG.wyr={n:'Would You Rather Duel',i:'⚖️',min:2,max:12,
 init(ps){return{ps,ph:'v',votes:{},n:1,card:WYR[Party.bag('wyr',WYR.length)].split('|')};},
 act(s,pid,a,g){if(s.ph==='v'&&a==='v'&&(g==='A'||g==='B')&&!(pid in s.votes)){s.votes[pid]=g;if(Object.keys(s.votes).length>=s.ps.length)s.ph='r';}
  else if(s.ph==='r'&&a==='next'&&pid===0){s.card=WYR[Party.bag('wyr',WYR.length)].split('|');s.ph='v';s.votes={};s.n++;}},
 view(s,pid){const h='<div class="slabel">Would you rather… #'+s.n+'</div>';
  if(s.ph==='v')return nbox(h+'<p class="helptext">'+Object.keys(s.votes).length+'/'+s.ps.length+' voted</p>')+(pid in s.votes?nwait('Locked in…'):'<button class="btn btn-ink btn-block" style="white-space:normal;margin:6px 0" onclick="Net.act(\'v\',\'A\')">🅰️ '+nE(s.card[0])+'</button><div class="slabel" style="text-align:center">or</div><button class="btn btn-accent btn-block" style="white-space:normal" onclick="Net.act(\'v\',\'B\')">🅱️ '+nE(s.card[1])+'</button>');
  const A=s.ps.filter(p=>s.votes[p.id]==='A'),B=s.ps.filter(p=>s.votes[p.id]==='B'),m=A.length===B.length?null:A.length<B.length?A:B;
  return nbox(h+'<div class="duel">🅰️ '+nE(s.card[0])+' — <b>'+A.length+'</b></div><div class="duel">🅱️ '+nE(s.card[1])+' — <b>'+B.length+'</b></div>')+nlist(s.ps,p=>'<span class="pill">'+s.votes[p.id]+'</span>')+nbox(m?'<b>Minority explains:</b> '+m.map(p=>nE(p.name)).join(', '):'<b>Perfect split!</b>')+nhostBtn(pid,'Next →','next');}};

NG.cha=Object.assign({},NG.emo,{n:'Charades Deck',i:'🎭',min:3,max:12,
 init(ps){const s={ps:ps.map(p=>({id:p.id,name:p.name,pts:0})),actor:ps[0|Math.random()*ps.length].id,n:0,dk:'cha'};emoNext(s,true);return s;},
 act(s,pid,a,g){if(s.ph==='end'&&a==='again'&&pid===0){Object.assign(s,NG.cha.init(s.ps));return;}NG.emo.act(s,pid,a,g);},
 view(s,pid){if(s.ph!=='act')return NG.emo.view(s,pid);const sc=nlist(s.ps.slice().sort((a,b)=>b.pts-a.pts),p=>'<span class="pill">⭐ '+p.pts+'</span>'),tm='<div class="timer-disp" data-left="'+nsecs(s.end-Date.now())+'"></div>';
  if(pid===s.actor)return nbox('<div class="slabel">'+nE(s.card[0])+' — mime it, NO words!</div><div class="pass-name wsp-word">'+nE(s.card[1])+'</div>'+tm)+'<div class="slabel" style="margin-top:10px">Who guessed it?</div>'+npick(s.ps.filter(p=>p.id!==pid),'got',nbtn('Nobody — skip','out','','btn-ghost'));
  return nbox('<div class="slabel">'+nname(s,s.actor)+' is miming…</div><div class="pass-name">'+nE(s.card[0])+'</div><p class="helptext">Shout your guesses!</p>'+tm)+sc;}});
function triNext(s){s.n++;s.q=triPick();s.ans={};s.end=Date.now()+15000;s.ph='q';}
function triReveal(s){s.ps.forEach(p=>{const a=s.ans[p.id];if(a&&a.k===s.q.c)p.pts+=Math.round(500+500*Math.max(0,s.end-a.t)/15000);});s.ph='r';}
NG.tri={n:'Trivia Showdown',i:'🧠',min:2,max:12,
 init(ps){const s={ps:ps.map(p=>({id:p.id,name:p.name,pts:0})),n:0};triNext(s);return s;},
 tick(s){if(s.ph==='q'&&Date.now()>s.end){triReveal(s);return true;}return false;},
 act(s,pid,a,g){
  if(s.ph==='q'&&a==='a'&&!(pid in s.ans)&&s.q.o[+g]!=null){s.ans[pid]={k:+g,t:Date.now()};if(s.ps.every(p=>p.id in s.ans))triReveal(s);}
  else if(s.ph==='r'&&a==='next'&&pid===0){if(s.n>=10)s.ph='end';else triNext(s);}
  else if(s.ph==='end'&&a==='again'&&pid===0)Object.assign(s,NG.tri.init(s.ps));},
 kick(s,pid){if(!s.ps.some(p=>p.id===pid)||s.ph==='end')return;s.ps=s.ps.filter(p=>p.id!==pid);delete s.ans[pid];if(s.ps.length<2){s.ph='end';return;}if(s.ph==='q'&&s.ps.every(p=>p.id in s.ans))triReveal(s);},
 view(s,pid){const sc=nlist(s.ps.slice().sort((a,b)=>b.pts-a.pts),p=>'<span class="pill">⭐ '+p.pts+'</span>'),L='ABCD';
  if(s.ph==='end'){const top=Math.max(...s.ps.map(p=>p.pts)),w=s.ps.filter(p=>p.pts===top);return nbox('<div style="font-size:2.4rem">🏆</div><div class="pass-name">'+w.map(p=>nE(p.name)).join(' & ')+' win'+(w.length>1?'':'s')+'!</div>')+sc+nhostBtn(pid,'Play again','again');}
  const q=nbox('<div class="slabel">Question '+s.n+' of 10</div><div class="pcard">'+nE(s.q.q)+'</div>'+(s.ph==='q'?'<div class="timer-disp" data-left="'+nsecs(s.end-Date.now())+'"></div>':''));
  if(s.ph==='q')return q+(pid in s.ans?nwait('Locked in ('+Object.keys(s.ans).length+'/'+s.ps.length+')…'):'<div class="llist">'+s.q.o.map((o,i)=>'<div class="lrow" onclick="Net.act(\'a\',\''+i+'\')"><div class="avatar">'+L[i]+'</div><div class="rname">'+nE(o)+'</div></div>').join('')+'</div>');
  const mine=s.ans[pid],ok=mine&&mine.k===s.q.c;
  return q+nbox('<div style="font-size:2rem">'+(ok?'✅':'❌')+'</div><div class="pass-name" style="font-size:1.2rem">'+L[s.q.c]+'. '+nE(s.q.o[s.q.c])+'</div>')+sc+nhostBtn(pid,s.n>=10?'Final results →':'Next question →','next');}};

const cnOther=t=>t==='R'?'B':'R';
function cnMake(){const f=Math.random()<.5?'R':'B',o=cnOther(f),used=new Set(),w=[];while(w.length<25){const x=CNW[Party.bag('cn',CNW.length)];if(!used.has(x)){used.add(x);w.push(x);}}
 const ks=shuffle([...Array(9).fill(f),...Array(8).fill(o),...Array(7).fill('N'),'X']);
 return{b:w.map((x,i)=>({w:x,k:ks[i],r:false})),turn:f,left:{[f]:9,[o]:8},win:null,msg:''};}
function cnReveal(s,i){const c=s.b[i];if(!c||c.r||s.win)return;c.r=true;
 if(c.k==='X'){s.win=cnOther(s.turn);s.msg='💥 The assassin was hit!';return;}
 if(c.k==='R'||c.k==='B'){s.left[c.k]--;if(s.left[c.k]===0){s.win=c.k;s.msg='All agents found!';return;}}
 if(c.k!==s.turn)s.turn=cnOther(s.turn);}
const cnName=t=>t==='R'?'🔴 Red':'🔵 Blue';
function cnBoard(s,key,fn){return '<div class="cn-grid">'+s.b.map((c,i)=>'<div class="cn-card'+(c.r?' open cn-'+c.k:(key?' key-'+c.k:''))+'"'+(fn&&!c.r?' onclick="'+fn(i)+'"':'')+'>'+nE(c.w)+'</div>').join('')+'</div>';}
const cnScore=s=>'<div class="brow" style="margin-bottom:10px"><div class="pill">🔴 '+(s.left.R||0)+' left</div><div class="pill">🔵 '+(s.left.B||0)+' left</div></div>';

const CN={s:null,key:false,
 start(){this.s=cnMake();this.key=false;SFX.reveal();this.draw();},
 tap(i){const s=this.s;if(s.win)return;cnReveal(s,i);SFX.tap();if(s.win){SFX.win();burst();}this.draw();},
 end(){this.s.turn=cnOther(this.s.turn);SFX.click();this.draw();},
 tog(){this.key=!this.key;this.draw();},
 draw(){const s=this.s;$a().innerHTML='<div class="screen">'+hdr('Codenames Lite',s.win?'Game over':cnName(s.turn)+' to play',null,'G.confirmLeave')+cnScore(s)+

  cnBoard(s,this.key||!!s.win,i=>'CN.tap('+i+')')+

  (this.key&&!s.win?'<p class="helptext" style="text-align:center">Only spymasters should look! Hide the key before passing the phone.</p>':'')+'</div>';}};

NG.cn={n:'Codenames Lite',i:'🗝️',min:4,max:12,
 init(ps){const sh=shuffle(ps.map(p=>p.id)),t={R:[],B:[]};sh.forEach((id,i)=>t[i%2?'B':'R'].push(id));return Object.assign(cnMake(),{ps,t,sp:{R:t.R[0],B:t.B[0]},ph:'clue',clue:null,gl:0});},
 act(s,pid,a,g){const T=s.turn,op=s.t[T].includes(pid)&&pid!==s.sp[T];
  if(s.ph==='clue'&&a==='clue'&&pid===s.sp[T]){const m=String(g).trim().toLowerCase().match(/^([a-z'-]+)\s*(\d+)?/);if(!m)return;s.clue={w:m[1],n:+(m[2]||0)};s.gl=s.clue.n?s.clue.n+1:99;s.ph='guess';}
  else if(s.ph==='guess'&&op){
   if(a==='tap'){const c=s.b[+g];if(!c||c.r)return;cnReveal(s,+g);if(s.win){s.ph='end';return;}if(s.turn!==T||--s.gl<=0){if(s.turn===T)s.turn=cnOther(T);s.ph='clue';s.clue=null;}}
   else if(a==='end'){s.turn=cnOther(T);s.ph='clue';s.clue=null;}}
  else if(s.ph==='end'&&a==='again'&&pid===0)Object.assign(s,NG.cn.init(s.ps));},
 kick(s,pid){if(s.ph==='end'||!s.ps.some(p=>p.id===pid))return;const T=s.t.R.includes(pid)?'R':'B';s.t[T]=s.t[T].filter(x=>x!==pid);s.ps=s.ps.filter(p=>p.id!==pid);
  if(s.t[T].length<2){s.win=cnOther(T);s.msg='A whole team left.';s.ph='end';return;}
  if(s.sp[T]===pid){s.sp[T]=s.t[T][0];if(s.turn===T&&s.ph==='guess'){s.ph='clue';s.clue=null;}}},
 view(s,pid){const T=s.t.R.includes(pid)?'R':'B',sp=s.sp[T]===pid,mine=s.turn===T,
   me='<div class="pill" style="margin:0 auto 8px;display:flex;width:max-content">'+cnName(T)+(sp?' · 🗝️ Spymaster':' · Operative')+'</div>',canTap=s.ph==='guess'&&mine&&!sp;
  const board=cnBoard(s,sp||s.ph==='end',canTap?i=>"Net.act('tap','"+i+"')":null);
  if(s.ph==='end')return me+cnScore(s)+nbox('<div style="font-size:2.2rem">🏆</div><div class="pass-name">'+cnName(s.win)+' wins!</div><p class="helptext">'+s.msg+'</p>')+board+nhostBtn(pid,'Play again','again');
  let st;
  if(s.ph==='clue')st=mine&&sp?nbox('<div class="slabel">Your clue</div><input id="cnc" placeholder="one word + number, e.g. ocean 3" autocomplete="off"/>')+'<button class="btn btn-ink btn-block" style="margin:8px 0" onclick="Net.actIn(\'clue\',\'cnc\')">Give clue →</button>':nwait(cnName(s.turn)+' spymaster is thinking of a clue…');
  else st=nbox('<div class="slabel">'+cnName(s.turn)+' clue</div><div class="pass-name">'+nE(s.clue.w.toUpperCase())+' · '+s.clue.n+'</div>')+(canTap?nbtn('End turn','end','','btn-ghost'):'');
  return me+cnScore(s)+st+board;}};

PPG.tel={t:'Telephone Whispers',h:'Player 1 writes a silly phrase. Player 2 turns it into EMOJIS only. Player 3 turns the emojis back into words… and so on. At the end, see how the message mutated!',
 next(s){s.chain=[];s.i=0;s.ph='h';s.err='';s.idea='';s.n=1;},
 act(s,a,g){

 view(s){

  const nm=esc(s.ps[s.i].name);

  const emo=s.i%2===1,prev=s.chain[s.i-1];
  return nbox('<div class="slabel">'+nm+' — '+(s.i===0?'write a silly phrase':emo?'turn this into EMOJIS only':'what does this mean? Write it in words')+'</div>'+(prev?'<div class="pcard"'+(emo?'':' style="font-size:2.2rem"')+'>'+esc(prev.t)+'</div>':(s.idea?'<div class="pcard">'+esc(s.idea)+'</div>':'<button class="btn btn-ghost btn-sm" onclick="PP.do(\'idea\')">💡 Give me an idea</button>'))+
   '<input id="tw" placeholder="'+(emo?'🍕🚀🐱':'type here…')+'" autocomplete="off" style="margin:10px 0"/><div style="color:var(--bad);font-weight:700;font-size:.82rem;min-height:16px">'+esc(s.err)+'</div>')+'<button class="btn btn-ink btn-block" onclick="PP.do(\'sub\',document.getElementById(\'tw\').value)">Lock it in 🔒</button>';}};
const telChain=ch=>ch.map((c,i)=>'<div class="card" style="padding:12px 14px;margin-bottom:8px"><div class="slabel" style="margin-bottom:2px">'+(i+1)+'. '+nE(c.n)+(c.e?' · emojis':' · words')+'</div><div style="font-weight:800;font-size:'+(c.e?'1.7rem':'1.05rem')+'">'+nE(c.t)+'</div></div>').join('');
const trOwner=(s,i)=>{const n=s.ps.length;return s.ps[((i-s.r)%n+n)%n].id;};
function trFill(s){s.ps.forEach(p=>{if(s.gone[p.id]&&!(p.id in s.sub))s.sub[p.id]='(left)';});}
function trDone(s){const n=s.ps.length;if(!s.ps.every(p=>p.id in s.sub))return;
 s.ps.forEach((p,i)=>s.ch[trOwner(s,i)].push({n:p.name,t:s.sub[p.id],e:s.r%2===1}));
 s.r++;s.sub={};s.err={};if(s.r>=n){s.ph='end';return;}trFill(s);s.end=Date.now()+90000;trDone(s);}
NG.tel={n:'Telephone Whispers',i:'📞',min:3,max:10,
 init(ps){const ch={};ps.forEach(p=>ch[p.id]=[]);return{ps,ch,r:0,sub:{},gone:{},ph:'w',end:Date.now()+90000,err:{}};},
 tick(s){if(s.ph==='w'&&Date.now()>s.end){s.ps.forEach(p=>{if(!(p.id in s.sub))s.sub[p.id]='(no answer)';});trDone(s);return true;}return false;},
 act(s,pid,a,g){
  if(s.ph==='w'&&a==='sub'&&s.ps.some(p=>p.id===pid)&&!(pid in s.sub)){const t=String(g).trim().slice(0,80);if(!t)return;if(s.r%2===1&&/[A-Za-z]/.test(t)){s.err[pid]='Emojis only! No letters.';return;}s.sub[pid]=t;trDone(s);}
  else if(s.ph==='end'&&a==='again'&&pid===0)Object.assign(s,NG.tel.init(s.ps));},
 kick(s,pid){if(s.ph==='end')return;s.gone[pid]=1;if(s.ph==='w'&&!(pid in s.sub))s.sub[pid]='(left)';trDone(s);},
 view(s,pid){
  if(s.ph==='end')return nbox('<div class="pass-name">📞 The chains</div><p class="helptext">Everyone started their own message. See how each one mutated.</p>')+s.ps.map(p=>'<div class="slabel" style="margin-top:12px">'+nE(p.name)+'\'s chain</div>'+telChain(s.ch[p.id])).join('')+nhostBtn(pid,'Play again','again');
  const n=s.ps.length,i=s.ps.findIndex(p=>p.id===pid),r=s.r,hd='<div class="slabel">Round '+(r+1)+' of '+n+'</div>';
  if(pid in s.sub)return nbox(hd+'<p class="helptext">Locked in. Waiting for others ('+Object.keys(s.sub).length+'/'+n+')…</p><div class="timer-disp" data-left="'+nsecs(s.end-Date.now())+'"></div>');
  const emo=r%2===1,ch=s.ch[trOwner(s,i)],prev=ch[ch.length-1];
  return nbox(hd+'<div class="slabel">'+(r===0?'Write a silly phrase':emo?'Turn this into EMOJIS only':'What does this mean? Write it in words')+'</div>'+(prev?'<div class="pcard"'+(emo?'':' style="font-size:2.2rem"')+'>'+nE(prev.t)+'</div>':'')+
   '<input id="tw" placeholder="'+(emo?'🍕🚀🐱':'type here…')+'" autocomplete="off" style="margin:10px 0"/><div style="color:var(--bad);font-weight:700;font-size:.82rem;min-height:16px">'+nE(s.err[pid]||'')+'</div><div class="timer-disp" data-left="'+nsecs(s.end-Date.now())+'"></div>')+'<button class="btn btn-ink btn-block" onclick="Net.actIn(\'sub\',\'tw\')">Lock it in 🔒</button>';}};
