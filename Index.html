    if(!rm||rm.state==='connecting')return '<div class="card" style="text-align:center"><div class="slabel">Room code</div><p class="helptext">⏳ Creating your room…</p></div>';
    if(rm.state==='error')return '<div class="card" style="text-align:center"><div class="slabel">Room code</div><p class="helptext" style="color:var(--bad);font-weight:700">'+nE(rm.err)+'</p><div class="brow"><button class="btn btn-ink btn-sm" onclick="Net.retryRoom()">Try again</button><button class="btn btn-ghost btn-sm" onclick="Net.hostGo(\'local\')">No-internet mode</button></div></div>';
    return '<div class="card" style="text-align:center"><div class="slabel">Room code'+(rm.state==='reconnecting'?' · ⏳ reconnecting…':'')+'</div><div class="roomcode">'+rm.code+'</div><p class="helptext">Friends: open IDLE → <b>Join a lobby</b> → type this code.</p><div class="brow"><button class="btn btn-ink btn-sm" onclick="Net.shareRoom()">📤 Share code</button><button class="btn btn-ghost btn-sm" onclick="Net.copyRoom()">Copy</button></div></div>';}
  function render(){
    DrawPad.stop();
    if(role==='host'){
      pending.forEach((p,i)=>{const t=$e('ans'+i);if(t)p.ans=t.value;});
      if(gst)return;
      const ps=on(),g=NG[lg],ok=ps.length>=g.min&&ps.length<=g.max;
      $a().innerHTML='<div class="screen">'+hdr('Lobby','You are the lobby master',null,'Net.leaveAsk')+
        (mode==='room'?roomCard():'')+
        '<div class="card"><div class="slabel">In the lobby ('+ps.length+') · '+(mode==='room'?'🌐 Online':'📶 No-internet')+'</div>'+plist()+'</div>'+
        (mode==='local'?pending.map((p,i)=>'<div class="card"><div class="slabel">New phone '+(i+1)+'</div>'+
          (p.code?'<p class="helptext">1. Send this code to the friend (any chat app):</p><textarea id="code'+i+'" readonly style="font-family:var(--fmono);font-size:.62rem;height:64px">'+p.code+'</textarea><button class="btn btn-ghost btn-sm" style="margin:6px 0" onclick="Net.copy(\'code'+i+'\')">Copy code</button> <button class="btn btn-accent btn-sm" style="margin:6px 0" onclick="Net.share(\'code'+i+'\')">📤 Share</button>'+
            '<p class="helptext">2. Paste the reply code they send back:</p><textarea id="ans'+i+'" style="font-family:var(--fmono);font-size:.62rem;height:64px" placeholder="Reply code">'+nE(p.ans||'')+'</textarea>'+
            (p.err?'<p class="helptext" style="color:var(--bad);font-weight:700">'+nE(p.err)+'</p>':'')+
            (p.wait?'<p class="helptext">Connecting…</p>':'<button class="btn btn-ink btn-sm" style="margin-top:6px" onclick="Net.accept('+i+')">Connect</button>')
            :'<p class="helptext">Making a code…</p>')+
          ' <button class="btn btn-ghost btn-sm" style="margin-top:6px" onclick="Net.drop('+i+')">Cancel</button></div>').join('')+
        '<button class="btn btn-accent btn-block" onclick="Net.invite()">➕ Invite a phone</button>'+
        '<p class="helptext" style="margin:6px 2px 14px">📶 <b>No-internet mode</b> — everyone joins the same hotspot/Wi-Fi. Codes contain your network address — only send them to friends.</p>':'')+
        '<div class="card"><div class="slabel">Pick a game (you can change it any time)</div><div class="llist">'+chips()+'</div></div>'+(lg==='wspy'?'<div class="card"><div class="slabel">Word genre</div>'+wChips(wgenre,'Net.setGenre')+'</div>':'')+
        '<button class="btn btn-ink btn-block" '+(ok?'':'disabled')+' onclick="Net.start()">'+(ok?'Start '+nE(g.n)+' →':nE(g.n)+' needs '+g.min+'–'+g.max+' players')+'</button></div>';
    }else if(role==='client'){
      $a().innerHTML='<div class="screen">'+hdr('Lobby','Connected',null,'Net.leaveAsk')+'<div class="card"><div class="slabel">In the lobby ('+on().length+')</div>'+plist()+'</div>'+
        '<div class="card"><div class="slabel">Next game</div><div class="llist">'+chips()+'</div></div>'+nwait(run?'A game is running. You will join the next one.':'Waiting for the lobby master to start…')+'</div>';
    }
  }

  /* ---------- JOIN ---------- */
  function joinScreen(){if(!netOk())return;chooser('join');}
  function joinGo(m){mode=m==='local'?'local':'room';SFX.unlock();Awake.on();HELP.id='lobby';role='client';joinReply='';jr={code:prefill,msg:'',bad:false,reconn:false,tries:0};chatKill();startTicker();renderJoin();}
  function nameField(){return '<div class="card"><div class="slabel">Your name</div><input id="jn" value="'+nE(S.get('idle_name',''))+'" maxlength="18" placeholder="you" oninput="S.set(\'idle_name\',this.value)"/></div>';}
  function renderJoin(){
    if(mode==='room'){
      $a().innerHTML='<div class="screen">'+hdr('Join a lobby','Room code',null,'Net.leave')+
        '<div class="card"><div class="slabel">Room code</div><input id="rc" class="codeinput" maxlength="5" value="'+nE(jr?jr.code:'')+'" placeholder="K7QX2" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,\'\')" onkeyup="if(event.key===\'Enter\')Net.joinRoom()"/><p class="helptext" style="margin:8px 0 0">Ask the lobby master for their 5-letter code.</p></div>'+
        nameField()+
        '<button class="btn btn-ink btn-block" onclick="Net.joinRoom()">Join lobby →</button>'+
        '<p id="jmsg" class="helptext" style="text-align:center;margin-top:10px;'+(jr&&jr.bad?'color:var(--bad);font-weight:700':'')+'">'+nE(jr?jr.msg:'')+'</p></div>';
      return;}
    $a().innerHTML='<div class="screen">'+hdr('Join a lobby','No-internet mode',null,'Net.leave')+nameField()+
      (joinReply?
        '<div class="card"><p class="helptext">Send this reply code to the lobby master. You will connect automatically.</p><textarea id="reply" readonly style="font-family:var(--fmono);font-size:.62rem;height:80px">'+joinReply+'</textarea><button class="btn btn-ink btn-block" style="margin-top:8px" onclick="Net.copy(\'reply\')">Copy reply code</button><button class="btn btn-accent btn-block" style="margin-top:8px" onclick="Net.share(\'reply\')">📤 Share reply code</button></div>'
        :'<div class="card"><p class="helptext">Paste the code the lobby master sent you.</p><textarea id="jc" style="font-family:var(--fmono);font-size:.62rem;height:80px" placeholder="Lobby code"></textarea><button class="btn btn-ink btn-block" style="margin-top:8px" onclick="Net.joinMake()">Make my reply code</button></div>')+'</div>';
  }
  function jset(m,bad){if(!jr)return;jr.msg=m;jr.bad=!!bad;const e=$e('jmsg');if(e){e.textContent=m;e.style.color=bad?'var(--bad)':'';e.style.fontWeight=bad?'700':'';}}
  async function joinRoom(){
    const code=(($e('rc')||{}).value||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);
    if(code.length<5){jset('Enter the full 5-letter room code.',true);return;}
    const nm=cleanTxt((($e('jn')||{}).value||S.get('idle_name','')||''),18)||'Player';S.set('idle_name',nm);
    jr.code=code;jr.name=nm;jr.reconn=false;jr.tries=0;jset('⏳ Connecting…');
    let how='fb';try{how=await fbJoin(code,nm);}catch(e){console.warn('Firebase join unavailable:',e&&e.message);how='fail';}
    if(role!=='client')return;
    if(how==='ok'){eng='fb';return;}
    if(typeof Peer==='undefined'){jset(how==='nolobby'?'No lobby found with code '+code+'. Check it with the host.':'Could not connect. Check your internet connection.',true);return;}
    eng='peer';connectRoom();}
  async function fbJoin(code,nm){
    const F=await FBX.init(),X=F.X;
    const meta=await new Promise((res,rej)=>{let un=null,done=false;const t=setTimeout(()=>{if(!done){done=true;try{un&&un();}catch{}rej(new Error('db-timeout'));}},9000);un=X.onValue(F.r('rooms/'+code+'/meta'),sn=>{if(done)return;done=true;clearTimeout(t);setTimeout(()=>{try{un&&un();}catch{}},0);res(sn);},e=>{if(!done){done=true;clearTimeout(t);rej(e);}});});
    if(!meta.exists())return 'nolobby';
    closeClient();const cur={fb:true,F,code,last:Date.now(),joined:false,n:0,un:[],dc:{readyState:'open',send(s){X.push(F.r('rooms/'+code+'/acts/'+F.uid),s).catch(()=>{});},close(){}}};hc=cur;
    cur.un.push(X.onChildAdded(F.r('rooms/'+code+'/inbox/'+F.uid),s=>{const str=s.val();X.remove(s.ref).catch(()=>{});cur.last=Date.now();try{onHost(JSON.parse(str));}catch(e){console.error(e);}}));
    cur.un.push(X.onValue(F.r('rooms/'+code+'/img'),s=>{const v=s.val();if(v&&v.d)setImg(v.d);}));
    cur.un.push(X.onValue(F.r('rooms/'+code+'/meta'),s=>{if(hc!==cur)return;if(!s.exists()){if(cur.joined){alert('The lobby was closed by the host.');leave();}return;}const v=s.val();if(v.hostOn===false&&cur.joined)showBar('⏳ The host lost connection — waiting for them…');else rmBar();}));
    const pr=F.r('rooms/'+code+'/presence/'+F.uid);
    cur.un.push(X.onValue(F.r('.info/connected'),s=>{if(hc!==cur)return;if(s.val()===true){X.set(pr,true).catch(()=>{});try{X.onDisconnect(pr).remove();}catch{}if(cur.joined)rmBar();}else if(cur.joined)showBar('📡 Connection lost — reconnecting…');}));
    cur.to=setTimeout(()=>{if(hc===cur&&!cur.joined)joinFail('The lobby did not answer. Is the host still online?');},15000);
    await X.set(F.r('rooms/'+code+'/join/'+F.uid),{name:nm,t:Date.now()});
    try{sessionStorage.setItem('idle_last',code);}catch{}
    return 'ok';}
  function connectRoom(){
    closeClient();const peer=new Peer(undefined,PEER_OPTS()),cur={peer,last:Date.now(),joined:false,n:0};hc=cur;
    cur.to=setTimeout(()=>{if(hc===cur&&!cur.joined)joinFail('Could not reach that lobby. Check the code and your internet.');},15000);
    peer.on('open',()=>{if(hc!==cur)return;const dc=wrapConn(peer.connect('idle-'+jr.code,{reliable:true,serialization:'json'}));cur.dc=dc;
      dc.onopen=()=>dc.send(JSON.stringify({t:'hi',name:jr.name,tok:tokn()}));
      dc.onmessage=m=>{cur.last=Date.now();onHost(JSON.parse(m.data));};
      dc.onclose=()=>{if(hc===cur)(cur.joined?clientLost:()=>joinFail('The lobby closed the connection. Check the code.'))();};});
    peer.on('error',e=>{if(hc!==cur)return;joinFail(e.type==='peer-unavailable'?'No lobby found with code '+jr.code+'. Check it with the host.':['network','server-error','socket-error','socket-closed'].includes(e.type)?'Cannot reach the matchmaking server. Check your internet.':'Connection problem ('+e.type+').');});
  }
  function joinFail(msg){if(role!=='client'||!jr)return;clearTimeout(hc&&hc.to);closeClient();if(jr.reconn){setTimeout(tryReconnect,2500);return;}hc=null;renderJoin();jset(msg,true);}
  function clientLost(){if(role!=='client'||!jr||jr.reconn)return;if(mode!=='room'){alert('Lost connection to the lobby.');leave();return;}jr.reconn=true;jr.tries=0;showBar('📡 Connection lost — reconnecting…');tryReconnect();}
  function tryReconnect(){if(role!=='client'||!jr||!jr.reconn)return;if(jr.tries++>=10){alert('Could not reconnect to the lobby.');leave();return;}connectRoom();}
  function showBar(m){let d=$e('reconbar');if(!d){d=document.createElement('div');d.id='reconbar';d.className='errbar';document.body.appendChild(d);}d.textContent=m;}
  function rmBar(){const d=$e('reconbar');if(d)d.remove();}
  async function joinMake(){
    let off;try{off=dec($e('jc').value.trim());}catch{return alert('That code is not valid. Copy the whole thing again.');}
    const nm=cleanTxt((($e('jn')||{}).value||S.get('idle_name','')||''),18)||'Player';
    const pc=new RTCPeerConnection({iceServers:[]});hc={pc,last:Date.now(),joined:false,n:0};
    pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed'&&!hc.joined){alert('Connection failed. Both phones must be on the same hotspot/Wi-Fi.');leave();}};
    pc.ondatachannel=e=>{const dc=e.channel;hc.dc=dc;
      dc.onopen=()=>{inGame=false;dc.send(JSON.stringify({t:'hi',name:nm,tok:tokn()}));};
      dc.onmessage=m=>{hc.last=Date.now();onHost(JSON.parse(m.data));};
      dc.onclose=()=>{if(role==='client')clientLost();};};
    try{await pc.setRemoteDescription(off);await pc.setLocalDescription(await pc.createAnswer());await gathered(pc);joinReply=enc(pc.localDescription);renderJoin();}
    catch{alert('Could not use that code.');}
  }
  function onHost(m){
    if(hc&&hc.stale){hc.stale=false;rmBar();}
    if(m.t==='ping'){send(hc,{t:'pong'});return;}
    if(m.t==='you'){myId=m.id;if(hc){hc.joined=true;clearTimeout(hc.to);}if(jr){jr.reconn=false;jr.tries=0;}rmBar();chatEnsure();}
    else if(m.t==='kicked'){alert('The lobby master removed you from this lobby.');leave();}
    else if(m.t==='lobby'){roster=m.roster;lg=m.lg;run=m.run;if(!inGame)render();}
    else if(m.t==='view'){inGame=true;HELP.id=m.g||'lobby';showView(m.html);}
    else if(m.t==='toLobby'){inGame=false;HELP.id='lobby';render();}
    else if(m.t==='img')setImg(m.d);
    else if(m.t==='feed')setFeed(m.h);
    else if(m.t==='chat'){chatRecv(m.m);}
    else if(m.t==='chatlog'){chatMsgs=[];chatUnread=0;(m.log||[]).forEach(x=>chatMsgs.push(x));chatRender();}
  }
  function autoJoin(){const m=/^#([A-Za-z0-9]{5})$/.exec(location.hash||'');if(!m)return;prefill=m[1].toUpperCase();mode='room';joinGo('room');}
  function rejoinLast(){let c=null;try{c=sessionStorage.getItem('idle_last');}catch{}if(!c)return;prefill=c;mode='room';joinGo('room');setTimeout(()=>{const i=$e('rc');if(i)i.value=c;joinRoom();},50);}
  function lastRoom(){try{return sessionStorage.getItem('idle_last');}catch{return null;}}
  return{host,hostGo,joinGo,invite,accept,drop,setGenre,pick,start,act,actIn,kick,toLobby,leave,leaveAsk,joinScreen,joinMake,joinRoom,retryRoom,shareRoom,copyRoom,autoJoin,rejoinLast,lastRoom,chatToggle,chatSend,copy:copyTa,share,render,_drop(){try{hc&&hc.dc&&hc.dc.close&&hc.dc.close();}catch{}},_roster(){return JSON.stringify(roster.map(r=>[r.name,!!r.off,!!r.gone]));},_eng(){return eng;},_fbOff(){FBX.X.goOffline(FBX.db);},_fbOn(){FBX.X.goOnline(FBX.db);},_chat(){return chatMsgs.length;}};
})();

/* ================================================================
   BOOT
   ================================================================ */
(()=>{
  /* Re-renders of the SAME screen (every move, vote, chat-triggered update) must not replay the entrance animation — that was the "morphing/shifting". */
  (function(){const app=document.getElementById('app');let last=null;
   new MutationObserver(()=>{const sc=app.querySelector(':scope > .screen');if(!sc){last=null;return;}const h=sc.querySelector('.hrow'),k=h?h.textContent:null;
     if(k&&k===last)sc.classList.add('noanim');else last=k;}).observe(app,{childList:true});})();
  G.muteIcon();document.addEventListener('pointerdown',()=>SFX.unlock(),{once:true,capture:true});
  renderHub();
  try{Net.autoJoin();}catch{}
})();
</script>
