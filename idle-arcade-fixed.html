      '</div>'+
      '<button class="btn btn-ghost btn-block" style="margin-top:4px;" onclick="TwentyQ.randThinker()">🎲 Pick randomly</button>'+
      leaveLink('G.confirmLeave')+'</div>';
  }
  function randThinker(){setThinker(Math.floor(Math.random()*_names.length));}
  function setThinker(idx){
    st={thinker:{id:idx,name:_names[idx]},answer:'',category:'',questionsLeft:20,log:[]};
    thinkerPass();
  }
  function thinkerPass(){
    $a().innerHTML=
      '<div class="screen"><div class="pass-screen">'+
        '<div class="slabel">Pass to</div>'+
        '<div class="pass-name">🤔 '+esc(st.thinker.name)+'</div>'+
        '<p class="helptext">Cover screen while passing.</p>'+
        '<button class="btn btn-ink btn-block" style="margin-top:16px;" onclick="TwentyQ.thinkerReveal()">I\'m '+esc(st.thinker.name)+' — show setup</button>'+
      '</div></div>';
  }
  function thinkerReveal(){

    $a().innerHTML=
      '<div class="screen"><div class="reveal-card" style="text-align:left;">'+
        '<div class="slabel" style="text-align:center;">'+esc(st.thinker.name)+', what are you thinking of?</div>'+
        '<input id="tqAns" placeholder="e.g. a banana, Elon Musk, Mount Everest…" autocomplete="off" style="margin:14px 0;font-size:1rem;"/>'+
        '<div class="slabel">Category (optional)</div>'+
        '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:8px 0 16px;">'+
          [['🐾','Animal'],['🌍','Place'],['👤','Person'],['🎬','Movie'],['🍕','Food'],['🔧','Object']].map(([ico,lbl])=>
            '<button id="cat_'+lbl+'" onclick="TwentyQ.setCat(\''+ico+' '+lbl+'\')" style="padding:10px 4px;border-radius:10px;border:2px solid transparent;background:var(--paper-deep);font-size:.78rem;font-weight:700;cursor:pointer;transition:all .1s;line-height:1.4;">'+ico+'<br>'+lbl+'</button>'
          ).join('')+
        '</div>'+
        '<button class="btn btn-ink btn-block" onclick="TwentyQ.lockIn()">Lock in — hide my answer 🔒</button>'+
      '</div></div>';
  }
  function setCat(cat){
    _cat=cat;
    document.querySelectorAll('[id^="cat_"]').forEach(b=>{b.style.borderColor='transparent';b.style.background='var(--paper-deep)';});
    const key=cat.split(' ').slice(1).join(' ');
    const btn=document.getElementById('cat_'+key);
    if(btn){btn.style.borderColor='var(--ink)';btn.style.background='var(--card)';}
  }
  function lockIn(){
    const input=document.getElementById('tqAns');
    if(!input||!input.value.trim()){if(input){input.style.borderColor='var(--bad)';setTimeout(()=>{if(input)input.style.borderColor='';},1600);}return;}
    st.answer=input.value.trim();st.category=_cat;_cat='';
    $a().innerHTML=
      '<div class="screen"><div class="deskcard">'+
        '<div style="font-size:2.2rem;">🔒</div>'+
        '<div style="font-size:1.2rem;font-weight:800;margin:8px 0;">Answer locked!</div>'+
        (st.category?'<div class="pill" style="display:inline-flex;margin:6px auto;">'+esc(st.category)+'</div>':'')+
        '<p class="helptext" style="margin-top:10px;">Pass the phone back to the group. They\'ll ask questions — you tap Yes, No, or Maybe.</p>'+
        '<button class="btn btn-ink btn-block" style="margin-top:16px;" onclick="TwentyQ.qPhase()">Start questions →</button>'+
      '</div></div>';
  }
  function qPhase(){renderQ();}
  function renderQ(){
    const left=st.questionsLeft;
    const pct=Math.round(((20-left)/20)*100);
    const col=left<=5?'var(--bad)':left<=10?'var(--warn)':'var(--ink)';
    $a().innerHTML=
      '<div class="screen">'+hdr('20 Questions',esc(st.thinker.name)+' is thinking'+(st.category?' · '+st.category:''),null,'G.confirmLeave')+
      '<div class="card" style="text-align:center;">'+
        '<div class="slabel">Questions left</div>'+
        '<div class="tq-counter" style="color:'+col+';">'+left+'</div>'+
        '<div style="background:var(--paper-deep);border-radius:999px;height:7px;margin:8px 16px;overflow:hidden;">'+
          '<div style="height:100%;width:'+pct+'%;background:'+col+';border-radius:999px;transition:width .3s;"></div>'+
        '</div>'+
        '<p class="helptext">Ask a question out loud — '+esc(st.thinker.name)+' taps the answer.</p>'+
      '</div>'+
      '<div class="card" style="margin-bottom:10px;"><div class="slabel">Question (optional)</div><input id="tqQuestion" placeholder="e.g. Does it live in water?" autocomplete="off"/></div>'+
      '<div class="tq-grid">'+
        '<button class="btn btn-ok btn-block" style="font-size:1rem;" onclick="TwentyQ.ans(\'Yes\')">✅ Yes</button>'+
        '<button class="btn btn-block" style="background:var(--warn);color:#fff;font-size:1rem;" onclick="TwentyQ.ans(\'Maybe\')">🤔 Maybe</button>'+
        '<button class="btn btn-bad btn-block" style="font-size:1rem;" onclick="TwentyQ.ans(\'No\')">❌ No</button>'+
      '</div>'+
      (st.log.length?
        '<div class="card"><div class="slabel">Answers ('+st.log.length+'/20)</div>'+
          '<div class="tq-log">'+
            st.log.slice().reverse().map((l,i)=>'<div class="tq-log-row">'+
              '<span>'+(l.a==='Yes'?'✅':l.a==='No'?'❌':'🤔')+'</span>'+
              '<span class="helptext">Q'+(st.log.length-i)+(l.q?' · '+esc(l.q):'')+' → <b>'+l.a+'</b></span>'+
            '</div>').join('')+
          '</div>'+
        '</div>':'')+
      '<div class="brow" style="margin-top:4px;">'+
        '<button class="btn btn-ink" style="flex:1;" onclick="TwentyQ.correct()">🎉 Guessed it!</button>'+
        '<button class="btn btn-ghost" style="flex:1;" onclick="TwentyQ.giveUp()">🏳 Give up</button>'+
      '</div>'+
      leaveLink('G.confirmLeave')+'</div>';
  }
  function ans(a){
    if(st.questionsLeft<=0)return;
    const qi=document.getElementById('tqQuestion');const q=qi?qi.value.trim():'';
    st.log.push({a,q});st.questionsLeft--;SFX.tap();
    if(st.questionsLeft<=0){SFX.bad();giveUp();return;}
    renderQ();
  }
  function correct(){
    SFX.win();burst();
    $a().innerHTML=
      '<div class="screen"><div class="deskcard" style="margin-bottom:14px;">'+
        '<div style="font-size:2.5rem;">🎉</div>'+
        '<div style="font-size:1.5rem;font-weight:800;margin:6px 0;color:var(--ok-deep);">They got it!</div>'+

  function codenamesSetup(){st.secret=pick(st.d.data);const board=shuffle(st.d.data).slice(0,12);frame('Codenames Lite',`Round ${st.round}/${st.max}`,`<div class="slabel">Secret target</div><div class="solo-big">Give a one-word clue for <b>${esc(st.secret)}</b>, then let everyone guess.</div><input id="clue" maxlength="24" placeholder="Your clue…"/><div class="word-board">${board.map(w=>`<button onclick="SoonGames.pickWord('${w}')">${esc(w)}</button>`).join('')}</div><p class="helptext">The clue-giver may use a clue, then the group guesses a visible word.</p>`)}
  function pickWord(w){const ok=w===st.secret;if(ok){st.score[st.i%st.players.length]++;SFX.success();}else SFX.bad();frame('Codenames Lite',ok?'Direct hit!':'Wrong word',`<div class="solo-big">${ok?'🎯 You found the target.':'💥 That was not the target.'}</div><p class="helptext">Target: <b>${esc(st.secret)}</b></p>${nextButton()}`)}
  function passwordSetup(){st.secret=pick(st.d.data);const reveals=[...st.secret].map((_,i)=>i<2?'_':Math.random()<.22?st.secret[i]:'_').join('');frame('Password Panic',`Round ${st.round}/${st.max}`,`<div class="slabel">Partial password</div><div class="solo-code">${esc(reveals)}</div><p class="helptext">Guess the word. You get one attempt before the next clue.</p><input id="guess" maxlength="30" placeholder="Type your guess…"/><button class="btn btn-ink btn-block" style="margin-top:12px;" onclick="SoonGames.submitText('guess')">Guess</button>`)}
  function submitText(id){
    const v=(document.getElementById(id)?.value||'').trim();
    const player=st.players[st.i%st.players.length];
    if(st.d.kind==='password'){
      const ok=v.toLowerCase()===String(st.secret).toLowerCase();

      return;
    }
    if(st.d.kind==='song'){

      return;
    }

      frame('Rapid Categories',ok?'Accepted':'Wrong start',`<div class="solo-big">${ok?'✅ That counts.':'❌ The answer must start with '+st.letter+'.'}</div>${nextButton()}`);

      return;
    }

  function initCanvas(){const c=document.getElementById('drawBoard');if(!c)return;const x=c.getContext('2d');let down=false,last=null;const pos=e=>{const r=c.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*c.width/r.width,y:(p.clientY-r.top)*c.height/r.height}};const begin=e=>{down=true;last=pos(e);e.preventDefault()};const move=e=>{if(!down)return;const q=pos(e);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(q.x,q.y);x.lineWidth=7;x.lineCap='round';x.strokeStyle='#1F2454';x.stroke();last=q;e.preventDefault()};const end=()=>down=false;c.addEventListener('pointerdown',begin);c.addEventListener('pointermove',move);c.addEventListener('pointerup',end);c.addEventListener('pointerleave',end);}

const Lobby=(()=>{
  let peer=null,isHost=false,room='',state={players:[],game:'reaction',started:false,round:0,phase:'lobby',prompt:'',data:{},responses:{},results:[]};
  let links=new Map(),loadPromise=null,timer=null,localId='host',localGo=false,localGoAt=0,drawState=null;
  const PEERJS='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
  const name=()=>S.get('idle_name','').trim().slice(0,22)||'Player';
  const cleanCode=v=>('IDLE-'+String(v||'').trim().replace(/^IDLE-/i,'')).toUpperCase();
  const players=()=>state.players||[];
  const guests=()=>players().filter(p=>!p.host);
  const game=()=>GAMES.find(g=>g.id===state.game);
  const def=(id)=>REMOTE_DEFS[id]||REMOTE_DEFS.hot;
  const sendTo=(id,m)=>{const c=links.get(id);if(c?.open)try{c.send(m)}catch{}};
  const send=m=>links.forEach(c=>{try{if(c.open)c.send(m)}catch{}});
  function wireState(){const copy=JSON.parse(JSON.stringify(state));delete copy.hostPrivate;delete copy.hostSecrets;delete copy.secrets;delete copy.private;return copy} function sendState(type='state'){send({type,state:wireState()})} function broadcast(){sendState('state')}
  function cleanup(){clearTimeout(timer);links.forEach(c=>{try{c.close()}catch{}});links.clear();if(peer){try{peer.destroy()}catch{}}peer=null;room='';isHost=false;localId='host';localGo=false;drawState=null}
  function loadPeer(){if(window.Peer)return Promise.resolve();if(loadPromise)return loadPromise;loadPromise=new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src=PEERJS;sc.onload=()=>window.Peer?resolve():reject(new Error('Nearby networking library failed to load'));sc.onerror=()=>reject(new Error('Could not load the networking library'));document.head.appendChild(sc)});return loadPromise}
  function openCreate(){cleanup();isHost=true;room=cleanCode(Math.random().toString(36).slice(2,8));state={players:[{id:'host',name:name(),host:true}],game:'hot',started:false,round:0,phase:'lobby',prompt:'',data:{},responses:{},results:[]};$a().innerHTML=`<div class="screen">${hdr('Create Nearby Lobby','Lobby master',null,'Lobby.closeRoom')}<div class="lobby-hero"><div class="lobby-eyebrow">ROOM CODE</div><div class="lobby-code">${esc(room.replace('IDLE-',''))}</div><div class="lobby-sub"><span class="online-dot"></span>Everyone joins this room. Pick any game together.</div></div><div id="lobbyStage"><div class="card"><div class="slabel">Starting lobby…</div><p class="helptext">Preparing the room.</p></div></div></div>`;loadPeer().then(()=>bootHost()).catch(hostError)}
  function bootHost(){let tries=0;function make(){tries++;peer=new Peer(room);peer.on('open',renderHost);peer.on('connection',accept);peer.on('error',e=>{if(tries<3){try{peer.destroy()}catch{};room=cleanCode(Math.random().toString(36).slice(2,8));setTimeout(make,250)}else hostError(e)})}make()}
  function hostError(e){cleanup();const el=document.getElementById('lobbyStage');if(el)el.innerHTML=`<div class="card"><div class="net-error">${esc(e?.message||'Could not start the lobby.')}</div><div class="net-note">Nearby mode needs an internet-assisted WebRTC handshake. The actual game data then travels peer-to-peer. One-phone mode stays fully offline.</div><button class="btn btn-ghost btn-block" style="margin-top:12px;" onclick="G.hub()">Back to hub</button></div>`}
  function openJoin(){$a().innerHTML=`<div class="screen">${hdr('Join Nearby Lobby','Your phone becomes your controller',null,'G.hub')}<div class="card join-card"><div class="slabel">Lobby code</div><input id="joinCode" maxlength="12" placeholder="e.g. 7K3P9Q" autocomplete="off" style="font-family:var(--fmono);letter-spacing:.14em;text-transform:uppercase;font-size:1.1rem;text-align:center;"/><div class="slabel" style="margin-top:14px;">Your name</div><input id="joinName" value="${esc(name())}" maxlength="22" placeholder="you"/><button class="btn btn-ink btn-block" style="margin-top:16px;" onclick="Lobby.join()">📡 Join lobby</button><div class="net-note">The lobby master chooses the game. Once the game starts, this phone becomes your player screen automatically.</div></div></div>`}
  function join(){const code=document.getElementById('joinCode')?.value.trim();const nm=document.getElementById('joinName')?.value.trim();room=cleanCode(code);S.set('idle_name',nm||'Player');if(room.replace('IDLE-','').length<4){const e=document.getElementById('joinCode');if(e)e.style.borderColor='var(--bad)';return}$a().innerHTML=`<div class="screen">${hdr('Joining…','Opening your player connection',null,'G.hub')}<div class="card"><div style="font-size:2.2rem;text-align:center;">📡</div><p class="helptext" style="text-align:center;">Finding the lobby master…</p></div></div>`;loadPeer().then(()=>{peer=new Peer();peer.on('open',()=>{localId=peer.id;const c=peer.connect(room,{reliable:true});bind(c);c.on('open',()=>c.send({type:'hello',name:name()}));c.on('error',joinError)});peer.on('error',joinError)}).catch(joinError)}
  function joinError(e){$a().innerHTML=`<div class="screen">${hdr('Could not join','Check the room code and connection',null,'G.hub')}<div class="card"><div class="net-error">${esc(e?.message||'Connection failed.')}</div><button class="btn btn-ghost btn-block" style="margin-top:12px;" onclick="Lobby.openJoin()">Try again</button></div></div>`}
  function bind(c){c.on('data',m=>handle(c,m));c.on('close',()=>{if(isHost){links.delete(c.peer);state.players=state.players.filter(p=>p.id!==c.peer);broadcast();renderHost()}})}

  function renderHost(){const stage=document.getElementById('lobbyStage');if(!stage)return;stage.innerHTML=`<div class="card lobby-players"><div class="lobby-headline"><div><div class="slabel">Players</div><div class="lobby-count">${state.players.length}/12 connected</div></div><button class="pill" style="border:0;cursor:pointer;" onclick="Lobby.copyCode()">📋 ${esc(room.replace('IDLE-',''))}</button></div><div class="player-grid">${state.players.map(p=>`<div class="player-chip ${p.host?'room-player-highlight':''}"><div class="avatar">${esc((p.name[0]||'?').toUpperCase())}</div><div class="pmeta"><div class="pname">${esc(p.name)}</div><div class="prole">${p.host?'LOBBY MASTER':'CONNECTED'}</div></div>${p.host?'':'<button class="kick" onclick="Lobby.kick(\''+p.id+'\')">✕</button>'}</div>`).join('')}</div></div><div class="card"><div class="lobby-headline"><div><div class="slabel">Choose your game</div><div class="helptext" style="margin-top:-4px;">Pick one. Every player uses their own phone once the game starts.</div></div><span class="pill">${GAMES.length} games</span></div><div class="lobby-game-grid">${GAMES.map(g=>`<button class="lobby-game-card ${state.game===g.id?'on':''}" onclick="Lobby.selectGame('${g.id}')"><span class="lg-icon">${g.icon}</span><span class="lg-title">${esc(g.title)}</span><span class="lg-desc">${esc(g.desc)}</span></button>`).join('')}</div><div class="lobby-actions"><button class="btn btn-ghost" onclick="Lobby.copyCode()">Copy code</button><button class="btn btn-ink" onclick="Lobby.startGame()" ${state.players.length<2?'disabled':''}>Start ${esc(game()?.title||'game')} →</button></div></div>`}

  let spyRemoteDeck=[];let spyRemoteLast='';function nextSpyRemoteLocation(){if(!spyRemoteDeck.length){spyRemoteDeck=shuffle(SPY_REMOTE_LOCS.slice());if(spyRemoteDeck.length>1&&spyRemoteDeck[0].name===spyRemoteLast)[spyRemoteDeck[0],spyRemoteDeck[1]]=[spyRemoteDeck[1],spyRemoteDeck[0]]}const loc=spyRemoteDeck.shift();spyRemoteLast=loc.name;return loc}
