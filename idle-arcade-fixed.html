<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>IDLE — free period arcade</title>
<style>
/* ============================================================
   DESIGN SYSTEM — "passed note on ruled paper"
   Palette anchored to the physical classroom: cream ruled paper
   (#F7F1E2), margin rule red, navy ink, highlighter yellow.
   Each game card is a coloured sticky note taped above the fold.
   Only gameplay surfaces (the "index card") are white for legibility.
   Signature: the ruled-paper full-bleed background with margin line.
   ============================================================ */
:root{
  --paper:#F7F1E2; --paper-deep:#ECE3CB; --paper-dark:#DFD5B8;
  --rule:rgba(80,108,190,.28); --margin:#D6555F;
  --ink:#1F2454; --ink-dim:#4D5280; --ink-faint:#8B8FB0;
  --card:#FFFDF7; --card-edge:#EDE7CC; --card-shadow:rgba(31,36,84,.14);
  --hl:#FFD23F; --hl-dark:#E8B800;
  --ok:#27A060; --ok-deep:#19734A;
  --warn:#E08A2B; --bad:#D6555F; --bad-deep:#A23842;
  /* game accent tokens */
  --c-mafia:#C23B4B; --c-mafia2:#7A1B2B;
  --c-spy:#1F9E89;   --c-spy2:#0B5C50;
  --c-ttt:#6957D6;   --c-ttt2:#3F2E96;
  --c-dice:#C46A1A;  --c-dice2:#6B3408;
  --c-wc:#27A060;    --c-wc2:#0E5232;
  --c-tq:#4A6FA5;    --c-tq2:#243558;
  --radius:18px; --radius-sm:12px; --maxw:480px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --fdisplay:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;
  --fmono:"SF Mono","Cascadia Code",Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font);color:var(--ink);background-color:var(--paper);
  background-image:
    repeating-linear-gradient(to bottom,transparent 0 27px,var(--rule) 27px 28px),
    linear-gradient(to right,transparent 0 30px,var(--margin) 30px 31.5px,transparent 31.5px 100%);
  min-height:100vh;overflow-x:hidden;
}
button,input,textarea,select{font-family:inherit;}
input,textarea,select{
  background:var(--card);border:1.5px solid var(--card-edge);border-radius:10px;
  padding:10px 12px;color:var(--ink);font-size:15px;width:100%;
}
textarea{resize:vertical;min-height:80px;}
input:focus,textarea:focus,select:focus{outline:2px solid var(--c-ttt);outline-offset:1px;}
::selection{background:var(--hl);}

/* ── layout ── */
#app{max-width:var(--maxw);margin:0 auto;padding:clamp(14px,4vw,22px) clamp(12px,4vw,20px) max(100px,calc(72px + env(safe-area-inset-bottom,0px)));min-height:100vh;}
.screen{animation:fadeUp .26s ease-out both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:none;}}
@keyframes popIn{from{opacity:0;transform:scale(.93);}to{opacity:1;transform:scale(1);}}
@keyframes pulseBig{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;}}

/* ── header row ── */
.hrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.hrow .htitle{font-weight:800;font-size:1.12rem;flex:1;line-height:1.2;}
.hrow .hsub{font-size:.78rem;color:var(--ink-dim);font-weight:600;margin-top:1px;}
.iconbtn{
  width:44px;height:44px;min-width:44px;min-height:44px;border-radius:50%;border:none;background:var(--card);
  box-shadow:0 2px 6px var(--card-shadow);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  transition:transform .1s;
}
.iconbtn:active{transform:scale(.9);}

/* ── buttons ── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:none;border-radius:var(--radius-sm);padding:13px 18px;font-weight:800;
  font-size:15px;min-height:44px;cursor:pointer;transition:transform .1s,box-shadow .1s;
  box-shadow:0 3px 0 rgba(0,0,0,.13);
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.13);}
.btn-block{display:flex;width:100%;}
.btn-ink{background:var(--ink);color:var(--paper);}
.btn-accent{background:var(--c-ttt);color:#fff;}
.btn-ok{background:var(--ok);color:#fff;}
.btn-bad{background:var(--bad);color:#fff;}
.btn-ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);}
.btn-ghost:active{transform:translateY(2px);}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:10px;}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none;}
.brow{display:flex;gap:10px;flex-wrap:wrap;}
.brow .btn{flex:1;}

/* ── cards ── */
.card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 7px 20px var(--card-shadow);margin-bottom:14px;}
.card-tight{padding:10px;}
.deskcard{background:var(--card);border-radius:var(--radius);padding:24px 20px;box-shadow:0 10px 26px var(--card-shadow);text-align:center;}

/* ── typography helpers ── */
.slabel{font-size:.71rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 8px 1px;}
.helptext{font-size:.84rem;color:var(--ink-dim);line-height:1.48;}
.divider{height:1px;background:var(--paper-dark);margin:14px 0;border:none;}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:.74rem;font-weight:700;background:var(--paper-deep);color:var(--ink);}

/* ── stepper ── */
.stepper{display:flex;align-items:center;gap:14px;justify-content:center;}
.stepper button{width:40px;height:40px;border-radius:50%;border:none;background:var(--ink);color:var(--paper);font-size:20px;font-weight:800;cursor:pointer;}
.stepper button:active{transform:scale(.91);}
.stepper .val{font-family:var(--fmono);font-size:1.55rem;font-weight:800;min-width:44px;text-align:center;}

/* ── switch ── */
.switchrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;}
.switchrow .slbl{font-weight:700;font-size:.92rem;}
.switchrow .ssub{font-size:.77rem;color:var(--ink-dim);}
.switch{position:relative;width:46px;height:27px;border-radius:999px;background:var(--paper-dark);border:none;cursor:pointer;flex:0 0 auto;}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .14s;box-shadow:0 1px 3px rgba(0,0,0,.28);}
.switch.on{background:var(--ok);}
.switch.on::after{left:22px;}

/* ── list rows ── */
.llist{display:flex;flex-direction:column;gap:8px;}
.lrow{
  display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;
  background:var(--paper-deep);cursor:pointer;border:2px solid transparent;
  transition:transform .08s,border-color .1s;
}
.lrow:active{transform:scale(.98);}
.lrow.sel{border-color:var(--ink);background:var(--card);}
.lrow.dead{opacity:.42;text-decoration:line-through;cursor:default;}
.avatar{
  width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--paper);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.84rem;flex:0 0 auto;
}
.rname{font-weight:700;flex:1;font-size:.94rem;}

/* ── modal ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(31,36,84,.52);display:flex;align-items:center;
  justify-content:center;padding:20px;z-index:100;animation:popIn .14s ease-out both;
}
.modal-box{background:var(--card);border-radius:var(--radius);padding:22px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 16px 40px rgba(0,0,0,.28);}
.modal-box h3{margin:0 0 10px;font-size:1.05rem;}
.modal-box p,.modal-box li{font-size:.88rem;line-height:1.55;color:var(--ink-dim);}

/* ── timer ── */
.timer-disp{font-family:var(--fmono);font-size:2.8rem;font-weight:800;text-align:center;letter-spacing:.02em;}
.timer-disp.urgent{color:var(--bad);animation:pulseBig .6s infinite;}

/* ── hub ── */
.wordmark{font-family:var(--fdisplay);font-size:3rem;color:var(--ink);transform:rotate(-2.2deg);display:inline-block;line-height:1;}
.wm-badge{font-family:var(--fmono);font-size:.68rem;background:var(--hl);padding:2px 8px;border-radius:6px;transform:rotate(2.5deg);display:inline-block;}
.tagline{font-weight:700;color:var(--ink-dim);margin:3px 0 14px;font-size:.9rem;}
.ws-field{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.83rem;color:var(--ink-dim);margin-bottom:6px;}
.ws-field input{flex:1;border:none;border-bottom:2px dotted var(--paper-dark);background:transparent;padding:2px 4px;font-weight:700;color:var(--ink);}
.ws-field input:focus{outline:none;border-bottom-color:var(--c-ttt);}
.ws-blank{border-bottom:2px dotted var(--paper-dark);padding:2px 6px;font-weight:700;}
.gamecard-grid{display:flex;flex-direction:column;gap:18px;margin-top:6px;}
.gamecard{
  position:relative;border-radius:14px;padding:18px 16px 16px;cursor:pointer;color:#fff;
  box-shadow:0 10px 22px rgba(0,0,0,.18);transform:rotate(var(--r,0deg));
  transition:transform .15s,box-shadow .15s;
}
.gamecard:active{transform:rotate(var(--r,0deg)) scale(.97);}
.gamecard::before{
  content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-3deg);
  width:60px;height:18px;background:rgba(255,255,255,.52);border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.14);
}
.gc-top{display:flex;align-items:center;gap:9px;margin-bottom:5px;}
.gc-icon{font-size:1.75rem;}
.gc-title{font-weight:800;font-size:1.1rem;line-height:1.2;}
.gc-tag{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;background:rgba(255,255,255,.22);padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:7px;}
.gc-desc{font-size:.83rem;opacity:.93;line-height:1.4;}
.gc-mafia{background:linear-gradient(148deg,var(--c-mafia),var(--c-mafia2));}
.gc-spy{background:linear-gradient(148deg,var(--c-spy),var(--c-spy2));}
.gc-ttt{background:linear-gradient(148deg,var(--c-ttt),var(--c-ttt2));}
.gc-dice{background:linear-gradient(148deg,#C46A1A,#6B3408);}
.gc-wc{background:linear-gradient(148deg,#27A060,#0E5232);}
.gc-tq{background:linear-gradient(148deg,#4A6FA5,#243558);}
/* ── Liar's Dice ── */
.dice-grid{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:14px 0;}
@keyframes dieRoll{0%{opacity:0;transform:rotate(-20deg) scale(.75);}100%{opacity:1;transform:none;}}
.die{
  width:54px;height:54px;border-radius:13px;background:var(--card);
  box-shadow:0 4px 10px var(--card-shadow),inset 0 0 0 1.5px rgba(0,0,0,.07);
  display:flex;align-items:center;justify-content:center;font-size:2.1rem;
  animation:dieRoll .32s ease-out both;flex:0 0 auto;
}
.die:nth-child(1){animation-delay:0s}.die:nth-child(2){animation-delay:.06s}
.die:nth-child(3){animation-delay:.12s}.die:nth-child(4){animation-delay:.18s}
.die:nth-child(5){animation-delay:.24s}
.bid-faces{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:8px 0 14px;}
.face-btn{padding:10px 4px;border-radius:10px;border:2px solid transparent;background:var(--paper-deep);font-size:1.55rem;cursor:pointer;transition:border-color .1s,background .1s;}
.face-btn.sel{border-color:var(--ink);background:var(--card);}
/* ── Word Chain ── */
.wc-letter{font-size:5.5rem;font-weight:900;text-align:center;line-height:1;font-family:var(--fmono);color:var(--c-ttt);letter-spacing:-.02em;}
.wc-chain{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start;}
.wc-chip{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--paper-deep);color:var(--ink);}
.wc-chip.fresh{background:var(--hl);color:var(--ink);}
/* ── 20 Questions ── */
.tq-counter{font-family:var(--fmono);font-size:4.5rem;font-weight:900;text-align:center;line-height:1;transition:color .3s;}
.tq-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;}
.tq-log{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow-y:auto;}
.tq-log-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--paper-dark);font-size:.83rem;}
.gc-soon{border-radius:14px;padding:14px 16px;text-align:center;border:2px dashed var(--paper-dark);color:var(--ink-faint);font-weight:700;font-size:.83rem;transform:rotate(var(--r,0deg));}
.footer-note{text-align:center;margin-top:24px;font-size:.72rem;color:var(--ink-faint);font-weight:600;}

/* ── mute fab ── */
.mute-fab{position:fixed;top:max(14px,env(safe-area-inset-top,14px));right:max(14px,env(safe-area-inset-right,14px));z-index:40;}

/* ── confetti ── */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90;}

/* ── leave link ── */
.leave-link{text-align:center;margin-top:10px;}
.leave-link a{color:var(--ink-faint);font-size:.76rem;font-weight:700;text-decoration:none;}

/* ── pass-screen ── */
.pass-screen{background:var(--card);border-radius:var(--radius);padding:34px 22px;box-shadow:0 10px 28px var(--card-shadow);text-align:center;}
.pass-name{font-size:1.65rem;font-weight:800;margin:6px 0 10px;}
.reveal-card{background:var(--card);border-radius:var(--radius);padding:28px 20px;box-shadow:0 10px 28px var(--card-shadow);text-align:center;animation:popIn .22s ease-out both;}

/* ── UTTT board ── */
.uttt-wrap{user-select:none;}
.uttt-status{padding:10px 14px;border-radius:10px;background:var(--paper-deep);font-weight:800;font-size:.9rem;text-align:center;margin-bottom:12px;}
.meta-wrap{background:var(--ink);border-radius:18px;padding:8px;margin:4px 0;}
.meta-board{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.meta-cell{
  border-radius:10px;padding:5px;background:var(--paper-deep);
  border:3px solid transparent;transition:border-color .15s,background .15s;cursor:pointer;
}
@keyframes activeGlow{0%,100%{box-shadow:0 0 0 0 rgba(105,87,214,.35);}50%{box-shadow:0 0 0 5px rgba(105,87,214,.0);}}
.meta-cell.active-zone{border-color:var(--c-ttt);background:rgba(105,87,214,.07);animation:activeGlow 1.8s ease-in-out infinite;}
.meta-cell.won-X{background:rgba(217,54,75,.13);border-color:var(--c-mafia);}
.meta-cell.won-O{background:rgba(31,158,137,.13);border-color:var(--c-spy);}
.meta-cell.drawn-meta{background:var(--paper-dark);}
.mini-board{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:rgba(0,0,0,.3);border-radius:7px;overflow:hidden;padding:3px;}
.mini-cell{
  aspect-ratio:1;border-radius:3px;display:flex;align-items:center;justify-content:center;
  font-size:1.05rem;font-weight:900;cursor:pointer;background:rgba(255,255,255,.88);
  transition:background .09s,transform .08s;border:2px solid transparent;
}
.mini-cell:not(.blocked):hover{background:#fff;border-color:rgba(0,0,0,.1);}
.mini-cell:active{transform:scale(.88);}
.mini-cell.cx{color:var(--c-mafia);}
.mini-cell.co{color:var(--c-spy);}
.mini-cell.blocked{cursor:default;background:rgba(255,255,255,.55);border-color:transparent;}
.mini-cell.last{outline:2px solid currentColor;outline-offset:-2px;}
.meta-cell-won-mark{
  display:flex;align-items:center;justify-content:center;
  font-size:2.4rem;font-weight:900;height:100%;min-height:68px;
}
.meta-cell-won-mark.cx{color:var(--c-mafia);}
.meta-cell-won-mark.co{color:var(--c-spy);}
.meta-cell-won-mark.cd{color:var(--ink-faint);font-size:1.5rem;}
.ttt-legend{display:flex;gap:10px;justify-content:center;margin-bottom:12px;}
.ttt-chip{display:flex;align-items:center;gap:5px;font-weight:800;font-size:.85rem;padding:5px 12px;border-radius:999px;}
.ttt-chip.cx{background:rgba(194,59,75,.15);color:var(--c-mafia);}
.ttt-chip.co{background:rgba(31,158,137,.15);color:var(--c-spy2);}

/* ================================================================
   IDLE vNext — nearby party lobby + premium mobile polish
   ================================================================ */
:root{--glass:rgba(255,253,247,.86);--cyan:#13A7C7;--purple:#7455E8;--orange:#E47A22;--shadow2:0 16px 38px rgba(31,36,84,.17);}
body{background-attachment:fixed;}
.topbar{display:flex;gap:8px;align-items:center;margin:-4px 0 16px;}.topbar .btn{flex:1;min-height:50px;padding:10px 12px;}
.modebar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px;}
.modebtn{border:2px solid transparent;background:var(--paper-deep);border-radius:14px;padding:11px 10px;font-weight:800;color:var(--ink);cursor:pointer;text-align:left;box-shadow:none;min-height:74px;}
.modebtn.on{background:var(--card);border-color:var(--ink);box-shadow:0 4px 12px var(--card-shadow);}
.modebtn .mi{font-size:1.1rem;margin-right:4px;}.modebtn .ms{display:block;font-size:.68rem;color:var(--ink-dim);font-weight:650;margin-top:3px;}
.gc-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px;}.gc-badge{font-size:.63rem;font-weight:900;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.18);}.gc-badge.nearby{background:rgba(255,255,255,.29);}.gc-badge.phone{opacity:.9;}
.lobby-hero{background:linear-gradient(145deg,var(--ink),#353C79);color:#fff;border-radius:22px;padding:20px;box-shadow:var(--shadow2);margin-bottom:14px;position:relative;overflow:hidden;}.lobby-hero::after{content:"";position:absolute;width:180px;height:180px;border:28px solid rgba(255,255,255,.07);border-radius:50%;right:-70px;top:-80px;}
.lobby-code{font-family:var(--fmono);font-weight:900;letter-spacing:.18em;font-size:1.7rem;margin:5px 0 2px;}.lobby-sub{font-size:.78rem;opacity:.82;line-height:1.45;}.online-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#55D982;margin-right:6px;box-shadow:0 0 0 4px rgba(85,217,130,.15);}
.player-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}.player-chip{display:flex;align-items:center;gap:8px;background:var(--paper-deep);border-radius:13px;padding:10px 11px;min-width:0;}.player-chip .avatar{width:32px;height:32px;}.player-chip .pmeta{min-width:0;flex:1;}.player-chip .pname{font-weight:800;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.player-chip .prole{font-size:.66rem;color:var(--ink-dim);font-weight:700;}.kick{border:none;background:transparent;color:var(--bad);font-size:.9rem;cursor:pointer;padding:7px;}
.lobby-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;}.net-note{font-size:.72rem;color:var(--ink-dim);line-height:1.45;background:rgba(255,255,255,.48);border:1px dashed var(--paper-dark);padding:10px 12px;border-radius:12px;margin-top:10px;}.net-error{background:rgba(214,85,95,.09);border:1px solid rgba(214,85,95,.2);border-radius:12px;padding:10px 12px;font-size:.8rem;color:var(--bad-deep);font-weight:700;}
.remote-screen{background:linear-gradient(155deg,#11152f,#252B59);border-radius:24px;color:#fff;padding:20px;min-height:420px;box-shadow:var(--shadow2);}.result-screen{display:flex;flex-direction:column;justify-content:center;min-height:420px}.result-screen .remote-list{margin-top:10px}.result-screen .remote-rank{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.1)}.remote-question{font-size:1.65rem;line-height:1.2;font-weight:900;margin:10px 0 18px;}.remote-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.remote-choice .btn{min-height:78px;font-size:1rem;}
.remote-list{display:flex;flex-direction:column;gap:7px;margin-top:12px;}.remote-rank{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.08);font-size:.82rem;}.react-pad{height:230px;border-radius:22px;border:0;width:100%;font-size:3.4rem;font-weight:1000;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(255,255,255,.1);}.react-pad.go{background:rgba(39,160,96,.32);box-shadow:inset 0 0 0 2px rgba(85,217,130,.35),0 0 35px rgba(85,217,130,.1);}
.emoji-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:13px 0 6px;}.emoji-btn{width:53px;height:53px;border:none;border-radius:15px;background:rgba(255,255,255,.1);font-size:1.7rem;cursor:pointer;}.room-player-highlight{border:2px solid var(--c-spy);background:rgba(31,158,137,.08);}
@media(min-width:560px){#app{max-width:560px}.player-grid{grid-template-columns:repeat(3,minmax(0,1fr));}}

/* ================================================================
   IDLE vFinal — visual polish
   ================================================================ */

<body>

<button class="iconbtn mute-fab" id="muteBtn" onclick="G.toggleMute()" aria-label="Toggle sound">🔊</button>
<canvas id="confetti"></canvas>
<div id="app"></div>

<script>
"use strict";

/* ================================================================
   SHARED UTILITIES
   ================================================================ */
const $a=()=>document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;}
function clamp(n,a,b){return Math.max(a,Math.min(b,n));}
const S={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch{return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}}
function getRoster(){return S.get('idle_roster','');}
function setRoster(v){S.set('idle_roster',v);}
function parseNames(text,n){const ns=text.split('\n').map(s=>s.trim()).filter(Boolean);return Array.from({length:n},(_,i)=>ns[i]||'Player '+(i+1));}
function fmtTime(s){const m=0|s/60,ss=s%60;return m+':'+(ss<10?'0':'')+ss;}
function leaveLink(cb){return '<div class="leave-link"><a href="javascript:void(0)" onclick="'+cb+'()">↩ Leave game</a></div>';}
function hdr(title,sub,helpFn,backFn){
  const bf=backFn||'G.hub';
  return '<div class="hrow"><button class="iconbtn" onclick="'+bf+'()">←</button>'+
    '<div><div class="htitle">'+esc(title)+'</div>'+(sub?'<div class="hsub">'+esc(sub)+'</div>':'')+'</div>'+
    (helpFn?'<button class="iconbtn" onclick="'+helpFn+'()">?</button>':'<div style="width:38px"></div>')+
    '</div>';
}

/* ================================================================
   AUDIO (web audio synthesis – no files needed)
   ================================================================ */
const SFX=(()=>{
  let ctx=null,muted=S.get('idle_muted',false);
  function ac(){
    if(!ctx){try{ctx=new(window.AudioContext||window.webkitAudioContext)();}catch{ctx=null;}}
    if(ctx&&ctx.state==='suspended')ctx.resume();
    return ctx;
  }
  function tone(hz,dur,type='sine',delay=0,vol=0.14){
    if(muted)return;const c=ac();if(!c)return;
    const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;
    o.type=type;o.frequency.value=hz;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);
  }
  return{
    unlock(){ac();},
    isMuted(){return muted;},
    setMuted(v){muted=v;S.set('idle_muted',v);},
    click(){tone(600,.07,'square',0,.08);},
    tap(){tone(880,.05,'square',0,.06);},
    reveal(){tone(440,.12,'sine');tone(660,.14,'sine',.07);},
    success(){tone(523,.1,'sine');tone(659,.1,'sine',.1);tone(784,.16,'sine',.2);},
    fail(){tone(300,.14,'sawtooth',0,.09);tone(220,.2,'sawtooth',.1,.09);},
    win(){[523,659,784,1046].forEach((h,i)=>tone(h,.14+(i==3?.08:0),'sine',i*.12));},
    bad(){tone(280,.2,'square',0,.07);},
    place(){tone(740,.06,'sine',0,.1);}
  };
})();

/* ================================================================
   CONFETTI
   ================================================================ */
function burst(){
  const cv=document.getElementById('confetti'),cx=cv.getContext('2d');
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#C23B4B','#1F9E89','#6957D6','#FFD23F','#2BAA66','#1F2454'];
  const ps=Array.from({length:100},()=>({
    x:innerWidth/2+(Math.random()-.5)*100,y:innerHeight*.3+(Math.random()-.5)*40,
    vx:(Math.random()-.5)*9,vy:Math.random()*-7-3,g:.22+Math.random()*.12,
    w:5+Math.random()*5,h:3+Math.random()*4,col:cols[0|Math.random()*cols.length],
    rot:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,life:0
  }));
  let fr=0;const MAX=120;
  (function step(){
    fr++;cx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{
      p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life++;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);
      cx.globalAlpha=clamp(1-fr/MAX,0,1);cx.fillStyle=p.col;
      cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();
    });
    if(fr<MAX)requestAnimationFrame(step);else cx.clearRect(0,0,cv.width,cv.height);
  })();
}

   MODAL
   ================================================================ */
function modal(title,html){
  const d=document.createElement('div');d.className='modal-overlay';d.id='_modal';

  d.addEventListener('click',e=>{if(e.target===d)G.closeModal();});
  document.body.appendChild(d);
}
function closeModal(){const m=document.getElementById('_modal');if(m)m.remove();}
function toast(msg){const d=document.createElement('div');d.textContent=String(msg);d.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;background:var(--ink);color:#fff;padding:10px 14px;border-radius:999px;font-weight:800;font-size:.78rem;box-shadow:0 8px 20px rgba(0,0,0,.2)';document.body.appendChild(d);setTimeout(()=>d.remove(),1500);}

/* ================================================================
   PASS-THE-PHONE ENGINE
   Two phases per player:
     Hand-off screen → Reveal tap → Content → Hide & pass tap
   The content is never auto-shown; requires explicit tap.
   ================================================================ */
let _pq=[],_pi=0,_pcur=null,_pdone=null,_pname=null,_pcontent=null;
function passSequence(items,nameFn,contentFn,onDone){
  _pq=items;_pi=0;_pdone=onDone;_pname=nameFn;_pcontent=contentFn;
  _passHandoff();
}
function _passHandoff(){
  if(_pi>=_pq.length){_pdone();return;}
  _pcur=_pq[_pi];
  $a().innerHTML=
    '<div class="screen"><div class="pass-screen">'+
      '<div class="slabel">Pass the phone — '+(_pi+1)+' of '+_pq.length+'</div>'+
      '<div class="pass-name">📱 → '+esc(_pname(_pcur))+'</div>'+
      '<p class="helptext">Hold the screen away from others until you tap.</p>'+
      '<button class="btn btn-ink btn-block" style="margin-top:16px;" onclick="G._pReveal()">I\'m '+esc(_pname(_pcur))+' — Tap to reveal</button>'+
    '</div></div>';
}
function _pReveal(){
  SFX.reveal();
  const c=_pcontent(_pcur,_pi);
  $a().innerHTML='<div class="screen"><div class="reveal-card">'+c+'<button class="btn btn-ghost btn-block" style="margin-top:18px;" onclick="G._pHide()">Got it — Hide &amp; pass it on</button></div></div>';
}
function _pHide(){_pi++;_passHandoff();}

const G={
  launch(id){SFX.unlock();SFX.click();const gameMap={mafia:Mafia,spy:Spy,ttt:UTTT,dice:LiarsDice,wc:WordChain,tq:TwentyQ,hot:HotTakes,never:NeverHaveI,reaction:ReactionRoyale,emoji:EmojiStory};if(gameMap[id])gameMap[id].start();else SoonGames.start(id);},
  hub(){SFX.click();renderHub();},
  randomGame(){const g=GAMES[Math.floor(Math.random()*GAMES.length)];if(g)this.launch(g.id);},
  confirmLeave(){if(confirm('Leave this game? Progress will be lost.'))this.hub();},
  toggleMute(){const m=!SFX.isMuted();SFX.setMuted(m);document.getElementById('muteBtn').textContent=m?'🔇':'🔊';if(!m)SFX.tap();},

  _pReveal,_pHide
};

/* ================================================================
   ██████████████████ GAME 1: MAFIA ██████████████████
   ================================================================ */
const Mafia=(()=>{
  const RI={
    MAFIA:    {label:'Mafia',    icon:'🎭',color:'var(--c-mafia)',desc:'Work secretly with your team to eliminate one town member each night. During the day, blend in — act innocent, deflect suspicion, and vote off town members.'},
    DETECTIVE:{label:'Detective',icon:'🔍',color:'#2268A8',      desc:'Every night, secretly investigate one player. You\'ll learn if they\'re Mafia or not. Use that intel to steer the town\'s vote — carefully.'},
    DOCTOR:   {label:'Doctor',   icon:'⚕️', color:'var(--ok-deep)',desc:'Each night, choose someone to protect. If the Mafia targets them tonight, they survive. You may protect yourself once.'},
    CIVILIAN: {label:'Civilian', icon:'👤',color:'var(--ink-dim)',desc:'No special power — but you\'re the backbone of the town. Listen, observe, ask good questions, and vote wisely.'}
  };
  let cfg,st,nActions,nQueue;
  let timerOn=false,dayLeft=0,_timerTick=null;

  function defCfg(){return{count:clamp(S.get('m_count',6),4,20),namesText:getRoster(),detective:true,doctor:true,mafiaCount:null,timer:clamp(S.get('m_timer',180),60,600)};}
  function autoM(n){return Math.max(1,0|n/4);}
  function lnk(){return leaveLink('G.confirmLeave');}
  function mhdr(t,s){return hdr(t,s,'Mafia.rules','G.confirmLeave');}

  function start(){cfg=defCfg();setupRender();}

  function setupRender(){
    const mc=cfg.mafiaCount==null?autoM(cfg.count):cfg.mafiaCount;
    const mafiaWarn=mc>=Math.ceil(cfg.count/2)?'<p class="helptext" style="color:var(--bad);text-align:center;margin-top:4px;">⚠️ That\'s a lot of Mafia — the town will struggle.</p>':'';
    $a().innerHTML=
      '<div class="screen">'+hdr('Pass the Phone Mafia','Game setup','Mafia.rules')+
      '<div class="card"><div class="slabel">Players</div><div class="stepper"><button onclick="Mafia.sc(-1)">−</button><div class="val">'+cfg.count+'</div><button onclick="Mafia.sc(1)">+</button></div><p class="helptext" style="text-align:center;">4–20 · best with 6+</p></div>'+
      '<div class="card"><div class="slabel">Names (one per line, optional)</div><textarea placeholder="Leave blank for Player 1, 2…" oninput="Mafia.sn(this.value)">'+esc(cfg.namesText)+'</textarea></div>'+
      '<div class="card">'+
        '<div class="slabel">Special roles</div>'+
        '<div class="switchrow"><div><div class="slbl">🔍 Detective</div><div class="ssub">Investigates one player per night</div></div><button class="switch'+(cfg.detective?' on':'')+'" onclick="Mafia.td()"></button></div>'+
        '<div class="switchrow"><div><div class="slbl">⚕️ Doctor</div><div class="ssub">Protects one player per night</div></div><button class="switch'+(cfg.doctor?' on':'')+'" onclick="Mafia.tdoc()"></button></div>'+
        '<hr class="divider"/>'+
        '<div class="slabel">Mafia count</div>'+
        '<div class="stepper"><button onclick="Mafia.smc(-1)">−</button><div class="val">'+mc+'</div><button onclick="Mafia.smc(1)">+</button></div>'+
        mafiaWarn+
      '</div>'+
      '<div class="card"><div class="slabel">Discussion timer (per day)</div><div class="stepper"><button onclick="Mafia.stc(-30)">−</button><div class="val" style="font-size:1.25rem;">'+fmtTime(cfg.timer)+'</div><button onclick="Mafia.stc(30)">+</button></div></div>'+
      '<button class="btn btn-ink btn-block" onclick="Mafia.assign()">Assign roles & start →</button>'+
      '</div>';
  }

  function sc(d){cfg.count=clamp(cfg.count+d,4,20);if(cfg.mafiaCount!=null)cfg.mafiaCount=clamp(cfg.mafiaCount,1,Math.max(1,0|(cfg.count-1)/2));S.set('m_count',cfg.count);setupRender();}
  function sn(v){cfg.namesText=v;setRoster(v);}
  function td(){cfg.detective=!cfg.detective;setupRender();}
  function tdoc(){cfg.doctor=!cfg.doctor;setupRender();}
  function smc(d){const cur=cfg.mafiaCount==null?autoM(cfg.count):cfg.mafiaCount,max=Math.max(1,0|(cfg.count-1)/2);cfg.mafiaCount=clamp(cur+d,1,max);setupRender();}
  function stc(d){cfg.timer=clamp(cfg.timer+d,60,600);S.set('m_timer',cfg.timer);setupRender();}

  function rules(){modal('Mafia — How to Play',
    '<p>Mafia is a social deduction game. There are two teams: the <b>Town</b> and the <b>Mafia</b>.</p>'+
    '<p><b>Night phase:</b> Mafia secretly choose someone to eliminate. The Doctor can protect someone. The Detective investigates one player.</p>'+
    '<p><b>Day phase:</b> Everyone discusses who they think is Mafia, then votes to eliminate one player.</p>'+
    '<p><b>Win conditions:</b> Town wins when all Mafia are eliminated. Mafia wins when they equal or outnumber the rest of the town.</p>'+
    '<p class="helptext">Pass the phone to each player in private for role reveals. Never show the screen to the group!</p>'
  );}

  function assign(){
    timerOn=false;clearTimeout(_timerTick);
    const names=parseNames(cfg.namesText,cfg.count);
    const mc=cfg.mafiaCount==null?autoM(cfg.count):cfg.mafiaCount;
    let roles=[];
    for(let i=0;i<mc;i++)roles.push('MAFIA');
    if(cfg.detective)roles.push('DETECTIVE');
    if(cfg.doctor)roles.push('DOCTOR');
    while(roles.length<names.length)roles.push('CIVILIAN');
    roles=shuffle(roles);
    st={players:names.map((n,i)=>({id:i,name:n,role:roles[i],alive:true})),night:1,day:0,log:[],doctorSelfUsed:false};
    passSequence(
      st.players,
      p=>p.name,
      p=>{
        const info=RI[p.role];
        let extra='';
        if(p.role==='MAFIA'){
          const t=st.players.filter(x=>x.role==='MAFIA'&&x.id!==p.id).map(x=>x.name);
          extra=t.length?'<p class="helptext"><b>Your fellow Mafia:</b> '+t.map(esc).join(', ')+'</p>':'<p class="helptext">You are the <b>only Mafia</b> this round.</p>';
        }
        return '<div style="font-size:2.6rem;">'+info.icon+'</div>'+
          '<div class="slabel" style="margin:6px 0 2px;">'+esc(p.name)+', your role is</div>'+
          '<div style="font-size:1.65rem;font-weight:800;color:'+info.color+';">'+info.label+'</div>'+
          '<p class="helptext" style="margin-top:10px;">'+info.desc+'</p>'+extra;
      },
      nightStart
    );
  }

  /* ---- NIGHT ---- */
  let _nActor=null,_nType=null;
  function nightStart(){
    nActions={};nQueue=[];
    $a().innerHTML=
      '<div class="screen"><div class="deskcard" style="padding:40px 20px;">'+
        '<div style="font-size:2.5rem;">🌙</div>'+
        '<div style="font-size:1.35rem;font-weight:800;margin:8px 0;">Night '+st.night+'</div>'+
        '<p class="helptext">Everyone, put your heads down or look away. Pass the phone when prompted.</p>'+
        '<button class="btn btn-ink btn-block" style="margin-top:16px;" onclick="Mafia.nightQ()">Begin night actions →</button>'+
      '</div>'+lnk()+'</div>';
  }
  function nightQ(){
    nQueue=[];
    const aM=st.players.filter(p=>p.alive&&p.role==='MAFIA');
    const doc=st.players.find(p=>p.alive&&p.role==='DOCTOR');
    const det=st.players.find(p=>p.alive&&p.role==='DETECTIVE');
    if(aM.length)nQueue.push({type:'MAFIA',actors:aM});
    if(doc)nQueue.push({type:'DOCTOR',actors:[doc]});
    if(det)nQueue.push({type:'DETECTIVE',actors:[det]});
    nextNQ();
  }
  function nextNQ(){
    if(!nQueue.length){resolveNight();return;}
    const step=nQueue.shift();_nActor=step;_nType=step.type;
    const labels={MAFIA:'🎭 Mafia',DOCTOR:'⚕️ Doctor',DETECTIVE:'🔍 Detective'};
    const names=step.actors.map(a=>a.name).join(' & ');
    $a().innerHTML=
      '<div class="screen"><div class="pass-screen">'+
        '<div class="slabel">Pass the phone to the</div>'+
        '<div class="pass-name">'+labels[_nType]+'</div>'+
        '<p class="helptext">('+esc(names)+')</p>'+
        '<button class="btn btn-ink btn-block" style="margin-top:16px;" onclick="Mafia.nReveal()">Reveal</button>'+
      '</div></div>';
  }
  function nReveal(){
    SFX.reveal();
    const alive=st.players.filter(p=>p.alive);
    if(_nType==='MAFIA'){
      const targets=alive.filter(p=>p.role!=='MAFIA');
      $a().innerHTML='<div class="screen">'+targetPicker('Choose who to eliminate tonight',targets,'Mafia.nKill')+'</div>';
    }else if(_nType==='DOCTOR'){
      const saveTargets=alive.filter(p=>!(p.id===_nActor.actors[0].id&&st.doctorSelfUsed));
      $a().innerHTML='<div class="screen">'+targetPicker('Choose who to protect tonight',saveTargets,'Mafia.nSave')+'</div>';
    }else{
      const targets=alive.filter(p=>p.id!==_nActor.actors[0].id);
      $a().innerHTML='<div class="screen">'+targetPicker('Choose who to investigate',targets,'Mafia.nInvest')+'</div>';
    }
  }
  function targetPicker(title,players,fn){
    return '<div class="reveal-card" style="text-align:left;">'+
      '<div class="slabel" style="text-align:center;">'+esc(title)+'</div>'+
      '<div class="llist" style="margin-top:10px;">'+
        players.map(p=>'<div class="lrow" onclick="'+fn+'('+p.id+')"><div class="avatar">'+esc((p.name[0]||'?').toUpperCase())+'</div><div class="rname">'+esc(p.name)+'</div></div>').join('')+
      '</div></div>';
  }
  function nKill(id){nActions.kill=id;nextNQ();}
  function nSave(id){const doc=_nActor&&_nActor.actors?_nActor.actors[0]:null;if(doc&&doc.id===id)st.doctorSelfUsed=true;nActions.save=id;nextNQ();}
  function nInvest(id){
    const t=st.players.find(p=>p.id===id);
    const isM=t.role==='MAFIA';
    isM ? SFX.fail() : SFX.success();
    $a().innerHTML=
      '<div class="screen"><div class="reveal-card">'+
        '<div class="slabel" style="text-align:center;">Investigation result</div>'+
        '<div style="font-size:1.5rem;font-weight:800;margin:10px 0;color:'+(isM?'var(--c-mafia)':'var(--ok-deep)')+';">'+esc(t.name)+' is '+(isM?'MAFIA 🎭':'NOT Mafia ✅')+'</div>'+
        '<button class="btn btn-ghost btn-block" style="margin-top:14px;" onclick="Mafia.nHide()">Hide & pass it on</button>'+
      '</div></div>';
  }
  function nHide(){nextNQ();}

  function resolveNight(){
    let dead=null;
    if(nActions.kill!=null&&nActions.kill!==nActions.save){
      dead=st.players.find(p=>p.id===nActions.kill);
      dead.alive=false;
      st.log.push('Night '+st.night+': '+dead.name+' was eliminated ('+RI[dead.role].label+').');
    }else{
      st.log.push('Night '+st.night+': No one was eliminated.');
    }
    dead?SFX.fail():SFX.success();
    $a().innerHTML=
      '<div class="screen"><div class="deskcard" style="padding:36px 20px;">'+
        '<div style="font-size:2.2rem;">☀️</div>'+
        '<div class="slabel" style="margin:6px 0;">Morning announcement</div>'+
        (dead
          ?'<div style="font-size:1.25rem;font-weight:800;margin:4px 0;">💀 '+esc(dead.name)+' was eliminated</div><p class="helptext">They were the <b>'+RI[dead.role].label+'</b>.</p>'
          :'<div style="font-size:1.25rem;font-weight:800;margin:4px 0;">😌 Everyone survived the night</div>')+
        '<button class="btn btn-ink btn-block" style="margin-top:16px;" onclick="Mafia.morningCheck()">Continue →</button>'+
      '</div>'+lnk()+'</div>';
  }

  function checkWin(){
    const aM=st.players.filter(p=>p.alive&&p.role==='MAFIA').length;
    const aT=st.players.filter(p=>p.alive&&p.role!=='MAFIA').length;
    if(aM===0)return'TOWN';if(aM>=aT)return'MAFIA';return null;
  }
  function morningCheck(){const w=checkWin();if(w)return endScreen(w);st.day++;dayPhase();}

  /* ---- DAY ---- */
  function dayPhase(){
    dayLeft=cfg.timer;timerOn=false;
    const alive=st.players.filter(p=>p.alive);
    const nMafia=st.players.filter(p=>p.alive&&p.role==='MAFIA').length;
    $a().innerHTML=
      '<div class="screen">'+mhdr('Day '+st.day,'Discuss — who is Mafia?')+
        '<div class="card" style="text-align:center;">'+
          '<p class="helptext" style="margin-bottom:4px;">'+alive.length+' players alive · '+nMafia+' Mafia remain</p>'+
          '<p class="helptext" style="margin-bottom:10px;">Discuss out loud, then vote someone out.</p>'+
          '<div class="timer-disp" id="mTimer">'+fmtTime(dayLeft)+'</div>'+
          '<div class="brow" style="margin-top:14px;">'+
            '<button class="btn btn-ghost" id="mTimerBtn" onclick="Mafia.timerToggle()">Start</button>'+
            '<button class="btn btn-accent" onclick="Mafia.vote()">Vote now</button>'+
          '</div>'+
        '</div>'+
        '<div class="card"><div class="slabel">Alive players</div><div class="llist">'+
          st.players.filter(p=>p.alive).map(p=>'<div class="lrow" style="cursor:default;"><div class="avatar">'+esc((p.name[0]||'?').toUpperCase())+'</div><div class="rname">'+esc(p.name)+'</div></div>').join('')+
        '</div></div>'+
      lnk()+'</div>';
  }
  function timerToggle(){
    timerOn=!timerOn;
    const b=document.getElementById('mTimerBtn');if(b)b.textContent=timerOn?'Pause':'Start';
    if(timerOn)tick();
  }
  function tick(){
    if(!timerOn)return;
    dayLeft=Math.max(0,dayLeft-1);
    const el=document.getElementById('mTimer');
    if(el){el.textContent=fmtTime(dayLeft);el.classList.toggle('urgent',dayLeft<=30&&dayLeft>0);}
    if(dayLeft<=0){timerOn=false;SFX.bad();vote();return;}
    _timerTick=setTimeout(tick,1000);
  }
  function vote(){
    timerOn=false;clearTimeout(_timerTick);
    const alive=st.players.filter(p=>p.alive);
    $a().innerHTML=
      '<div class="screen">'+mhdr('Vote','Who is eliminated?')+
        '<div class="card"><div class="slabel">Tap to eliminate — '+alive.length+' players remain</div>'+
          '<div class="llist">'+alive.map(p=>'<div class="lrow" onclick="Mafia.voteOn('+p.id+')"><div class="avatar">'+esc((p.name[0]||'?').toUpperCase())+'</div><div class="rname">'+esc(p.name)+'</div></div>').join('')+'</div>'+
        '</div>'+
        '<button class="btn btn-ghost btn-block" onclick="Mafia.skipVote()">No consensus — skip elimination</button>'+
      lnk()+'</div>';
  }
  function voteOn(id){
    const p=st.players.find(x=>x.id===id);
    if(!confirm('Eliminate '+p.name+'? This can\'t be undone.'))return;
    p.alive=false;SFX.fail();
    st.log.push('Day '+st.day+': '+p.name+' was voted out ('+RI[p.role].label+').');
    $a().innerHTML=
      '<div class="screen"><div class="deskcard">'+
        '<div style="font-size:2rem;">⚖️</div>'+
        '<div style="font-size:1.25rem;font-weight:800;margin:8px 0;">'+esc(p.name)+' eliminated</div>'+
        '<p class="helptext">They were the <b>'+RI[p.role].label+'</b>.</p>'+
        '<button class="btn btn-ink btn-block" style="margin-top:14px;" onclick="Mafia.afterVote()">Continue →</button>'+
      '</div>'+lnk()+'</div>';
  }
  function skipVote(){st.log.push('Day '+st.day+': Town couldn\'t agree — no elimination.');afterVote();}
  function afterVote(){const w=checkWin();if(w)return endScreen(w);st.night++;nightStart();}

  /* ---- END ---- */
  function endScreen(winner){
    SFX.win();burst();
    const mf=st.players.filter(p=>p.role==='MAFIA').map(p=>p.name);
    $a().innerHTML=
      '<div class="screen">'+
        '<div class="deskcard" style="margin-bottom:14px;">'+
          '<div style="font-size:2.5rem;">'+(winner==='TOWN'?'🏆':'🎭')+'</div>'+
          '<div style="font-size:1.55rem;font-weight:800;margin:6px 0;color:'+(winner==='TOWN'?'var(--ok-deep)':'var(--c-mafia)')+';">'+(winner==='TOWN'?'Town wins!':'Mafia wins!')+'</div>'+
          '<p class="helptext">Mafia were: <b>'+mf.map(esc).join(', ')+'</b></p>'+
        '</div>'+
        '<div class="card"><div class="slabel">Final roles</div><div class="llist">'+
          st.players.map(p=>'<div class="lrow" style="cursor:default;"><div class="avatar">'+esc((p.name[0]||'?').toUpperCase())+'</div><div class="rname">'+esc(p.name)+(p.alive?'':'  💀')+'</div><span class="pill">'+RI[p.role].icon+' '+RI[p.role].label+'</span></div>').join('')+
        '</div></div>'+
        '<div class="card"><div class="slabel">Game log</div>'+st.log.map(l=>'<p class="helptext" style="margin:3px 0;">• '+esc(l)+'</p>').join('')+'</div>'+
        '<div class="brow"><button class="btn btn-ink" style="flex:1;" onclick="Mafia.replay()">Play again</button><button class="btn btn-ghost" style="flex:1;" onclick="Mafia.start()">New setup</button></div>'+
      '</div>';
  }
  function replay(){assign();}

  return{start,rules,sc,sn,td,tdoc,smc,stc,assign,nightQ,nReveal,nKill,nSave,nInvest,nHide,morningCheck,timerToggle,vote,voteOn,skipVote,afterVote,replay};
})();

  );}

  function currentPlayer(){return st.players.find(p=>p.alive&&p.id===st.turnId)||st.players.find(p=>p.alive)||null;}
  function nextAliveId(afterId){
    const all=st.players,idx=all.findIndex(p=>p.id===afterId);
    if(idx<0)return st.players.find(p=>p.alive)?.id??null;
    for(let step=1;step<=all.length;step++){const p=all[(idx+step+all.length)%all.length];if(p.alive)return p.id;}
    return null;
  }

  function deal(){
    const names=parseNames(cfg.namesText,cfg.count);
    const loc=nextLocation();
    const spyIdx=0|Math.random()*names.length;
    const roles=shuffle(loc.r);
    st={
      players:names.map((n,i)=>({id:i,name:n,isSpy:i===spyIdx,role:roles[i]||roles[i%roles.length]})),
      loc,spyId:spyIdx
    };
    passSequence(
      st.players,
      p=>p.name,
      p=>{
        if(p.isSpy)return(
          '<div style="font-size:2.6rem;">🕵️</div>'+
          '<div class="slabel" style="margin:8px 0 3px;">'+esc(p.name)+', you are the</div>'+

          '<p class="helptext" style="margin-top:10px;">You don\'t know the location. Listen to answers, ask vague questions, and try to figure it out — or just stay hidden until time runs out.</p>'

          '<div style="font-size:2.4rem;">📍</div>'+
          '<div class="slabel" style="margin:8px 0 3px;">'+esc(p.name)+', the location is</div>'+

          '<div style="font-size:1.5rem;font-weight:800;margin:6px 0;color:'+m[3]+';">'+m[1]+'</div>'+
          '<p class="helptext">'+m[2]+'</p>'+
          '<p class="helptext" style="margin-top:6px;">The location was <b>'+esc(st.loc.n)+'</b>. The Spy was <b>'+esc(spy.name)+'</b>.</p>'+
        '</div>'+
        '<div class="card"><div class="slabel">Everyone\'s role</div><div class="llist">'+
          st.players.map(p=>'<div class="lrow" style="cursor:default;"><div class="avatar">'+esc((p.name[0]||'?').toUpperCase())+'</div><div class="rname">'+esc(p.name)+'</div><span class="pill">'+(p.isSpy?'🕵️ Spy':esc(p.role))+'</span></div>').join('')+
        '</div></div>'+
        '<div class="brow"><button class="btn btn-ink" style="flex:1;" onclick="Spy.deal()">Play again</button><button class="btn btn-ghost" style="flex:1;" onclick="Spy.start()">New setup</button></div>'+
      '</div>';
  }

  return{start,rules,sc,sn,stc,deal,timerToggle,accuse,accuseOn,spyPass,spyGuess,spyPick,spyPickIndex,nextPrompt};
})();

/* ================================================================
   ██████████████████ GAME 3: ULTIMATE TIC-TAC-TOE ██████████████████
   Ultimate Tic-Tac-Toe rules:
   • 9 mini-boards arranged in a 3×3 meta-board.
   • Your move's position in a mini-board dictates which meta-cell
     the next player MUST play in.
   • Win a mini-board to claim it on the meta. Win 3 meta in a row
     to win the game. If sent to a won/full board → play anywhere.
   ================================================================ */
const UTTT=(()=>{
  // Board state: metaBoard[0-8] = who won mini ('X','O','D',null)
  // miniBoards[0-8][0-8] = cell owner ('X','O',null)
  // active = which meta-cell is forced (null = anywhere)
  // turn = 'X' or 'O'
  const WIN_LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  let st,p1,p2,scores={X:0,O:0,D:0};
  let scoreRecorded=false;

  function checkMini(cells){
    for(const[a,b,c]of WIN_LINES)if(cells[a]&&cells[a]===cells[b]&&cells[a]===cells[c])return cells[a];
    if(cells.every(x=>x))return'D';
    return null;
  }
  function checkMeta(mb){
    for(const[a,b,c]of WIN_LINES)if(mb[a]&&mb[a]!=='D'&&mb[a]===mb[b]&&mb[a]===mb[c])return mb[a];
    if(mb.every(x=>x))return'D';
    return null;
  }
  function initState(){
    return{
      meta:Array(9).fill(null),
      mini:Array.from({length:9},()=>Array(9).fill(null)),
      active:null,turn:'X',winner:null,moveCount:0,
      lastMove:{meta:-1,cell:-1}
    };
  }

  function start(){
    scores={X:0,O:0,D:0};p1=null;p2=null;
    // Ask for player names
    const r=getRoster();const ns=parseNames(r,2);
    p1=ns[0];p2=ns[1];
    $a().innerHTML=
      '<div class="screen">'+hdr('Ultimate Tic-Tac-Toe','2 players')+
        '<div class="card">'+
          '<div class="slabel">Player names</div>'+
          '<div style="display:flex;flex-direction:column;gap:10px;margin-top:4px;">'+
            '<div style="display:flex;align-items:center;gap:10px;"><div style="width:28px;height:28px;border-radius:50%;background:var(--c-mafia);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;">X</div><input id="ttt_p1" value="'+esc(p1)+'" placeholder="Player 1"/></div>'+
            '<div style="display:flex;align-items:center;gap:10px;"><div style="width:28px;height:28px;border-radius:50%;background:var(--c-spy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;">O</div><input id="ttt_p2" value="'+esc(p2)+'" placeholder="Player 2"/></div>'+
          '</div>'+
        '</div>'+
        '<div class="card"><div class="slabel">How to play</div>'+
          '<p class="helptext">There are 9 mini boards inside a big board. Win 3 mini boards in a row to win. <b>The cell you pick in a mini board sends your opponent to that same-position board.</b> If that board is full or won, they can play anywhere.</p>'+
        '</div>'+
        '<button class="btn btn-ink btn-block" onclick="UTTT.begin()">Play →</button>'+
      '</div>';
  }

  function begin(){
    const i1=document.getElementById('ttt_p1'),i2=document.getElementById('ttt_p2');
    if(i1) p1=i1.value.trim()||'Player 1';
    if(i2) p2=i2.value.trim()||'Player 2';
    if(!p1) p1='Player 1';
    if(!p2) p2='Player 2';
    st=initState();scoreRecorded=false;render();
  }
  function rematch(){st=initState();scoreRecorded=false;render();}

  const POS=['top-left','top-center','top-right','mid-left','center','mid-right','bot-left','bot-center','bot-right'];
  function currentName(){return st.turn==='X'?p1:p2;}

  function render(){
    if(st.winner)return renderEnd();
    const turnColor=st.turn==='X'?'var(--c-mafia)':'var(--c-spy)';
    const turnName=currentName();

    // Status bar text
    let statusText;
    if(st.active===null)statusText='<b style="color:'+turnColor+';">'+esc(turnName)+'</b> — play in any open board';
    else statusText='<b style="color:'+turnColor+';">'+esc(turnName)+'</b> — play in <b>'+POS[st.active]+'</b> board ↓';

    let metaHtml='<div class="meta-wrap"><div class="meta-board">';
    for(let m=0;m<9;m++){
      const isActive=st.meta[m]===null&&(st.active===null||st.active===m);
      let cls='meta-cell';
      if(st.meta[m]==='X')cls+=' won-X';
      else if(st.meta[m]==='O')cls+=' won-O';
      else if(st.meta[m]==='D')cls+=' drawn-meta';
      else if(isActive)cls+=' active-zone';

      let inner='';
      if(st.meta[m]==='X'){inner='<div class="meta-cell-won-mark cx">X</div>';}
      else if(st.meta[m]==='O'){inner='<div class="meta-cell-won-mark co">O</div>';}
      else if(st.meta[m]==='D'){inner='<div class="meta-cell-won-mark cd">draw</div>';}
      else{
        inner='<div class="mini-board">';
        for(let c=0;c<9;c++){
          const val=st.mini[m][c];
          const canClick=isActive&&val===null;
          const isLast=m===st.lastMove.meta&&c===st.lastMove.cell;
          let mcls='mini-cell';
          if(val==='X')mcls+=' cx';
          else if(val==='O')mcls+=' co';
          if(!canClick)mcls+=' blocked';
          if(isLast)mcls+=' last';
          const onclick=canClick?'onclick="UTTT.place('+m+','+c+')"':'';
          inner+='<div class="'+mcls+'" '+onclick+'>'+(val||'')+'</div>';
        }
        inner+='</div>';
      }
      metaHtml+='<div class="'+cls+'">'+inner+'</div>';
    }
    metaHtml+='</div></div>';
    $a().innerHTML=
      '<div class="screen">'+
        hdr('Ultimate Tic-Tac-Toe',esc(turnName)+' · move '+(st.moveCount+1))+
        '<div class="ttt-legend">'+
          '<div class="ttt-chip cx">✕ '+esc(p1)+' <span style="opacity:.55;font-weight:600;">'+scores.X+'</span></div>'+
          '<div class="ttt-chip co">○ '+esc(p2)+' <span style="opacity:.55;font-weight:600;">'+scores.O+'</span></div>'+
        '</div>'+
        '<div class="card card-tight"><div class="uttt-status">'+statusText+'</div>'+metaHtml+'</div>'+
        '<div class="helptext" style="text-align:center;margin:8px 0;">Tap any highlighted mini-cell. Your move sends the next player to the same-position board.</div>'+
        '<div class="brow" style="margin-top:10px;"><button class="btn btn-ghost btn-sm" onclick="UTTT.start()">New game</button><button class="btn btn-ghost btn-sm" onclick="G.confirmLeave()">← Hub</button></div>'+
      '</div>';
  }

  function place(meta,cell){
    if(st.winner)return;
    if(st.meta[meta]!==null)return;
    if(st.active!==null&&st.active!==meta)return;
    if(st.mini[meta][cell]!==null)return;
    SFX.place();

    // Place piece
    st.mini[meta][cell]=st.turn;
    st.moveCount++;
    st.lastMove={meta,cell};

    // Check if mini board is won
    const miniWin=checkMini(st.mini[meta]);
    if(miniWin)st.meta[meta]=miniWin;

    // Determine next active board
    let next=cell;
    if(st.meta[next]!==null)next=null; // that board is done → play anywhere

    // Check global win
    const globalWin=checkMeta(st.meta);
    if(globalWin){st.winner=globalWin;render();return;}

    // If all meta cells decided → draw
    if(st.meta.every(x=>x)){st.winner='D';render();return;}

    // Switch turn
    st.turn=st.turn==='X'?'O':'X';
    st.active=next;
    render();
  }

  function renderEnd(){
    if(!scoreRecorded){if(scores[st.winner]!==undefined)scores[st.winner]++;else scores.D++;scoreRecorded=true;}
    SFX.win();burst();
    const isDraw=st.winner==='D';
    const winnerName=st.winner==='X'?p1:st.winner==='O'?p2:null;
    const col=st.winner==='X'?'var(--c-mafia)':st.winner==='O'?'var(--c-spy)':'var(--ink-dim)';

    let metaHtml='<div class="meta-wrap"><div class="meta-board">';
    for(let m=0;m<9;m++){
      let cls='meta-cell';
      if(st.meta[m]==='X')cls+=' won-X';
      else if(st.meta[m]==='O')cls+=' won-O';
      else if(st.meta[m]==='D')cls+=' drawn-meta';
      let inner='';
      if(st.meta[m]==='X')inner='<div class="meta-cell-won-mark cx">X</div>';
      else if(st.meta[m]==='O')inner='<div class="meta-cell-won-mark co">O</div>';
      else if(st.meta[m]==='D')inner='<div class="meta-cell-won-mark cd">draw</div>';
      else{
        inner='<div class="mini-board">';
        for(let c=0;c<9;c++){
          const v=st.mini[m][c];
          inner+='<div class="mini-cell blocked '+(v==='X'?'cx':v==='O'?'co':'')+'">'+( v||'')+'</div>';
        }
        inner+='</div>';
      }
      metaHtml+='<div class="'+cls+'">'+inner+'</div>';
    }
    metaHtml+='</div></div>';

    $a().innerHTML=
        '<div class="deskcard" style="margin-bottom:14px;">'+
          '<div style="font-size:2.4rem;">'+(isDraw?'🤝':(st.winner==='X'?'✕':'○'))+'</div>'+
          '<div style="font-size:1.5rem;font-weight:800;margin:6px 0;color:'+col+';">'+
            (isDraw?'It\'s a draw!':esc(winnerName)+' wins!')+'</div>'+
          '<p class="helptext" style="margin:4px 0 10px;">'+(isDraw?'No one claimed three boards.':'Congratulations!')+'</p>'+
          '<div style="display:flex;gap:8px;justify-content:center;font-family:var(--fmono);font-size:.85rem;font-weight:800;">'+
            '<span class="ttt-chip cx">✕ '+esc(p1)+' '+scores.X+'</span>'+
            (scores.D?'<span class="pill">Draws '+scores.D+'</span>':'')+
            '<span class="ttt-chip co">○ '+esc(p2)+' '+scores.O+'</span>'+
          '</div>'+
        '</div>'+
        '<div class="card card-tight">'+metaHtml+'</div>'+
        '<div class="brow" style="margin-top:12px;">'+
          '<button class="btn btn-ink" style="flex:1;" onclick="UTTT.rematch()">Play again</button>'+
          '<button class="btn btn-ghost" style="flex:1;" onclick="G.hub()">Hub</button>'+
        '</div>'+
      '</div>';
  }

  return{start,begin,rematch,place};
})();

/* ================================================================
   ██████ GAME 4: LIAR'S DICE ██████
   Roll privately, bid on totals across all dice, call bluffs.
   ================================================================ */
const LiarsDice=(()=>{
  const D=['⚀','⚁','⚂','⚃','⚄','⚅'];
  let cfg,st,_bidCount=1,_bidFace=1,_resPlayers=[],_rCount=0,_rMax=5;

  function defCfg(){return{count:clamp(S.get('ld_count',4),2,8),dice:clamp(S.get('ld_dice',5),3,5),namesText:getRoster()};}
  function lnk(){return leaveLink('G.confirmLeave');}

  function start(){cfg=defCfg();setupRender();}

  function setupRender(){
    $a().innerHTML=
      '<div class="screen">'+hdr('Liar\'s Dice','Setup')+
      '<div class="card"><div class="slabel">Players</div>'+
        '<div class="stepper"><button onclick="LiarsDice.sc(-1)">−</button><div class="val">'+cfg.count+'</div><button onclick="LiarsDice.sc(1)">+</button></div>'+
        '<p class="helptext" style="text-align:center;">2–8 players</p></div>'+
      '<div class="card"><div class="slabel">Dice per player</div>'+
        '<div class="stepper"><button onclick="LiarsDice.sd(-1)">−</button><div class="val">'+cfg.dice+'</div><button onclick="LiarsDice.sd(1)">+</button></div></div>'+
      '<div class="card"><div class="slabel">Names (one per line, optional)</div>'+
        '<textarea placeholder="Leave blank for Player 1, 2…" oninput="LiarsDice.sn(this.value)">'+esc(cfg.namesText)+'</textarea></div>'+
      '<div class="card"><div class="slabel">How to play</div>'+
        '<p class="helptext">Everyone rolls secretly. Players take turns bidding how many dice of a certain face exist across ALL dice. Call <b>Liar!</b> if you think the bid is impossible. Reveal counts — wrong bidder or caller loses a die. Last player with dice wins!</p></div>'+
      '<button class="btn btn-ink btn-block" onclick="LiarsDice.deal()">Roll &amp; start →</button>'+
      '</div>';
  }
  function sc(d){cfg.count=clamp(cfg.count+d,2,8);S.set('ld_count',cfg.count);setupRender();}
  function sd(d){cfg.dice=clamp(cfg.dice+d,3,5);S.set('ld_dice',cfg.dice);setupRender();}
  function sn(v){cfg.namesText=v;setRoster(v);}

  function roll(n){return Array.from({length:n},()=>1+Math.floor(Math.random()*6));}
  function currentPlayer(){return st.players.find(p=>p.alive&&p.id===st.currentTurn)||st.players.find(p=>p.alive)||null;}
  function nextAliveId(afterId){
    const all=st.players,idx=all.findIndex(p=>p.id===afterId);
    if(!all.length)return null;
    for(let step=1;step<=all.length;step++){const p=all[(idx+step+all.length)%all.length];if(p.alive)return p.id;}
    return null;
  }

  function currentPlayer(){return st.players.find(p=>p.alive&&p.id===st.turnId)||st.players.find(p=>p.alive)||null;}
  function nextAliveId(afterId){
    const all=st.players,idx=all.findIndex(p=>p.id===afterId);
    if(idx<0)return st.players.find(p=>p.alive)?.id??null;
    for(let step=1;step<=all.length;step++){const p=all[(idx+step+all.length)%all.length];if(p.alive)return p.id;}
    return null;
  }

  function deal(){
    const names=parseNames(cfg.namesText,cfg.count);
    st={players:names.map((n,i)=>({id:i,name:n,dice:roll(cfg.dice),alive:true})),maxDice:cfg.dice,currentBid:null,bidderId:null,currentTurn:0,round:1,_resIdx:0,_resCounts:[],challengerId:null};
    rollPhase();
  }

  function rollPhase(){
    passSequence(
      st.players.filter(p=>p.alive),
      p=>p.name,
      p=>'<div class="slabel" style="text-align:center;">'+esc(p.name)+' — your '+p.dice.length+' dice</div>'+
         '<div class="dice-grid">'+p.dice.map(d=>'<div class="die">'+D[d-1]+'</div>').join('')+'</div>'+
         '<p class="helptext">Remember your dice — hide this before passing.</p>',
      biddingPhase
    );
  }

  function biddingPhase(){renderBidding();}

  function renderBidding(){
    const bid=st.currentBid;
    const cur=currentPlayer();
    if(cur)st.currentTurn=cur.id;
    const bidStr=bid?'<span style="font-size:2.2rem;font-weight:900;">'+bid.count+' × '+D[bid.face-1]+'</span>':'<span style="color:var(--ink-faint);font-style:italic;">No bid yet</span>';
    const alive=st.players.filter(p=>p.alive);
    $a().innerHTML=
      '<div class="screen">'+hdr('Liar\'s Dice','Round '+st.round,null,'G.confirmLeave')+
      '<div class="card" style="text-align:center;">'+
        '<div class="pill" style="margin-bottom:7px;">🎲 '+esc(cur?cur.name:'Next player')+' — your turn</div>'+
        '<div class="slabel">Current bid</div>'+
        '<div style="margin:10px 0 4px;">'+bidStr+'</div>'+
      '</div>'+
      '<div class="card"><div class="slabel">Alive ('+alive.length+' players)</div>'+
        '<div class="llist">'+alive.map(p=>'<div class="lrow" style="cursor:default;"><div class="avatar">'+esc((p.name[0]||'?').toUpperCase())+'</div><div class="rname">'+esc(p.name)+'</div><span class="pill">'+p.dice.length+' 🎲</span></div>').join('')+'</div>'+
      '</div>'+
      '<div class="brow">'+
        '<button class="btn btn-ink" style="flex:2;" onclick="LiarsDice.openBidPick()">Raise bid</button>'+
        (bid?'<button class="btn btn-bad" style="flex:1;" onclick="LiarsDice.callLiar()">🚨 Liar!</button>':'')+
      '</div>'+
      lnk()+'</div>';
  }

  function openBidPick(){
    const bid=st.currentBid;
    const totalDice=st.players.filter(p=>p.alive).reduce((s,p)=>s+p.dice.length,0);
    _bidCount=bid?Math.min(totalDice,bid.count+1):1;
    _bidFace=bid?bid.face:1;
    renderBidPick();
  }
  function renderBidPick(){
    const totalDice=st.players.filter(p=>p.alive).reduce((s,p)=>s+p.dice.length,0);
    $a().innerHTML=
      '<div class="screen">'+hdr('Make your bid',null,null,'G.confirmLeave')+
      '<div class="card">'+
        '<div class="slabel">How many?</div>'+
        '<div class="stepper" style="margin:8px 0 16px;"><button onclick="LiarsDice.bc(-1)">−</button><div class="val">'+_bidCount+'</div><button onclick="LiarsDice.bc(1)">+</button></div>'+
        '<div class="slabel">Showing face</div>'+
        '<div class="bid-faces">'+[1,2,3,4,5,6].map(f=>'<button class="face-btn'+(f===_bidFace?' sel':'')+'" onclick="LiarsDice.bf('+f+')">'+D[f-1]+'</button>').join('')+'</div>'+
        '<div class="slabel" style="text-align:center;">Your bid: '+_bidCount+' × '+D[_bidFace-1]+' ('+totalDice+' dice total)</div>'+
        '<div id="bidErr" style="color:var(--bad);font-size:.82rem;font-weight:700;text-align:center;min-height:18px;margin:4px 0;"></div>'+
      '</div>'+
      '<div class="brow">'+
        '<button class="btn btn-ghost" style="flex:1;" onclick="LiarsDice.renderBidding()">Cancel</button>'+
        '<button class="btn btn-ink" style="flex:1;" onclick="LiarsDice.confirmBid()">Bid it</button>'+
      '</div>'+
      '</div>';
  }
  function bc(d){const totalDice=st.players.filter(p=>p.alive).reduce((s,p)=>s+p.dice.length,0);_bidCount=clamp(_bidCount+d,1,Math.max(1,totalDice));renderBidPick();}
  function bf(f){_bidFace=f;renderBidPick();}
  function confirmBid(){
    const bid=st.currentBid;
    const valid=!bid||_bidCount>bid.count||(_bidCount===bid.count&&_bidFace>bid.face);
    if(!valid){
      const el=document.getElementById('bidErr');
      if(el)el.textContent='Must be higher than current bid!';
      return;
    }
    const cur=currentPlayer();if(!cur)return;
    st.currentBid={count:_bidCount,face:_bidFace};
    st.bidderId=cur.id;
    st.currentTurn=nextAliveId(cur.id);
    SFX.tap();renderBidding();
  }

  function callLiar(){
    if(!st.currentBid)return;
    const caller=currentPlayer();if(!caller)return;
    st.challengerId=caller.id;
    const bid=st.currentBid;
    $a().innerHTML=
      '<div class="screen"><div class="deskcard">'+
        '<div style="font-size:2rem;">🚨</div>'+
        '<div style="font-size:1.3rem;font-weight:800;margin:8px 0;">Calling Liar!</div>'+
        '<div style="font-size:1.8rem;font-weight:900;margin:6px 0;">'+bid.count+' × '+D[bid.face-1]+'</div>'+
        '<p class="helptext">Each player will secretly tap how many '+D[bid.face-1]+' they have.</p>'+
        '<div class="brow" style="margin-top:16px;">'+
          '<button class="btn btn-ghost" style="flex:1;" onclick="LiarsDice.renderBidding()">Never mind</button>'+
          '<button class="btn btn-bad" style="flex:1;" onclick="LiarsDice.startRes()">Call it!</button>'+
        '</div>'+
      '</div></div>';
  }
  function startRes(){
    _resPlayers=st.players.filter(p=>p.alive);
    st._resIdx=0;st._resCounts=[];_rCount=0;_rMax=_resPlayers[0]?.dice.length||5;
    showResPlayer();
  }
  function showResPlayer(){
    if(st._resIdx>=_resPlayers.length){showResResult();return;}
    const p=_resPlayers[st._resIdx];
    _rCount=0;_rMax=p.dice.length;
    $a().innerHTML=
      '<div class="screen"><div class="pass-screen">'+
        '<div class="slabel">Pass to '+esc(p.name)+'</div>'+
        '<div style="font-size:3rem;margin:10px 0;">'+D[st.currentBid.face-1]+'</div>'+
        '<div class="slabel">How many of these do you have?</div>'+
        '<div class="stepper" style="margin:16px 0;"><button onclick="LiarsDice.rDown()">−</button><div class="val" id="resC">0</div><button onclick="LiarsDice.rUp()">+</button></div>'+
        '<button class="btn btn-ink btn-block" onclick="LiarsDice.rSubmit()">Submit</button>'+
      '</div></div>';
  }
  function rDown(){_rCount=Math.max(0,_rCount-1);const el=document.getElementById('resC');if(el)el.textContent=_rCount;}
  function rUp(){_rCount=Math.min(_rMax,_rCount+1);const el=document.getElementById('resC');if(el)el.textContent=_rCount;}
  function rSubmit(){
    st._resCounts.push(_rCount);_rCount=0;st._resIdx++;showResPlayer();
  }
  function showResResult(){
    const total=st._resCounts.reduce((a,b)=>a+b,0);
    const bid=st.currentBid;
    const bidTrue=total>=bid.count;
    bidTrue?SFX.success():SFX.fail();
    const breakdown=_resPlayers.map((p,i)=>'<div class="lrow" style="cursor:default;"><div class="avatar">'+D[bid.face-1]+'</div><div class="rname">'+esc(p.name)+'</div><span class="pill">'+st._resCounts[i]+'</span></div>').join('');
    $a().innerHTML=
      '<div class="screen"><div class="deskcard" style="margin-bottom:14px;">'+
        '<div style="font-size:1.5rem;font-weight:800;margin:4px 0;">Bid: '+bid.count+' × '+D[bid.face-1]+'</div>'+
        '<div style="font-size:2.8rem;font-weight:900;margin:6px 0;color:'+(bidTrue?'var(--ok-deep)':'var(--bad)')+';">'+total+' '+D[bid.face-1]+'</div>'+
        '<div style="font-weight:800;color:'+(bidTrue?'var(--ok-deep)':'var(--bad)')+';">'+
          (bidTrue?'✅ Bid TRUE — Caller loses a die!':'❌ Bid FALSE — Bidder loses a die!')+
        '</div>'+
      '</div>'+
      '<div class="card"><div class="slabel">Breakdown</div><div class="llist">'+breakdown+'</div></div>'+
      '<div class="card" style="text-align:center;"><div class="slabel">Automatic result</div>'+
        '<div style="font-weight:800;line-height:1.4;">'+esc(bidTrue?(st.players.find(p=>p.id===st.challengerId)||{}).name:(st.players.find(p=>p.id===st.bidderId)||{}).name)+' loses one die.</div>'+
        '<p class="helptext" style="margin-top:5px;">No arguments, no democracy, no Aloysius required.</p>'+
        '<button class="btn btn-ink btn-block" style="margin-top:10px;" onclick="LiarsDice.applyResult()">Remove die &amp; continue →</button>'+
      '</div>'+
      lnk()+'</div>';
  }
  function applyResult(){
    const bid=st.currentBid;if(!bid)return;
    const total=st._resCounts.reduce((a,b)=>a+b,0);
    const bidTrue=total>=bid.count;
    const loserId=bidTrue?st.challengerId:st.bidderId;
    const p=st.players.find(x=>x.id===loserId);if(!p||!p.alive)return;
    p.dice.pop();if(p.dice.length===0)p.alive=false;
    const alive=st.players.filter(x=>x.alive);
    if(alive.length<=1){endScreen(alive[0]||null);return;}
    alive.forEach(x=>{x.dice=roll(x.dice.length);});
    st.currentBid=null;st.bidderId=null;st.challengerId=null;st.round++;
    st.currentTurn=p.alive?p.id:nextAliveId(p.id);
    rollPhase();
  }
  function loseOne(id){
    // Backward-compatible safety path for stale buttons from older renders.
    const p=st.players.find(x=>x.id===id);if(!p||!p.alive)return;
    p.dice.pop();if(p.dice.length===0)p.alive=false;
    const alive=st.players.filter(x=>x.alive);
    if(alive.length<=1){endScreen(alive[0]||null);return;}
    alive.forEach(x=>{x.dice=roll(x.dice.length);});
    st.currentBid=null;st.bidderId=null;st.challengerId=null;st.round++;st.currentTurn=p.alive?p.id:nextAliveId(p.id);rollPhase();
  }
  function endScreen(winner){
    SFX.win();if(winner)burst();
    $a().innerHTML=
      '<div class="screen"><div class="deskcard" style="margin-bottom:14px;">'+
        '<div style="font-size:2.5rem;">'+(winner?'🎲':'🤝')+'</div>'+
        '<div style="font-size:1.5rem;font-weight:800;margin:6px 0;color:var(--ok-deep);">'+(winner?esc(winner.name)+' wins!':'Draw!')+'</div>'+
        '<p class="helptext">Last one with dice standing!</p>'+
      '</div>'+
      '<div class="brow">'+
        '<button class="btn btn-ink" style="flex:1;" onclick="LiarsDice.deal()">Play again</button>'+
        '<button class="btn btn-ghost" style="flex:1;" onclick="LiarsDice.start()">New setup</button>'+
      '</div>'+
      lnk()+'</div>';
  }
  function replay(){deal();}

  return{start,sc,sd,sn,deal,renderBidding,openBidPick,bc,bf,confirmBid,callLiar,startRes,rDown,rUp,rSubmit,applyResult,loseOne,replay};
})();

/* ================================================================
   ██████ GAME 5: WORD CHAIN BLITZ ██████
   Each word must start with the last letter of the previous.
   Beat the timer or lose a life. Last standing wins.
   ================================================================ */
const WordChain=(()=>{
  let cfg,st,_timerOn=false,_timerTick=null;

  function defCfg(){return{
    count:clamp(S.get('wc_count',4),2,10),
    lives:clamp(S.get('wc_lives',3),1,5),
    timer:clamp(S.get('wc_timer',20),10,30),
    minLen:clamp(S.get('wc_minlen',2),2,6),
    namesText:getRoster()
  };}

  function start(){cfg=defCfg();setupRender();}

  function setupRender(){
    $a().innerHTML=
      '<div class="screen">'+hdr('Word Chain Blitz','Setup','WordChain.rules')+
      '<div class="card"><div class="slabel">Players</div><div class="stepper"><button onclick="WordChain.sc(-1)">−</button><div class="val">'+cfg.count+'</div><button onclick="WordChain.sc(1)">+</button></div></div>'+
      '<div class="card"><div class="slabel">Lives per player</div><div class="stepper"><button onclick="WordChain.sl(-1)">−</button><div class="val">'+cfg.lives+'</div><button onclick="WordChain.sl(1)">+</button></div></div>'+
      '<div class="card"><div class="slabel">Seconds per turn</div><div class="stepper"><button onclick="WordChain.stm(-1)">−</button><div class="val">'+cfg.timer+'</div><button onclick="WordChain.stm(1)">+</button></div></div>'+
      '<div class="card"><div class="slabel">Minimum word length</div><div class="stepper"><button onclick="WordChain.sml(-1)">−</button><div class="val">'+cfg.minLen+'</div><button onclick="WordChain.sml(1)">+</button></div><p class="helptext" style="text-align:center;">Longer words make the chain harder to survive.</p></div>'+
      '<div class="card"><div class="slabel">Names (one per line, optional)</div><textarea placeholder="Leave blank for Player 1, 2…" oninput="WordChain.sn(this.value)">'+esc(cfg.namesText)+'</textarea></div>'+
      '<button class="btn btn-ink btn-block" onclick="WordChain.deal()">Start game →</button>'+
      '</div>';
  }
  function rules(){modal('Word Chain Blitz — Rules',
    '<p>Take turns saying words. Each word must <b>start with the last letter</b> of the previous word.</p>'+
    '<ul><li>No repeating words</li><li>Must start with the highlighted letter</li><li>Beat the timer or lose a life</li><li>Lose all lives = eliminated</li></ul><p>Last player standing wins!</p>'
  );}
  function sc(d){cfg.count=clamp(cfg.count+d,2,10);S.set('wc_count',cfg.count);setupRender();}
  function sl(d){cfg.lives=clamp(cfg.lives+d,1,5);S.set('wc_lives',cfg.lives);setupRender();}
  function stm(d){cfg.timer=clamp(cfg.timer+d,10,30);S.set('wc_timer',cfg.timer);setupRender();}
  function sml(d){cfg.minLen=clamp(cfg.minLen+d,2,6);S.set('wc_minlen',cfg.minLen);setupRender();}
  function sn(v){cfg.namesText=v;setRoster(v);}

  function currentPlayer(){return st.players.find(p=>p.alive&&p.id===st.turnId)||st.players.find(p=>p.alive)||null;}
  function nextAliveId(afterId){
    const all=st.players,idx=all.findIndex(p=>p.id===afterId);
    if(idx<0)return st.players.find(p=>p.alive)?.id??null;
    for(let step=1;step<=all.length;step++){const p=all[(idx+step+all.length)%all.length];if(p.alive)return p.id;}
    return null;
  }

  function deal(){
    const names=parseNames(cfg.namesText,cfg.count);
    st={players:names.map((n,i)=>({id:i,name:n,lives:cfg.lives,alive:true})),lastLetter:null,wordLog:[],usedWords:new Set(),turnId:0,timeLeft:cfg.timer,longest:0};
    render();startTimer();
  }

  function stopTimer(){_timerOn=false;clearTimeout(_timerTick);}
  function startTimer(){stopTimer();_timerOn=true;tickWC();}
  function tickWC(){
    if(!_timerOn)return;
    st.timeLeft=Math.max(0,st.timeLeft-1);
    const el=document.getElementById('wcTimer');
    if(!el){_timerOn=false;return;}
    el.textContent=fmtTime(st.timeLeft);
    el.classList.toggle('urgent',st.timeLeft<=10&&st.timeLeft>0);
    if(st.timeLeft<=0){
      _timerOn=false;SFX.bad();
      const cur=currentPlayer();
      if(cur)penalize(cur,'Time\'s up!');
      return;
    }
    _timerTick=setTimeout(tickWC,1000);
  }

  function render(){
    const alive=st.players.filter(p=>p.alive);
    const cur=currentPlayer();
    if(!cur){cont();return;}
    st.turnId=cur.id;
    const req=st.lastLetter;
    $a().innerHTML=
      '<div class="screen">'+hdr('Word Chain',null,'WordChain.rules','G.confirmLeave')+
      '<div class="card" style="text-align:center;padding-bottom:10px;">'+
        (st.wordLog.length?'<div class="helptext" style="margin-bottom:4px;">Last: <b>'+esc(st.wordLog[st.wordLog.length-1])+'</b></div>':'')+
        '<div class="slabel" style="margin-bottom:4px;">Start with</div>'+
        '<div class="wc-letter">'+(req?req.toUpperCase():'🔤')+'</div>'+
        '<div style="font-weight:800;font-size:1rem;margin:6px 0 10px;color:var(--ink-dim);">'+esc(cur.name)+'\'s turn</div>'+
        '<input id="wcInput" placeholder="type your word…" autocomplete="off" autocorrect="off" spellcheck="false" style="font-size:1.1rem;margin-bottom:10px;" onkeyup="if(event.key===\'Enter\')WordChain.submit()"/>'+
        '<div class="brow">'+
          '<button class="btn btn-ghost btn-sm" onclick="WordChain.skipTurn()">💀 Skip</button>'+
          '<button class="btn btn-ink" style="flex:1;" onclick="WordChain.submit()">Submit →</button>'+
        '</div>'+
        '<div class="timer-disp" id="wcTimer" style="margin-top:10px;font-size:2rem;">'+fmtTime(st.timeLeft)+'</div>'+
      '</div>'+
      (st.wordLog.length?
        '<div class="card"><div class="slabel">Chain ('+st.wordLog.length+' words)</div>'+
          '<div class="wc-chain">'+st.wordLog.slice(-16).reverse().map((w,i)=>'<span class="wc-chip'+(i===0?' fresh':'')+'">'+esc(w)+'</span>').join('')+'</div>'+
        '</div>':'')+
      '<div class="card"><div class="slabel">Players</div><div class="llist">'+
        st.players.map(p=>'<div class="lrow '+(p.alive?'':'dead')+'" style="cursor:default;"><div class="avatar" style="background:'+(p.alive?'var(--ink)':'var(--ink-faint)')+';">'+esc((p.name[0]||'?').toUpperCase())+'</div><div class="rname">'+esc(p.name)+'</div><span class="pill">'+(p.alive?'❤️'.repeat(p.lives)||'💔':'💀 out')+'</span></div>').join('')+
      '</div></div>'+
      leaveLink('G.confirmLeave')+'</div>';
    setTimeout(()=>{const i=document.getElementById('wcInput');if(i)i.focus();},60);
  }

  function submit(){
    stopTimer();
    const input=document.getElementById('wcInput');if(!input)return;
    const word=input.value.trim().toLowerCase().replace(/[^a-z]/g,'');
    input.value='';
    if(!word){startTimer();return;}
    const alive=st.players.filter(p=>p.alive);
    const cur=currentPlayer();
    const req=st.lastLetter;
    if(word.length<cfg.minLen){penalize(cur,'Word must be at least '+cfg.minLen+' letters!');return;}
    if(req&&word[0]!==req){penalize(cur,'Must start with "'+req.toUpperCase()+'"');return;}
    if(st.usedWords.has(word)){penalize(cur,'"'+word+'" already used!');return;}
    SFX.place();
    st.usedWords.add(word);st.wordLog.push(word);
    st.longest=Math.max(st.longest,word.length);
    st.lastLetter=word[word.length-1];
    st.turnId=nextAliveId(cur.id);st.timeLeft=cfg.timer;
    render();startTimer();
  }

  function skipTurn(){
    stopTimer();
    const alive=st.players.filter(p=>p.alive);
    const cur=currentPlayer();
    if(cur)penalize(cur,'Skipped!');
  }

  function penalize(player,reason){
    player.lives--;SFX.fail();
    if(player.lives<=0)player.alive=false;
    st.turnId=nextAliveId(player.id);
    $a().innerHTML=
      '<div class="screen"><div class="deskcard">'+
        '<div style="font-size:2.2rem;">💀</div>'+
        '<div style="font-size:1.1rem;font-weight:800;margin:8px 0;">'+esc(player.name)+': '+esc(reason)+'</div>'+
        '<p class="helptext">'+(player.lives<=0?esc(player.name)+' is <b>eliminated!</b>':'Lost a life — '+player.lives+' remaining.')+'</p>'+
        '<button class="btn btn-ink btn-block" style="margin-top:14px;" onclick="WordChain.cont()">Continue →</button>'+
      '</div></div>';
  }

  function cont(){
    const alive=st.players.filter(p=>p.alive);
    if(alive.length<=1){endScreen(alive[0]||null);return;}
    st.timeLeft=cfg.timer;render();startTimer();
  }

  function endScreen(winner){
    stopTimer();SFX.win();if(winner)burst();
    $a().innerHTML=
      '<div class="screen"><div class="deskcard" style="margin-bottom:14px;">'+
        '<div style="font-size:2.4rem;">'+(winner?'🏆':'🤝')+'</div>'+
        '<div style="font-size:1.5rem;font-weight:800;margin:6px 0;color:var(--ok-deep);">'+(winner?esc(winner.name)+' wins!':'It\'s a draw!')+'</div>'+
        '<p class="helptext">'+st.wordLog.length+' word'+(st.wordLog.length!==1?'s':'')+' in the chain · longest word: '+st.longest+'</p>'+
      '</div>'+
      (st.wordLog.length?'<div class="card"><div class="slabel">Full chain</div><div class="wc-chain">'+st.wordLog.map(w=>'<span class="wc-chip">'+esc(w)+'</span>').join('')+'</div></div>':'')+
      '<div class="brow"><button class="btn btn-ink" style="flex:1;" onclick="WordChain.deal()">Play again</button><button class="btn btn-ghost" style="flex:1;" onclick="WordChain.start()">New setup</button></div>'+
      '</div>';
  }

  return{start,rules,sc,sl,stm,sml,sn,deal,submit,skipTurn,cont};
})();

/* ================================================================
   ██████ GAME 6: 20 QUESTIONS ██████
   One thinker, 20 yes/no/maybe questions, one hidden answer.
   ================================================================ */
const TwentyQ=(()=>{
  let _count=4,_names=[],_cat='',st;

  function start(){_count=clamp(S.get('tq_count',4),3,12);setupRender();}

  function setupRender(){
    $a().innerHTML=
      '<div class="screen">'+hdr('20 Questions','Setup')+
      '<div class="card"><div class="slabel">Number of players</div>'+
        '<div class="stepper"><button onclick="TwentyQ.sc(-1)">−</button><div class="val">'+_count+'</div><button onclick="TwentyQ.sc(1)">+</button></div></div>'+
      '<div class="card"><div class="slabel">Names (one per line, optional)</div>'+

      '<div class="card"><div class="slabel">How to play</div>'+
